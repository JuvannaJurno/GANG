<!DOCTYPE html>
<html lang="tr">
<head>

    <style>
        :root {
            --primary: #2E7D32;
            --success: #388E3C;
            --danger: #C62828;
            --light: #F1F8E9;
            --dark: #1B5E20;
            --accent: #4CAF50;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2E7D32 0%, #4CAF50 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "⚖️";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 125, 50, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-cover:hover {
            background-color: rgba(46, 125, 50, 0.85);
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(56, 142, 60, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(198, 40, 40, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(46, 125, 50, 0.3);
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            transition: all 0.3s ease;
        }
        
        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .word {
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        
        .meaning {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--dark);
        }
        
        .category {
            display: inline-block;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .category-kisisel { background: #2E7D32; }
        .category-sosyal { background: #4CAF50; }
        .category-genel { background: #1B5E20; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @media (max-width: 600px) {
            .container {
                border-radius: 10px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .question {
                font-size: 1.1rem;
            }
            
            .option-btn {
                padding: 14px 16px;
                font-size: 1rem;
            }
            
            .cat-image {
                max-width: 150px;
                max-height: 120px;
            }
            
            .cat-text {
                font-size: 1rem;
            }
        }
    </style>
</head>

        class QuizManager {
            constructor() {
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.questions = [];
                this.masteredWords = [];
                
                // DOM Elements
                this.elements = {
                    question: document.getElementById('question'),
                    options: document.getElementById('options'),
                    feedback: document.getElementById('feedback'),
                    feedbackText: document.getElementById('feedbackText'),
                    nextBtn: document.getElementById('nextBtn'),
                    score: document.getElementById('score'),
                    progress: document.getElementById('progress'),
                    total: document.getElementById('total'),
                    progressBar: document.getElementById('progressBar'),
                    quizContainer: document.getElementById('quizContainer'),
                    resultsContainer: document.getElementById('resultsContainer'),
                    finalScore: document.getElementById('finalScore'),
                    resultMessage: document.getElementById('resultMessage'),
                    wordList: document.getElementById('wordList'),
                    catCover: document.getElementById('catCover')
                };
                
                this.init();
            }
            
            init() {
                this.shuffleQuestions();
                this.elements.total.textContent = this.questions.length;
                this.setupEventListeners();
                this.showCurrentQuestion();
            }
            
            shuffleQuestions() {
                this.questions = [...QUIZ_DATA];
                for (let i = this.questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.questions[i], this.questions[j]] = [this.questions[j], this.questions[i]];
                }
            }
            
            setupEventListeners() {
                this.elements.catCover.addEventListener('click', () => this.removeCatCover());
                this.elements.nextBtn.addEventListener('click', () => this.nextQuestion());
            }
            
            removeCatCover() {
                this.elements.catCover.style.display = 'none';
            }
            
            showCurrentQuestion() {
                const question = this.questions[this.currentQuestionIndex];
                
                // Soruyu göster
                this.elements.question.textContent = question.question;
                
                // Kedi kapağını sıfırla
                this.elements.catCover.style.display = 'flex';
                
                // Seçenekleri karıştır ve göster
                this.displayOptions(question);
                
                // UI'ı sıfırla
                this.resetQuestionUI();
                
                // İlerlemeyi güncelle
                this.updateProgress();
            }
            
            displayOptions(question) {
                // Önceki seçenekleri temizle
                this.elements.options.innerHTML = '';
                
                // Kedi kapağını ekle
                this.elements.options.appendChild(this.elements.catCover);
                
                // Seçenekleri karıştır
                const shuffledOptions = this.shuffleArray([...question.options]);
                
                // Her seçenek için buton oluştur
                shuffledOptions.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.className = 'option-btn fade-in';
                    button.textContent = option;
                    button.addEventListener('click', () => this.handleAnswer(option, question));
                    this.elements.options.appendChild(button);
                });
            }
            
            resetQuestionUI() {
                this.elements.feedback.style.display = 'none';
                this.elements.nextBtn.style.display = 'none';
                this.elements.progress.textContent = this.currentQuestionIndex + 1;
            }
            
            updateProgress() {
                const progressPercent = ((this.currentQuestionIndex + 1) / this.questions.length) * 100;
                this.elements.progressBar.style.width = `${progressPercent}%`;
            }
            
            handleAnswer(selectedOption, question) {
                const buttons = document.querySelectorAll('.option-btn');
                const correctOption = question.options[question.correctAnswer];
                
                // Tüm butonları devre dışı bırak
                buttons.forEach(button => {
                    button.disabled = true;
                    
                    // Doğru cevabı işaretle
                    if (button.textContent === correctOption) {
                        button.classList.add('correct');
                    }
                    
                    // Yanlış seçileni işaretle
                    if (button.textContent === selectedOption && button.textContent !== correctOption) {
                        button.classList.add('incorrect');
                    }
                });
                
                // Puanı güncelle
                const isCorrect = selectedOption === correctOption;
                if (isCorrect) {
                    this.score++;
                    this.elements.score.textContent = this.score;
                    
                    // Öğrenilen kelimelere ekle
                    this.addToMasteredWords(question);
                }
                
                // Geri bildirimi göster
                this.showFeedback(isCorrect, question, correctOption);
                
                // Sonraki butonunu göster
                this.elements.nextBtn.style.display = 'block';
            }
            
            addToMasteredWords(question) {
                const alreadyExists = this.masteredWords.some(w => w.question === question.question);
                if (!alreadyExists) {
                    this.masteredWords.push(question);
                }
            }
            
            showFeedback(isCorrect, question, correctOption) {
                this.elements.feedback.style.display = 'block';
                this.elements.feedback.className = `feedback ${isCorrect ? 'correct-feedback' : 'incorrect-feedback'}`;
                
                let feedbackHTML = '';
                if (isCorrect) {
                    feedbackHTML = `✅ Doğru!<br><br>${question.meaning}`;
                } else {
                    feedbackHTML = `❌ Yanlış!<br>Doğru cevap: <strong>${correctOption}</strong><br><br>${question.meaning}`;
                }
                
                this.elements.feedbackText.innerHTML = feedbackHTML;
            }
            
            nextQuestion() {
                this.currentQuestionIndex++;
                
                if (this.currentQuestionIndex < this.questions.length) {
                    this.showCurrentQuestion();
                } else {
                    this.endQuiz();
                }
            }
            
            endQuiz() {
                this.elements.quizContainer.style.display = 'none';
                this.elements.resultsContainer.style.display = 'block';
                
                const percentage = Math.round((this.score / this.questions.length) * 100);
                this.elements.finalScore.textContent = `${this.score}/${this.questions.length} (${percentage}%)`;
                
                this.showResultMessage(percentage);
                this.displayAllWords();
            }
            
            showResultMessage(percentage) {
                let message = "";
                if (percentage >= 90) {
                    message = "Mükemmel! Temel Hak ve Ödevler konusunu çok iyi biliyorsunuz! 🏆";
                } else if (percentage >= 70) {
                    message = "Çok iyi! Temel bilgilere hakimsiniz. 👍";
                } else if (percentage >= 50) {
                    message = "Güzel! Bilginizi geliştirmeye devam edin. 💪";
                } else {
                    message = "Öğrenmeye devam! Konuyu tekrar etmeniz faydalı olacaktır. 📚";
                }
                
                this.elements.resultMessage.textContent = message;
            }
            
            displayAllWords() {
                this.elements.wordList.innerHTML = '<h3 style="color: var(--primary); margin-bottom: 20px;">Öğrenilen Tüm Bilgiler</h3>';
                
                QUIZ_DATA.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'word-card fade-in';
                    card.innerHTML = `
                        <div class="word">${item.question}</div>
                        <div class="meaning">${item.meaning}</div>
                        <div class="category ${this.getCategoryClass(item.category)}">${item.category === "Kişisel" ? "Kişisel Haklar" : "Sosyal Haklar"}</div>
                    `;
                    this.elements.wordList.appendChild(card);
                });
            }
            
            getCategoryClass(category) {
                const classMap = {
                    'Kişisel': 'category-kisisel',
                    'Sosyal': 'category-sosyal'
                };
                return classMap[category] || 'category-genel';
            }
            
            shuffleArray(array) {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            }
        }

        // Uygulamayı başlat
        document.addEventListener('DOMContentLoaded', () => {
            new QuizManager();
        });
    </script>
