<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGS Coğrafya - Tarım, Maden ve Enerji Drill</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #475569;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .section { margin-bottom: 1.5rem; }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: background 0.2s;
        }

        .radio-label:hover { background: var(--bg); }
        .radio-label input[type="radio"] { transform: scale(1.2); }

        .category-block { margin-bottom: 1rem; background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        
        .parent-cb {
            font-weight: bold;
            font-size: 1.1rem;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
        }

        .child-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .child-cb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            padding: 0.25rem 0;
        }

        input[type="checkbox"] {
            transform: scale(1.2);
            accent-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        
        #next-btn {
            background-color: var(--success);
            margin-top: 1rem;
            display: none;
        }

        /* Drill Area */
        #drill-area { display: none; }
        
        .image-container {
            width: 100%;
            min-height: 250px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Siyah Beyaz Sınıfı */
        .grayscale {
            filter: grayscale(100%);
        }

        .hint-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #1e3a8a;
            display: none;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .option-btn {
            background: white;
            color: var(--text);
            border: 2px solid var(--border);
            font-weight: 500;
            padding: 1rem 0.5rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .option-btn.wrong {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }

        .option-btn:disabled { cursor: not-allowed; }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .back-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            width: auto;
            font-size: 0.9rem;
            margin: 0;
        }

        /* Feedback Image Container */
        .feedback-box {
            display: none;
            margin-top: 1.5rem;
            text-align: center;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 8px;
            border: 1px dashed var(--primary);
        }

        .feedback-box p {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .feedback-box img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .feedback-hint-text {
            font-weight: normal;
            color: #1e3a8a;
            text-align: left;
            line-height: 1.5;
            margin-top: 0.5rem;
            display: none;
        }

        @media (max-width: 480px) {
            .child-group { grid-template-columns: 1fr; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>

    <div class="container" id="setup-area">
        <h1>AGS Coğrafya Drill</h1>
        
        <div class="section">
            <h2>Test Modu Seç</h2>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="mode" value="harita" checked>
                    1. Haritada Dağılış Yerleri
                </label>
                <label class="radio-label">
                    <input type="radio" name="mode" value="sehir">
                    2. İpuçları (Şehir/Özellik) ile Bil
                </label>
            </div>
        </div>

        <div class="section">
            <h2>Görsel Tercihi</h2>
            <div class="radio-group" style="flex-direction: row; gap: 1rem;">
                <label class="radio-label" style="flex: 1;">
                    <input type="radio" name="colorMode" value="bw" checked>
                    Siyah Beyaz
                </label>
                <label class="radio-label" style="flex: 1;">
                    <input type="radio" name="colorMode" value="color">
                    Renkli
                </label>
            </div>
        </div>

        <div class="section">
            <h2>Ürün/Maden Seçimi</h2>
            <div id="categories-container">
                </div>
        </div>

        <button onclick="startDrill()">Teste Başla</button>
    </div>

    <div class="container" id="drill-area">
        <div class="header-controls">
            <button class="back-btn" onclick="endDrill()">← Geri Dön</button>
            <span id="progress-counter">1 / 10</span>
        </div>

        <div class="image-container">
            <img id="question-image" src="" alt="Soru Görseli">
        </div>

        <div id="hint-container" class="hint-box">
            <strong>AGS İpucu:</strong> <span id="hint-text"></span>
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div id="feedback-container" class="feedback-box">
            <p id="feedback-title">En Çok Yetişen/Çıkarılan Şehirler</p>
            <img id="feedback-image" src="" alt="Geri Bildirim Haritası">
            <div id="feedback-hint" class="feedback-hint-text"></div>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Sıradaki Soru →</button>
    </div>

        };

        let currentDrillQueue = [];
        let currentIndex = 0;
        let selectedMode = 'harita';
        let isGrayscale = true;

        function initCheckboxes() {
            const container = document.getElementById('categories-container');
            container.innerHTML = ''; 

            for (const [categoryName, items] of Object.entries(categoriesData)) {
                const categoryId = categoryName.replace(/\s+/g, '-').toLowerCase();
                
                const block = document.createElement('div');
                block.className = 'category-block';

                const parentLabel = document.createElement('label');
                parentLabel.className = 'parent-cb';
                parentLabel.innerHTML = `
                    <input type="checkbox" id="${categoryId}" checked onchange="toggleParent('${categoryId}')">
                    ${categoryName}
                `;
                block.appendChild(parentLabel);

                const childGroup = document.createElement('div');
                childGroup.className = 'child-group';

                items.forEach(itemKey => {
                    if(cropsData[itemKey]) {
                        const childLabel = document.createElement('label');
                        childLabel.className = 'child-cb';
                        childLabel.innerHTML = `
                            <input type="checkbox" value="${itemKey}" class="drill-cb child-of-${categoryId}" checked onchange="checkParent('${categoryId}')">
                            ${cropsData[itemKey].name}
                        `;
                        childGroup.appendChild(childLabel);
                    }
                });

                block.appendChild(childGroup);
                container.appendChild(block);
            }
        }

        function toggleParent(categoryId) {
            const isChecked = document.getElementById(categoryId).checked;
            const children = document.querySelectorAll(`.child-of-${categoryId}`);
            children.forEach(child => child.checked = isChecked);
        }

        function checkParent(categoryId) {
            const children = document.querySelectorAll(`.child-of-${categoryId}`);
            const allChecked = Array.from(children).every(c => c.checked);
            const someChecked = Array.from(children).some(c => c.checked);
            const parent = document.getElementById(categoryId);
            
            parent.checked = allChecked;
            parent.indeterminate = someChecked && !allChecked;
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startDrill() {
            const selectedRadios = document.querySelector('input[name="mode"]:checked');
            selectedMode = selectedRadios.value;

            const selectedColorMode = document.querySelector('input[name="colorMode"]:checked').value;
            isGrayscale = (selectedColorMode === 'bw');

            const selectedCbs = document.querySelectorAll('.drill-cb:checked');
            if (selectedCbs.length === 0) {
                alert("Lütfen en az bir ürün/maden seçin!");
                return;
            }

            currentDrillQueue = Array.from(selectedCbs).map(cb => cb.value);
            currentDrillQueue = shuffle(currentDrillQueue);
            currentIndex = 0;

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('drill-area').style.display = 'block';

            loadQuestion();
        }

        function generateOptions(correctKey) {
            // Doğru cevabın bulunduğu kategoriyi bul ve çeldiricileri oradan seç
            let targetCategoryItems = [];
            for (const items of Object.values(categoriesData)) {
                if (items.includes(correctKey)) {
                    targetCategoryItems = items;
                    break;
                }
            }

            let distractors = targetCategoryItems.filter(k => k !== correctKey && cropsData[k]);
            
            if (distractors.length < 3) {
                const allKeys = Object.keys(cropsData);
                let fallback = allKeys.filter(k => k !== correctKey && !distractors.includes(k));
                distractors = distractors.concat(shuffle(fallback));
            }

            distractors = shuffle(distractors).slice(0, 3);
            let options = [...distractors, correctKey];
            return shuffle(options);
        }

        function applyColorMode() {
            const qImg = document.getElementById('question-image');
            const fImg = document.getElementById('feedback-image');
            
            if (isGrayscale) {
                qImg.classList.add('grayscale');
                fImg.classList.add('grayscale');
            } else {
                qImg.classList.remove('grayscale');
                fImg.classList.remove('grayscale');
            }
        }

        function loadQuestion() {
            const cropKey = currentDrillQueue[currentIndex];
            const crop = cropsData[cropKey];

            // Set Image
            const imgEl = document.getElementById('question-image');
            // Eğer şehir modu seçildiyse ve şehir resmi harita ile aynıysa (madenler gibi), haritayı gösterir
            imgEl.src = selectedMode === 'harita' ? crop.map : crop.city;
            
            applyColorMode();

            // Update Progress
            document.getElementById('progress-counter').innerText = `${currentIndex + 1} / ${currentDrillQueue.length}`;

            // Handle Hints
            const hintContainer = document.getElementById('hint-container');
            if (selectedMode === 'sehir') {
                document.getElementById('hint-text').innerText = crop.hints;
                hintContainer.style.display = 'block';
            } else {
                hintContainer.style.display = 'none';
            }

            // Generate Options
            const optionsGrid = document.getElementById('options-container');
            optionsGrid.innerHTML = '';
            
            const currentOptions = generateOptions(cropKey);
            currentOptions.forEach(optKey => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = cropsData[optKey].name;
                btn.onclick = () => checkAnswer(btn, optKey, cropKey);
                optionsGrid.appendChild(btn);
            });

            document.getElementById('feedback-container').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function checkAnswer(selectedBtn, selectedKey, correctKey) {
            // Disable all buttons
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            // Şıkkı kontrol et
            if (selectedKey === correctKey) {
                selectedBtn.classList.add('correct');
            } else {
                selectedBtn.classList.add('wrong');
                allBtns.forEach(btn => {
                    if (btn.innerText === cropsData[correctKey].name) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Harita Modu Geri Bildirimi
            if (selectedMode === 'harita') {
                const feedbackContainer = document.getElementById('feedback-container');
                const feedbackImg = document.getElementById('feedback-image');
                const feedbackTitle = document.getElementById('feedback-title');
                const feedbackHint = document.getElementById('feedback-hint');

                feedbackContainer.style.display = 'block';

                // Eğer ikinci bir resim (şehir resmi) varsa onu göster (Tarım ve Hayvancılık için)
                if (cropsData[correctKey].map !== cropsData[correctKey].city) {
                    feedbackTitle.innerText = "En Çok Yetişen / Üretilen Şehirler";
                    feedbackImg.src = cropsData[correctKey].city;
                    feedbackImg.style.display = 'inline-block';
                    feedbackHint.style.display = 'none';
                } 
                // İkinci resim yoksa (Madenler ve Enerji için) doğrudan AGS ipucunu göster!
                else {
                    feedbackTitle.innerText = "Nokta Atışı AGS Bilgileri";
                    feedbackImg.style.display = 'none';
                    feedbackHint.innerText = cropsData[correctKey].hints;
                    feedbackHint.style.display = 'block';
                }
            }

            // Show Next Button
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'block';
            
            if (currentIndex === currentDrillQueue.length - 1) {
                nextBtn.innerText = "Testi Bitir ↺";
            } else {
                nextBtn.innerText = "Sıradaki Soru →";
            }
        }

        function nextQuestion() {
            if (currentIndex < currentDrillQueue.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                endDrill();
            }
        }

        function endDrill() {
            document.getElementById('drill-area').style.display = 'none';
            document.getElementById('setup-area').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Run on load
        window.onload = initCheckboxes;
    </script>
