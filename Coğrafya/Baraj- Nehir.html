<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baraj - Nehir Eşleştirme Testi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .quiz-container { background-color: #ffffff; width: 100%; max-width: 480px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); padding: 24px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .header { margin-bottom: 20px; }
        .title { font-size: 18px; font-weight: 700; color: #2c3e50; text-align: center; margin-bottom: 15px; }
        .progress-container { width: 100%; height: 6px; background-color: #eef2f5; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar { height: 100%; background-color: #e67e22; width: 0%; transition: width 0.3s ease; }
        .stats { display: flex; justify-content: space-between; font-size: 13px; color: #7f8c8d; font-weight: 500; }
        .question-box { background-color: #fcf6ee; border-radius: 12px; padding: 24px 16px; margin-bottom: 20px; border: 1px solid #f6e5d3; text-align: center; }
        .question-text { font-size: 20px; font-weight: 600; color: #d35400; }
        .sub-text { font-size: 14px; color: #7f8c8d; margin-top: 8px; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn { background-color: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; color: #4a5568; cursor: pointer; text-align: left; transition: all 0.2s ease; width: 100%; outline: none; -webkit-tap-highlight-color: transparent; }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background-color: #2ecc71; border-color: #2ecc71; color: #ffffff; }
        .option-btn.incorrect { background-color: #e74c3c; border-color: #e74c3c; color: #ffffff; }
        .option-btn.disabled { pointer-events: none; opacity: 0.6; }
        .option-btn.disabled.correct, .option-btn.disabled.incorrect { opacity: 1; }
        .next-btn { background-color: #d35400; color: #ffffff; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background-color 0.2s; display: none; }
        .next-btn:hover { background-color: #ba4a00; }
        .result-screen { text-align: center; display: none; padding: 10px 0; }
        .result-title { font-size: 22px; font-weight: 700; color: #2c3e50; margin-bottom: 15px; }
        .score-text { font-size: 48px; font-weight: 800; color: #e67e22; margin-bottom: 10px; }
        .feedback-text { font-size: 15px; color: #7f8c8d; margin-bottom: 24px; line-height: 1.5; }
        .restart-btn { background-color: #e67e22; color: #ffffff; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
    </style>
<link rel="stylesheet" href="../menu-back.css">
</head>
<body>
<a class="ags-menu-back" href="../index.html#cografya" aria-label="Ana menüye dön">← Menüye dön</a>
    <div class="quiz-container">
        <div id="quiz-screen">
            <div class="header">
                <div class="title">Baraj - Nehir Eşleştirme Testi</div>
                <div class="progress-container"><div class="progress-bar" id="progress"></div></div>
                <div class="stats">
                    <span id="question-number">Soru: 1/25</span>
                    <span id="score-counter">Doğru: 0</span>
                </div>
            </div>
            <div class="question-box">
                <div class="question-text" id="question">Yükleniyor...</div>
                <div class="sub-text">Hangi nehir üzerindedir?</div>
            </div>
            <div class="options-container" id="options"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Sonraki Baraj</button>
        </div>
        <div id="result-screen" class="result-screen">
            <div class="result-title">Test Tamamlandı!</div>
            <div class="score-text" id="final-score">0/0</div>
            <div class="feedback-text" id="feedback">Analiz hazırlanıyor...</div>
            <button class="restart-btn" onclick="restartQuiz()">Karıştır ve Yeniden Başla</button>
        </div>
    </div>

    <script>
        const quizData = [{"dam": "Atatürk Barajı", "river": "Fırat"}, {"dam": "Keban Barajı", "river": "Fırat"}, {"dam": "Karakaya Barajı", "river": "Fırat"}, {"dam": "Birecik Barajı", "river": "Fırat"}, {"dam": "Ilısu (Veysel Eroğlu) Barajı", "river": "Dicle"}, {"dam": "Kralkızı Barajı", "river": "Dicle"}, {"dam": "Batman Barajı", "river": "Dicle"}, {"dam": "Hirfanlı Barajı", "river": "Kızılırmak"}, {"dam": "Altınkaya Barajı", "river": "Kızılırmak"}, {"dam": "Derbent Barajı", "river": "Kızılırmak"}, {"dam": "Almus Barajı", "river": "Yeşilırmak"}, {"dam": "Hasan Uğurlu Barajı", "river": "Yeşilırmak"}, {"dam": "Suat Uğurlu Barajı", "river": "Yeşilırmak"}, {"dam": "Yusufeli Barajı", "river": "Çoruh"}, {"dam": "Deriner Barajı", "river": "Çoruh"}, {"dam": "Borçka Barajı", "river": "Çoruh"}, {"dam": "Hasan Polatkan (Sarıyar) Barajı", "river": "Sakarya"}, {"dam": "Gökçekaya Barajı", "river": "Sakarya"}, {"dam": "Seyhan Barajı", "river": "Seyhan"}, {"dam": "Çatalan Barajı", "river": "Seyhan"}, {"dam": "Menzelet Barajı", "river": "Ceyhan"}, {"dam": "Aslantaş Barajı", "river": "Ceyhan"}, {"dam": "Kemer Barajı", "river": "Büyük Menderes"}, {"dam": "Demirköprü Barajı", "river": "Gediz"}, {"dam": "Oymapınar Barajı", "river": "Manavgat"}];
        const allRivers = ["Fırat", "Dicle", "Kızılırmak", "Yeşilırmak", "Çoruh", "Sakarya", "Seyhan", "Ceyhan", "Büyük Menderes", "Gediz", "Manavgat"];
        
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateOptions(correctRiver) {
            let options = [correctRiver];
            let availableRivers = allRivers.filter(r => r !== correctRiver);
            shuffleArray(availableRivers);
            
            options.push(availableRivers[0]);
            options.push(availableRivers[1]);
            options.push(availableRivers[2]);
            
            shuffleArray(options);
            return options;
        }

        function initQuiz() {
            shuffleArray(quizData);
            currentQuestionIndex = 0;
            score = 0;
            answered = false;
            document.getElementById("quiz-screen").style.display = "block";
            document.getElementById("result-screen").style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            document.getElementById("question").innerText = currentQuestion.dam;
            document.getElementById("question-number").innerText = `Soru: ${currentQuestionIndex + 1}/${quizData.length}`;
            document.getElementById("score-counter").innerText = `Doğru: ${score}`;
            
            const progressPercent = (currentQuestionIndex / quizData.length) * 100;
            document.getElementById("progress").style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = '';
            
            const currentOptions = generateOptions(currentQuestion.river);
            
            currentOptions.forEach(optionText => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, currentQuestion.river);
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById("next-btn").style.display = "none";
        }

        function checkAnswer(selectedBtn, selectedText, correctText) {
            if (answered) return;
            answered = true;

            const buttons = document.querySelectorAll(".option-btn");

            if (selectedText === correctText) {
                selectedBtn.classList.add("correct");
                score++;
                document.getElementById("score-counter").innerText = `Doğru: ${score}`;
            } else {
                selectedBtn.classList.add("incorrect");
                buttons.forEach(btn => {
                    if (btn.innerText === correctText) {
                        btn.classList.add("correct");
                    }
                });
            }

            buttons.forEach(btn => btn.classList.add("disabled"));
            document.getElementById("next-btn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("progress").style.width = "100%";
            document.getElementById("quiz-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "block";
            
            document.getElementById("final-score").innerText = `${score} / ${quizData.length}`;
            
            let feedback = "";
            const ratio = score / quizData.length;
            if (ratio >= 0.9) {
                feedback = "Mükemmel! Türkiye'nin sularına tamamen hakimsin.";
            } else if (ratio >= 0.7) {
                feedback = "Gayet iyi. Nehirlerin yataklarını büyük oranda oturtmuşsun.";
            } else if (ratio >= 0.4) {
                feedback = "Kafanda nehirler biraz birbirine girmiş. Fırat, Dicle ve Çoruh üçlüsüne öncelik vererek tekrar yapabilirsin.";
            } else {
                feedback = "Bu konu şimdilik zayıf görünüyor. Testi ara ara çözerek doğru eşleştirmeleri görsel hafızana kazıyabilirsin.";
            }
            document.getElementById("feedback").innerText = feedback;
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
