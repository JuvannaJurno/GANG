<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coğrafya Nüfus Pratikleri</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --success: #27ae60;
            --danger: #e74c3c;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --warning: #f39c12;
            --warning-hover: #e67e22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 30px 20px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 20px; }

        /* Menu Styles */
        .menu-btn {
            display: block; width: 100%; padding: 18px; margin-bottom: 15px;
            background-color: #ebf5fb; color: var(--primary); border: 2px solid var(--accent);
            border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover { background-color: var(--accent); color: white; }
        
        .mode-desc { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; display: block; margin-top: 5px; }

        /* Quiz Styles */
        header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--bg-color); position: relative; }
        .back-btn { position: absolute; left: 0; top: 0; background: none; border: none; color: var(--text-muted); font-weight: bold; cursor: pointer; font-size: 1rem; padding: 5px; }
        .progress { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; margin-top: 10px; }

        .question-text { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-bottom: 15px; line-height: 1.4; }
        .instruction { font-size: 0.95rem; color: var(--accent); font-weight: bold; margin-bottom: 20px; background-color: #ebf5fb; padding: 10px; border-radius: 8px; border: 1px dashed var(--accent); }

        .options-grid { display: grid; gap: 10px; margin-bottom: 25px; }
        .options-grid.two-cols { grid-template-columns: 1fr 1fr; }
        .options-grid.one-col { grid-template-columns: 1fr; }

        .option-btn {
            background-color: var(--bg-color); border: 2px solid transparent; border-radius: 10px;
            padding: 14px 10px; font-size: 0.95rem; font-weight: 600; color: var(--primary);
            cursor: pointer; transition: all 0.2s ease; user-select: none; text-align: left;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.selected { background-color: #ebf5fb; border-color: var(--accent); color: var(--accent); }
        .option-btn.correct { background-color: #eafaf1; border-color: var(--success); color: var(--success); }
        .option-btn.wrong { background-color: #fdedec; border-color: var(--danger); color: var(--danger); }

        .action-btn {
            width: 100%; background-color: var(--accent); color: white; border: none; border-radius: 10px;
            padding: 16px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s;
        }
        .action-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        .cheat-btn {
            background-color: var(--warning);
            margin-bottom: 15px;
            font-size: 1rem;
            padding: 12px;
        }
        .cheat-btn:hover { background-color: var(--warning-hover); }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 0.95rem; font-weight: 500; line-height: 1.5; display: none; text-align: left; }
        .feedback.success { display: block; background-color: #eafaf1; color: var(--success); border: 1px solid var(--success); }
        .feedback.error { display: block; background-color: #fdedec; color: var(--danger); border: 1px solid var(--danger); }
        .feedback.info { display: block; background-color: #fcf3cf; color: #b9770e; border: 1px solid #f1c40f; }

        .hidden { display: none !important; }

        .score-circle {
            width: 100px; height: 100px; border-radius: 50%; background-color: #ebf5fb; color: var(--accent);
            display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;
            margin: 0 auto 20px auto; border: 4px solid var(--accent);
        }

        /* Modal Styles */
        #map-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        #map-modal img {
            max-width: 100%; border-radius: 8px; margin-bottom: 25px; border: 2px solid white;
        }
        .close-modal-btn {
            background: white; color: var(--primary); border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; border-radius: 8px; cursor: pointer;
        }

        .results-maps img { width: 100%; border-radius: 8px; margin-bottom: 15px; border: 2px solid #ddd; }
    </style>
<link rel="stylesheet" href="../menu-back.css">
</head>
<body>
<a class="ags-menu-back" href="../index.html#cografya" aria-label="Ana menüye dön">← Menüye dön</a>

    <!-- MAP MODAL (Kopya Çek) -->
    <div id="map-modal" class="hidden">
        <button class="close-modal-btn" onclick="toggleMapModal()">Kapat</button>
        <h3 style="color: white; margin-bottom: 10px;">Seyrek Nüfus Haritası</h3>
        <img src="https://i.imgur.com/cUr91JR.jpeg" alt="Seyrek Nüfus Haritası">
        <h3 style="color: white; margin-bottom: 10px;">Yoğun Nüfus Haritası</h3>
        <img src="https://i.imgur.com/5Z0YoFL.jpeg" alt="Yoğun Nüfus Haritası">
    </div>

    <div class="container" id="menu-screen">
        <h1>Coğrafya Pratikleri</h1>
        <p style="margin-bottom: 25px; color: var(--text-muted);">Çalışmak istediğiniz modu seçin:</p>
        
        <button class="menu-btn" onclick="startMode(1)">
            Mod 1: Ne, Nerede?
            <span class="mode-desc">İlkler, mağaralar, nüfus yoğunluğu...</span>
        </button>
        <button class="menu-btn" onclick="startMode(2)">
            Mod 2: Nüfus Politikaları
            <span class="mode-desc">Yıllara göre politikalar, yöntemler ve nedenleri</span>
        </button>
        <button class="menu-btn" onclick="startMode(3)">
            Mod 3: Seyrek mi, Sık mı?
            <span class="mode-desc">Bölgelerin nüfus yoğunluğu tahmini</span>
        </button>
    </div>

    <div class="container hidden" id="quiz-screen">
        <header>
            <button class="back-btn" onclick="showMenu()">&#8592; Menü</button>
            <h1 id="mode-title">Mod Başlığı</h1>
            <div class="progress">Soru: <span id="current-q">1</span> / <span id="total-q">10</span></div>
        </header>

        <button id="cheat-btn" class="action-btn cheat-btn hidden" onclick="toggleMapModal()">👀 Kopya Çek (Haritalara Bak)</button>

        <div class="question-text" id="question-text">Soru metni buraya gelecek...</div>
        <div class="instruction hidden" id="instruction-text">İpucu metni</div>

        <div class="options-grid" id="options-container"></div>

        <button class="action-btn" id="submit-btn" disabled>Cevapla</button>
        <button class="action-btn hidden" id="next-btn">Sonraki</button>

        <div class="feedback" id="feedback-text"></div>
    </div>

    <div class="container hidden" id="results-screen">
        <h1>Test Tamamlandı!</h1>
        <div class="score-circle"><span id="score-text">0/0</span></div>

        <div id="results-maps" class="results-maps hidden">
            <h3 style="margin-bottom: 10px; font-size: 1.1rem; color: var(--primary);">Seyrek Nüfus Haritası</h3>
            <img src="https://i.imgur.com/cUr91JR.jpeg" alt="Seyrek Nüfus Haritası">
            <h3 style="margin-bottom: 10px; font-size: 1.1rem; color: var(--primary);">Yoğun Nüfus Haritası</h3>
            <img src="https://i.imgur.com/5Z0YoFL.jpeg" alt="Yoğun Nüfus Haritası">
        </div>

        <button class="action-btn" style="margin-bottom: 10px;" onclick="restartCurrentMode()">Tekrar Çöz</button>
        <button class="action-btn" style="background-color: var(--primary);" onclick="showMenu()">Ana Menüye Dön</button>
    </div>

        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showMenu() {
            ui.menu.classList.remove('hidden');
            ui.quiz.classList.add('hidden');
            ui.results.classList.add('hidden');
            ui.resultsMaps.classList.add('hidden');
            ui.cheatBtn.classList.add('hidden');
            ui.mapModal.classList.add('hidden');
        }

        function startMode(modeNum) {
            currentMode = modeNum;
            currentIndex = 0;
            score = 0;
            
            ui.menu.classList.add('hidden');
            ui.results.classList.add('hidden');
            ui.quiz.classList.remove('hidden');

            ui.cheatBtn.classList.add('hidden');
            ui.resultsMaps.classList.add('hidden');

            if (modeNum === 1) {
                ui.title.textContent = "Ne, Nerede?";
                activeQuestions = shuffle([...mode1Data]);
            } else if (modeNum === 2) {
                ui.title.textContent = "Nüfus Politikaları";
                activeQuestions = [...mode2Data]; 
            } else if (modeNum === 3) {
                ui.title.textContent = "Seyrek mi, Sık mı?";
                ui.cheatBtn.classList.remove('hidden');
                
                let pool = shuffle([...rawMode3]).slice(0, 10);
                activeQuestions = pool.map(item => ({
                    type: "single",
                    q: `"${item.place}" nüfus yoğunluğu bakımından nasıldır?`,
                    a: [item.type + " Nüfus"], 
                    options: ["Seyrek Nüfus", "Sık Nüfus"],
                    exp: `${item.place}, ${item.type} nüfuslu bir alandır.`
                }));
            }

            ui.totalQ.textContent = activeQuestions.length;
            loadQuestion();
        }

        function restartCurrentMode() {
            startMode(currentMode);
        }

        function loadQuestion() {
            isAnswered = false;
            selectedOptions.clear();
            const qData = activeQuestions[currentIndex];
            
            ui.currentQ.textContent = currentIndex + 1;
            ui.qText.textContent = qData.q;
            ui.feedback.className = "feedback hidden";
            ui.submit.classList.remove('hidden');
            ui.submit.disabled = true;
            ui.next.classList.add('hidden');

            if (qData.type === 'multi') {
                ui.instruction.textContent = `Lütfen ${qData.a.length} adet doğru seçeneği işaretleyin.`;
                ui.instruction.classList.remove('hidden');
                ui.options.className = "options-grid one-col";
            } else {
                ui.instruction.classList.add('hidden');
                if (currentMode === 3) {
                    ui.options.className = "options-grid two-cols";
                } else {
                    ui.options.className = "options-grid one-col";
                }
            }

            renderOptions(qData);
        }

        function renderOptions(qData) {
            ui.options.innerHTML = '';
            
            let opts = (currentMode === 3) ? qData.options : shuffle([...qData.options]);
            
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => toggleOption(opt, btn, qData);
                ui.options.appendChild(btn);
            });
        }

        function toggleOption(opt, btnElement, qData) {
            if (isAnswered) return;

            const isMulti = qData.type === 'multi';
            const maxAllowed = isMulti ? qData.a.length : 1;

            if (selectedOptions.has(opt)) {
                selectedOptions.delete(opt);
                btnElement.classList.remove('selected');
            } else {
                if (!isMulti) {
                    selectedOptions.clear();
                    Array.from(ui.options.children).forEach(b => b.classList.remove('selected'));
                }
                
                if (selectedOptions.size < maxAllowed || !isMulti) {
                    selectedOptions.add(opt);
                    btnElement.classList.add('selected');
                }
            }

            ui.submit.disabled = selectedOptions.size !== maxAllowed;
        }

        ui.submit.onclick = () => {
            const qData = activeQuestions[currentIndex];
            const maxAllowed = qData.type === 'multi' ? qData.a.length : 1;
            
            if (selectedOptions.size !== maxAllowed) return;
            
            isAnswered = true;
            ui.submit.classList.add('hidden');
            ui.next.classList.remove('hidden');

            let isPerfectMatch = true;
            
            Array.from(ui.options.children).forEach(btn => {
                const opt = btn.textContent;
                const isSelected = selectedOptions.has(opt);
                const isCorrect = qData.a.includes(opt);

                if (isSelected && isCorrect) {
                    btn.classList.add('correct');
                } else if (isSelected && !isCorrect) {
                    btn.classList.add('wrong');
                    isPerfectMatch = false;
                } else if (!isSelected && isCorrect) {
                    btn.classList.add('correct');
                    btn.style.borderStyle = 'dashed';
                    isPerfectMatch = false;
                }
                
                if (!isSelected && !isCorrect) {
                    btn.style.opacity = '0.5';
                }
            });

            if (isPerfectMatch) score++;

            let fbClass = isPerfectMatch ? "success" : "error";
            let fbTitle = isPerfectMatch ? "Tebrikler, doğru!" : "Yanlış cevap.";
            
            ui.feedback.innerHTML = `<strong>${fbTitle}</strong><br><br>${qData.exp}`;
            
            if (currentMode === 2 && qData.type === 'multi') {
                 ui.feedback.className = `feedback info`;
            } else {
                 ui.feedback.className = `feedback ${fbClass}`;
            }
        };

        ui.next.onclick = () => {
            currentIndex++;
            if (currentIndex < activeQuestions.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        };

        function endQuiz() {
            ui.quiz.classList.add('hidden');
            ui.results.classList.remove('hidden');
            ui.score.textContent = `${score}/${activeQuestions.length}`;
            
            if (currentMode === 3) {
                ui.resultsMaps.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
