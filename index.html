 ['Rehberlik ve PDR',n=>n.startsWith('Rehberlik')||n.startsWith('PDR')],
 ['Program Geliştirme ve Eğitim Yönetimi',n=>n.startsWith('Program')||n.startsWith('PY-')],
 ['MEB Kurumları',n=>n.startsWith('MEB')]
];
definitions.Cografya = [
 ['Yer Şekilleri ve Jeolojik Oluşum',n=>/Dağ|Jeolojik|Geçitleri/.test(n)],
 ['Akarsular, Havzalar ve Barajlar',n=>/Akarsuları|Baraj/.test(n)],
 ['Nüfus ve Yerleşme',n=>/Nüfus|Yerleşmeler|Büyükşehir/.test(n)],
 ['Tarım, Maden ve Enerji',n=>n.startsWith('Extensive')],
 ['Ulaşım ve Sınır Kapıları',n=>/Tünelleri|Sınır Kapıları/.test(n)],
 ['Millî Parklar ve UNESCO',n=>n.startsWith('milli park')]
];
const labels={Tarih:'Tarih',Inkilap:'İnkılap',Mevzuat:'Mevzuat',Egitim:'Eğitim Bilimleri',Cografya:'Coğrafya'};
const hashes={tarih:'Tarih',inkilap:'Inkilap',mevzuat:'Mevzuat','egitim-bilimleri':'Egitim',cografya:'Cografya'};
const readSection=()=>hashes[location.hash.slice(1)]||'Tarih';
const grouped = {};
for(const section of Object.keys(definitions)){
 const remaining = new Set(catalog.filter(f=>f.section===section));
 grouped[section]=definitions[section].map(([name,match])=>{const files=[...remaining].filter(f=>match(f.name));files.forEach(f=>remaining.delete(f));return {name,files};}).filter(g=>g.files.length);
 if(remaining.size)grouped[section].push({name:'Diğer Quizler',files:[...remaining]});
}
const normalize=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
let active = readSection();
const query=document.getElementById('search');
function kind(name){return name.includes('Şeridi')?'Zaman çizelgesi':name.includes('Eşleştirme')||name.includes('Durakları')?'Etkileşimli etkinlik':name.includes('AI Seçkisi')?'Seçki test':name.includes('Yapılar')?'Görsel test':'Konu testi';}
function newTag(){const tag=document.createElement('span');tag.className='new-tag';tag.textContent='NEW';tag.setAttribute('aria-label','Yeni');return tag;}
function render(){
 document.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.section===active)));
 document.getElementById('heading').textContent=labels[active]+' konuları';
 const target=document.getElementById('groups');target.replaceChildren();
 const term=normalize(query.value.trim());let total=0,shown=0;
 grouped[active].forEach((group,index)=>{
  const files=group.files.filter(f=>!term||normalize(group.name+' '+f.name).includes(term));if(!files.length)return;
  total+=files.length;shown++;
  const detail=document.createElement('details');detail.open=Boolean(term);
  const summary=document.createElement('summary');
  const number=document.createElement('span');number.className='number';number.textContent=String(index+1).padStart(2,'0');
  const name=document.createElement('span');name.className='group-name';name.textContent=group.name;if(['Egitim','Cografya'].includes(active))name.append(newTag());
  const badge=document.createElement('span');badge.className='badge';badge.textContent=files.length+(['Egitim','Cografya'].includes(active)?' içerik':' quiz');
  const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');summary.append(number,name,badge,arrow);
  const list=document.createElement('div');list.className='tests';
  files.forEach(file=>{const a=document.createElement('a');a.className='test';a.href=file.path.split('/').map(encodeURIComponent).join('/');const text=document.createElement('span');const title=document.createElement('span');title.className='test-title';title.textContent=file.name.replace('Inkilapları','İnkılapları').replace('Tablolar, Şemalar ve Test','Karma Test');if(['Egitim','Cografya'].includes(file.section))title.append(newTag());if(file.pcOnly){const tag=document.createElement('span');tag.className='pc-tag';tag.textContent='for PC';tag.setAttribute('aria-label','Bilgisayar için');title.append(tag);}const type=document.createElement('span');type.className='kind';type.textContent=file.type||(file.name.includes('Tablolar')?'Quiz içeren quiz':kind(file.name));text.append(title,type);const go=document.createElement('span');go.className='open';go.textContent=file.type==='Ders notu'?'Oku ↗':file.type==='Animasyon'?'İncele ↗':'Başla ↗';go.setAttribute('aria-hidden','true');a.append(text,go);list.append(a);});
  detail.append(summary,list);target.append(detail);
 });
 document.getElementById('result-count').textContent=shown+' konu · '+total+(['Egitim','Cografya'].includes(active)?' içerik':' quiz')+(term?' bulundu':'');
 document.getElementById('empty').hidden=total>0;document.getElementById('clear').hidden=!query.value;
}
for(const [id,section] of [['tarih-count','Tarih'],['inkilap-count','Inkilap'],['mevzuat-count','Mevzuat'],['egitim-count','Egitim'],['cografya-count','Cografya']])document.getElementById(id).textContent=grouped[section].length+' konu · '+catalog.filter(f=>f.section===section).length+(['Egitim','Cografya'].includes(section)?' içerik':' quiz');
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.section;query.value='';location.hash=Object.keys(hashes).find(h=>hashes[h]===active);render();}));
addEventListener('hashchange',()=>{active=readSection();render();});
query.addEventListener('input',render);document.getElementById('clear').addEventListener('click',()=>{query.value='';render();query.focus();});render();
</script>
<link rel="stylesheet" href="notes.css">
<script src="notes-data.js"></script>
<script src="notes.js"></script>
</body>
