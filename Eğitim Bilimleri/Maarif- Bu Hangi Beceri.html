<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maarif Modeli Beceri Quizi</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --btn-bg: #edf2f7;
            --btn-hover: #e2e8f0;
            --correct: #48bb78;
            --wrong: #f56565;
            --primary: #4299e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .score-board {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }

        .question-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .skill-text {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 40px;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: none;
            border-radius: 16px;
            padding: 18px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        /* Feedback States */
        .option-btn.correct {
            background-color: var(--correct);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Progress Bar */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }
    </style>
<link rel="stylesheet" href="../menu-back.css">
</head>
<body>
<a class="ags-menu-back" href="../index.html#egitim-bilimleri" aria-label="Ana menüye dön">← Menüye dön</a>

    <div class="quiz-container">
        <div class="progress-bar" id="progress"></div>
        
        <div class="score-board">
            <span id="question-count">Soru: 1/35</span>
            <span id="score-text">Puan: 0</span>
        </div>

        <div class="question-label">Bu Hangi Beceri?</div>
        <div class="skill-text" id="skill">Yükleniyor...</div>

        <div class="options-container">
            <button class="option-btn" onclick="checkAnswer('Temel Beceriler')">Temel Beceri</button>
            <button class="option-btn" onclick="checkAnswer('Bütünleşik Beceriler')">Bütünleşik Beceri</button>
            <button class="option-btn" onclick="checkAnswer('Üst Düzey Düşünme Becerileri')">Üst Düzey Beceri</button>
        </div>
    </div>

    <script>
        // Tüm beceri verileri
        const skillsData = [
            { name: "Sayma", category: "Temel Beceriler" },
            { name: "Okuma", category: "Temel Beceriler" },
            { name: "Yazma", category: "Temel Beceriler" },
            { name: "Çizim Yapma", category: "Temel Beceriler" },
            { name: "Bulma", category: "Temel Beceriler" },
            { name: "Seçme", category: "Temel Beceriler" },
            { name: "Belirleme", category: "Temel Beceriler" },
            { name: "İşaret Etme", category: "Temel Beceriler" },
            { name: "Ölçme", category: "Temel Beceriler" },
            { name: "Sunma", category: "Temel Beceriler" },
            { name: "Çevirme", category: "Temel Beceriler" },
            { name: "Kaydetme", category: "Temel Beceriler" },
            
            { name: "Çelişki Giderme", category: "Bütünleşik Beceriler" },
            { name: "Gözlemleme", category: "Bütünleşik Beceriler" },
            { name: "Özetleme", category: "Bütünleşik Beceriler" },
            { name: "Çözümleme", category: "Bütünleşik Beceriler" },
            { name: "Sınıflandırma", category: "Bütünleşik Beceriler" },
            { name: "Bilgi Toplama", category: "Bütünleşik Beceriler" },
            { name: "Karşılaştırma", category: "Bütünleşik Beceriler" },
            { name: "Sorgulama", category: "Bütünleşik Beceriler" },
            { name: "Genelleme", category: "Bütünleşik Beceriler" },
            { name: "Çıkarım Yapma", category: "Bütünleşik Beceriler" },
            { name: "Gözleme Dayalı Tahmin Etme", category: "Bütünleşik Beceriler" },
            { name: "Mevcut Bilgiye/Veriye Dayalı Tahmin Etme", category: "Bütünleşik Beceriler" },
            { name: "Yapılandırma", category: "Bütünleşik Beceriler" },
            { name: "Yorumlama", category: "Bütünleşik Beceriler" },
            { name: "Yansıtma", category: "Bütünleşik Beceriler" },
            { name: "Muhakeme (Akıl Yürütme)", category: "Bütünleşik Beceriler" },
            { name: "Değerlendirme", category: "Bütünleşik Beceriler" },
            { name: "Tartışma", category: "Bütünleşik Beceriler" },
            { name: "Mantıksal Denetleme", category: "Bütünleşik Beceriler" },
            { name: "Sentezleme", category: "Bütünleşik Beceriler" },
            
            { name: "Karar Verme", category: "Üst Düzey Düşünme Becerileri" },
            { name: "Problem Çözme", category: "Üst Düzey Düşünme Becerileri" },
            { name: "Eleştirel Düşünme", category: "Üst Düzey Düşünme Becerileri" }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isWaiting = false;

        // Diziyi karıştırma fonksiyonu (Fisher-Yates)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Oyunu başlat
        function initGame() {
            questions = shuffleArray([...skillsData]);
            currentQuestionIndex = 0;
            score = 0;
            updateUI();
        }

        // Arayüzü güncelle
        function updateUI() {
            if (currentQuestionIndex >= questions.length) {
                document.getElementById('skill').innerText = "Tebrikler! Test Bitti.";
                document.querySelector('.options-container').innerHTML = 
                    `<button class="option-btn" onclick="location.reload()" style="background:var(--primary); color:white;">Yeniden Oyna</button>`;
                return;
            }

            const currentSkill = questions[currentQuestionIndex];
            document.getElementById('skill').innerText = currentSkill.name;
            document.getElementById('question-count').innerText = `Soru: ${currentQuestionIndex + 1}/${questions.length}`;
            document.getElementById('score-text').innerText = `Puan: ${score}`;
            
            // Progress Bar
            const progressPct = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progress').style.width = `${progressPct}%`;

            // Butonları sıfırla
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.className = 'option-btn';
                btn.disabled = false;
            });
            isWaiting = false;
        }

        // Cevabı kontrol et
        function checkAnswer(selectedCategory) {
            if (isWaiting) return;
            isWaiting = true;

            const currentSkill = questions[currentQuestionIndex];
            const buttons = document.querySelectorAll('.option-btn');
            let selectedBtn;

            // Seçilen ve doğru olan butonu bul
            buttons.forEach(btn => {
                btn.disabled = true; // Tıklamayı kapat
                
                // Seçilen butonu belirle
                if (
                    (selectedCategory === 'Temel Beceriler' && btn.innerText.includes('Temel')) ||
                    (selectedCategory === 'Bütünleşik Beceriler' && btn.innerText.includes('Bütünleşik')) ||
                    (selectedCategory === 'Üst Düzey Düşünme Becerileri' && btn.innerText.includes('Üst Düzey'))
                ) {
                    selectedBtn = btn;
                }

                // Doğru cevaba her zaman yeşil yak
                if (
                    (currentSkill.category === 'Temel Beceriler' && btn.innerText.includes('Temel')) ||
                    (currentSkill.category === 'Bütünleşik Beceriler' && btn.innerText.includes('Bütünleşik')) ||
                    (currentSkill.category === 'Üst Düzey Düşünme Becerileri' && btn.innerText.includes('Üst Düzey'))
                ) {
                    btn.classList.add('correct');
                }
            });

            // Doğru/Yanlış kontrolü
            if (selectedCategory === currentSkill.category) {
                score += 10;
            } else {
                if (selectedBtn) selectedBtn.classList.add('wrong');
            }

            // Kısa bir bekleme sonrası diğer soruya geç
            setTimeout(() => {
                currentQuestionIndex++;
                updateUI();
            }, 1200);
        }

        // Uygulamayı başlat
        initGame();
    </script>
</body>
</html>
