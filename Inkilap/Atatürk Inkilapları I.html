<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ MEB-AGS Atatürk İnkılapları - Siyasi Gelişmeler</title>
    <style>
        :root {
            --primary: #8B4513;
            --success: #2E8B57;
            --danger: #B22222;
            --light: #F5F5DC;
            --dark: #2F4F4F;
            --accent: #D2691E;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "📜";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(139, 69, 19, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(46, 139, 87, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            text-align: left;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .question { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📜 MEB-AGS Atatürk İnkılapları</h1>
            <div class="subtitle">Siyasi İnkılaplar ve 3 Mart 1924 Gelişmeleri</div>
        </header>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="quiz-container" id="quizContainer">
            <div class="stats">
                <div class="score">Puan: <span id="score">0</span></div>
                <div>Soru: <span id="progress">0</span>/<span id="total">0</span></div>
            </div>
            
            <div class="question-container">
                <div class="question" id="question"></div>
            </div>
            
            <div class="options" id="options">
                <div class="cat-cover" id="catCover">
                    <img src="https://cataas.com/cat" alt="Random Cat" class="cat-image">
                    <div class="cat-text">Şıkları görmek için bir sayıya (1-4) basın!</div>
                </div>
            </div>
            
            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
            </div>
            
            <button class="next-btn" id="nextBtn" style="display: none;">Sonraki Soru (Boşluk)</button>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <h2 class="results-title">🏆 Konu Tamamlandı!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="word-list" id="wordList"></div>
            <button class="next-btn" onclick="location.reload()" style="margin-top: 30px;">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "Atatürk İnkılaplarının \"fikri hazırlık aşamasının çok kısa sürmesinin\" temel nedeni hangisidir?", options: ["Savaş ortamında gerçekleştirilmesi", "Belli bir ideolojinin ürünü olması", "Tavandan tabana doğru yayılması", "Evrensel nitelikler taşıması"], correctAnswer: "A", meaning: "Milli Mücadele'nin getirdiği olağanüstü savaş koşulları ve acil karar alma gereksinimi nedeniyle teori tartışmaları yerine doğrudan eyleme geçilmiştir." },
            { question: "İnkılaplarda \"fikri ortaya koyanlar ile süreci yürütenlerin aynı kadrolar olması\" hangi özelliği gösterir?", options: ["Tavandan tabana doğru bir süreç yaşandığını", "Tabandan tavana doğru geliştiğini", "Dış baskılarla uygulandığını", "Sadece siyasi alanı kapsadığını"], correctAnswer: "A", meaning: "Türk inkılabı aydın ve askeri kadro (tavan) tarafından hazırlanmış ve halka (tabana) devlet eliyle uygulanmıştır." },
            { question: "İnkılapların \"toplumda kargaşa oluşturan ikili uygulamalara son vermesi\" neyi sağlamıştır?", options: ["Hukuk, eğitim ve sosyal hayatta birliği", "Çok partili sistemi", "Meclis hükümeti sistemini", "Ümmetçilik anlayışını"], correctAnswer: "A", meaning: "Medreseler-modern okullar veya Şeriye-modern mahkemeler gibi ikilikler kaldırılarak toplumsal düzen sağlanmıştır." },
            { question: "Saltanatı kaldırma sürecini hızlandıran ve Mustafa Kemal'i harekete geçiren en önemli dış gelişme hangisidir?", options: ["Osmanlı Hükümetinin de Lozan Görüşmelerine davet edilmesi", "İstanbul'un resmen işgal edilmesi", "İzmir'in Yunanlar tarafından işgali", "İngiltere'nin halifeyi kullanma çabası"], correctAnswer: "A", meaning: "İtilaf Devletleri Lozan'a iki tarafı da davet ederek ikilik çıkarmak istemiştir; bu durum saltanatın sonunu getirmiştir." },
            { question: "Lozan öncesi hazırlıklara başlayarak TBMM'nin tepkisini çeken son Osmanlı Sadrazamı kimdir?", options: ["Tevfik Paşa", "Damat Ferit Paşa", "Ali Rıza Paşa", "Salih Paşa"], correctAnswer: "A", meaning: "Tevfik Paşa'nın 'ortak heyet' teklifi Ankara'da bardağı taşıran son damla olmuştur." },
            { question: "İngilizlerin halifelik makamını kullanmasını engellemek amacıyla TBMM tarafından seçilen son halife kimdir?", options: ["Abdülmecit Efendi", "Vahdettin", "Şehzade Ömer Faruk", "V. Murat"], correctAnswer: "A", meaning: "Vahdettin'in gidişi sonrası dini bir otorite boşluğu kalmaması için Abdülmecit Efendi meclisçe seçilmiştir." },
            { question: "\"Devletin laikleşmesi yolunda atılan ilk ciddi adım\" hangi gelişmedir?", options: ["Saltanatın Kaldırılması", "Halifeliğin Kaldırılması", "Cumhuriyet'in İlanı", "Ankara'nın Başkent Olması"], correctAnswer: "A", meaning: "Saltanatın kaldırılmasıyla siyasi güç ile dini güç birbirinden ayrılmış, laikliğin önü açılmıştır." },
            { question: "Saltanatın kaldırılmasıyla ortaya çıkan \"Rejim ve devlet başkanlığı\" sorunları hangi gelişmeyi hızlandırmıştır?", options: ["Cumhuriyet'in ilanını", "Çok partili hayata geçişi", "Tevhid-i Tedrisat Kanunu'nu", "Diyanet'in kurulmasını"], correctAnswer: "A", meaning: "Yönetimin adının konulmaması ve başkanlık makamının boşluğu Cumhuriyet'i zorunlu kılmıştır." },
            { question: "Lozan Barış Antlaşması'nı onaylayan ve \"İnkılap Meclisi\" olarak bilinen meclis hangisidir?", options: ["II. TBMM", "I. TBMM", "Mebusan Meclisi", "Temsil Heyeti"], correctAnswer: "A", meaning: "Savaşı I. TBMM kazandı; ancak Lozan'ı onaylayan ve devrimleri yapan II. TBMM'dir." },
            { question: "Cumhuriyet'in ilk partisi olan Halk Fırkası, temelde hangi teşkilatın partileşmiş halidir?", options: ["Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti", "Felah-ı Vatan Grubu", "İttihat ve Terakki", "Tesanüt Grubu"], correctAnswer: "A", meaning: "Sivas Kongresi'nde birleşen milli direniş cemiyetleri Halk Fırkası'na dönüşmüştür." },
            { question: "İstanbul'un 6 Ekim 1923'te boşaltılmasının ardından gündeme gelen temel sorun hangisidir?", options: ["Hükümet merkezi (Başkent) sorunu", "Rejim sorunu", "Kabine bunalımı", "Azınlık hakları"], correctAnswer: "A", meaning: "İşgalin bitmesiyle Ankara ve İstanbul arasında başkent tercihi tartışılmıştır." },
            { question: "9 Ekim 1923'te Ankara'nın başkent olması önergesini TBMM'ye sunan devlet adamı kimdir?", options: ["İsmet Paşa", "Mustafa Kemal Paşa", "Rauf Orbay", "Ali Fethi Okyar"], correctAnswer: "A", meaning: "İsmet Paşa, Ankara'nın stratejik önemini vurgulayarak bu tarihi önergeyi vermiştir." },
            { question: "Bakanların meclis tarafından tek tek seçildiği ve hükümet kurmayı zorlaştıran sistem hangisidir?", options: ["Meclis Hükümeti Sistemi", "Kabine Sistemi", "Parlamenter Sistem", "Yarı Başkanlık"], correctAnswer: "A", meaning: "Bu sistemde hükümet uyumu zordu ve her bakanın tek tek oylanması süreci tıkıyordu." },
            { question: "Tarihe \"Ekim Bunalımı\" olarak geçen kriz, hangi hükümetin istifası ile başlamıştır?", options: ["Ali Fethi Okyar Hükümeti", "İsmet Paşa Hükümeti", "Rauf Orbay Hükümeti", "Tevfik Paşa Hükümeti"], correctAnswer: "A", meaning: "Ali Fethi Bey'in istifası sonrası hükümet kurulamaması Cumhuriyet'in ilanına zemin hazırlamıştır." },
            { question: "Başbakanın bakanları seçtiği ve yürütmenin hızlandığı \"Kabine Sistemi\"ne ne zaman geçilmiştir?", options: ["Cumhuriyet'in İlanı ile", "Saltanatın Kaldırılması ile", "Ankara'nın Başkent Oluşu ile", "Halifeliğin Kaldırılması ile"], correctAnswer: "A", meaning: "Cumhuriyet ile birlikte modern yönetim sistemine geçilerek hükümet krizleri çözülmüştür." },
            { question: "Türkiye Cumhuriyeti'nin ilk Başbakanı kim olmuştur?", options: ["İsmet İnönü", "Mustafa Kemal", "Ali Fethi Okyar", "Fevzi Çakmak"], correctAnswer: "A", meaning: "Mustafa Kemal Cumhurbaşkanı seçildikten sonra ilk hükümeti kurma görevini İsmet Paşa'ya vermiştir." },
            { question: "Türkiye Cumhuriyeti'nin ilk Meclis Başkanı (TBMM Başkanı) kimdir?", options: ["Ali Fethi Okyar", "Rauf Orbay", "Kazım Karabekir", "İsmet İnönü"], correctAnswer: "A", meaning: "Cumhuriyet sonrası meclisin başına Ali Fethi Okyar geçmiştir." },
            { question: "Türkiye Cumhuriyeti'nin ilk Genelkurmay Başkanı olarak atanan komutan kimdir?", options: ["Fevzi Çakmak", "Cevat Çobanlı", "Fahrettin Altay", "Asım Gündüz"], correctAnswer: "A", meaning: "Mareşal Fevzi Çakmak orduyu siyasette ayırmak adına bu görevi uzun süre yürütmüştür." },
            { question: "\"Türkiye devletinin yönetim şekli Cumhuriyet'tir.\" maddesi ilk kez hangi anayasaya eklenmiştir?", options: ["1921 Anayasası (1923 Değişikliği)", "Kanun-u Esasi", "1924 Anayasası", "1961 Anayasası"], correctAnswer: "A", meaning: "Yeni bir anayasa gelene kadar 1921 Anayasası üzerinde yapılan değişiklikle rejim yasallaşmıştır." },
            { question: "Halifeliğin kaldırılmasında Abdülmecit Efendi'nin hangi tutumu etkili olmuştur?", options: ["Padişah gibi davranarak yetkilerini aşması", "Lozan'a heyet göndermesi", "Ankara'ya gelmeyi reddetmesi", "Milli Mücadele'ye karşı çıkması"], correctAnswer: "A", meaning: "Abdülmecit Efendi'nin devlet başkanı gibi törenler yapması Cumhuriyet için tehdit görülmüştür." },
            { question: "Dış müdahaleye kanıt sayılan \"Seyyid Emir Ali ve Ağa Han'ın mektubu\" hangi gazetede yayımlanmıştır?", options: ["Tanin", "İrade-i Milliye", "Hakimiyet-i Milliye", "Minber"], correctAnswer: "A", meaning: "Mektubun henüz İsmet Paşa'ya ulaşmadan muhalif Tanin'de basılması bardağı taşırmıştır." },
            { question: "Halifeliğin kaldırılmasının en temel ideolojik sonucu nedir?", options: ["Ümmetçilikten Ulus Devlet anlayışına geçiş", "Çok partili hayata geçiş", "Hukuk birliğinin sağlanması", "Meclis üstünlüğünün bitmesi"], correctAnswer: "A", meaning: "Dini aidiyet yerine milli kimlik ön plana çıkmıştır." },
            { question: "Yapılan inkılaplar içinde \"laikleşme yolunda atılan en büyük adım\" hangisidir?", options: ["Halifeliğin Kaldırılması", "Saltanatın Kaldırılması", "Şapka İnkılabı", "Tevhid-i Tedrisat"], correctAnswer: "A", meaning: "Dini liderlik makamının kalkması laikleşmenin zirve noktasıdır." },
            { question: "Halifeliğin kaldırılması ile sona erdirilen en yüksek dini makam (Bab-ı Meşihat) hangisidir?", options: ["Şeyhülislamlık", "Darülfünun", "Bab-ı Ali", "Divan"], correctAnswer: "A", meaning: "Eski düzenin en güçlü dini kurumu olan Şeyhülislamlık makamı tarihe karışmıştır." },
            { question: "Yabancı devletlerin iç işlerimize karışma girişimlerinin önünü kesen en kritik siyasi hamle hangisidir?", options: ["Halifeliğin Kaldırılması", "Medenî Kanun", "Harf İnkılabı", "Şeriye Mahkemeleri"], correctAnswer: "A", meaning: "Halifeliği kullanarak Müslümanları kışkırtma imkanı ortadan kaldırılmıştır." },
            { question: "3 Mart 1924'te kabul edilen ve eğitimde birliği hedefleyen devrim kanunu hangisidir?", options: ["Tevhid-i Tedrisat Kanunu", "Maarif Teşkilatı Kanunu", "Harf İnkılabı", "Üniversite Reformu"], correctAnswer: "A", meaning: "Tüm eğitim kurumları MEB'e bağlanarak eğitimde ikilik bitirilmiştir." },
            { question: "Şeriye ve Evkaf Vekâletinin yerine kurulan dini kurum hangisidir?", options: ["Diyanet İşleri Başkanlığı", "Vakıflar Genel Müdürlüğü", "Şeyhülislamlık", "İlahiyat"], correctAnswer: "A", meaning: "Din işlerinin devlet siyasetinden ayrılması için Diyanet kurulmuştur." },
            { question: "Şeriye ve Evkaf Vekâletinin yerine vakıf mallarını yönetmek için kurulan kurum hangisidir?", options: ["Vakıflar Genel Müdürlüğü", "Diyanet İşleri Başkanlığı", "Maarif", "Kızılay"], correctAnswer: "A", meaning: "Toplumsal ve hayır işleri bu müdürlük çatısı altında toplanmıştır." },
            { question: "Halifeliğin kaldırıldığı gün hukukta laikleşme için hangi mahkemeler kapatılmıştır?", options: ["Şeriye Mahkemeleri", "Nizamiye Mahkemeleri", "Konsolosluk Mahkemeleri", "İstiklal Mahkemeleri"], correctAnswer: "A", meaning: "Dini temelli mahkemelerin kalkması modern hukukun önünü açmıştır." },
            { question: "Ordunun siyasetten uzaklaştırılması amacıyla Erkân-ı Harbiye-i Umumiye Vekâletinin yerine ne kurulmuştur?", options: ["Genelkurmay Başkanlığı", "Milli Savunma Bakanlığı", "Jandarma", "YAŞ"], correctAnswer: "A", meaning: "Genelkurmay'ın hükümet dışına çıkarılmasıyla ordunun siyasete karışması önlenmiştir." },
            { question: "3 Mart 1924'te rejim güvenliği için kimlerin vatandaşlıktan çıkarılmasına karar verilmiştir?", options: ["Osmanlı hanedanına mensup kişilerin", "Siyasi muhaliflerin", "İstiklal Mahkemesi sanıklarının", "İşbirlikçilerin"], correctAnswer: "A", meaning: "Eski rejimin geri dönme ihtimalini tamamen bitirmek için hanedan yurt dışına gönderilmiştir." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const progressBarEl = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const wordListEl = document.getElementById('wordList');
        const catCoverEl = document.getElementById('catCover');

        function initQuiz() {
            questions = shuffleArray(quizData);
            totalEl.textContent = questions.length;
            showQuestion();
            catCoverEl.addEventListener('click', () => catCoverEl.style.display = 'none');
            
            window.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '4') {
                    // Eğer kapak açıksa, sadece kapağı kapat ve dur
                    if (catCoverEl.style.display !== 'none') {
                        catCoverEl.style.display = 'none';
                        return; 
                    }
                    
                    // Kapak zaten kapalıysa şıkkı seç
                    const idx = parseInt(e.key) - 1;
                    const btns = document.querySelectorAll('.option-btn');
                    if (btns[idx] && !btns[idx].disabled) {
                        btns[idx].click();
                    }
                }
                
                if (e.code === 'Space' || e.key === ' ') {
                    if (nextBtn.style.display !== 'none') {
                        nextBtn.click();
                        e.preventDefault(); 
                    }
                }
            });
        }

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;
            
            const correctText = currentQuestion.options[currentQuestion.correctAnswer.charCodeAt(0) - 65];
            const shuffledOptions = shuffleArray(currentQuestion.options);
            
            optionsEl.innerHTML = '';
            optionsEl.appendChild(catCoverEl);
            catCoverEl.style.display = 'flex';

            shuffledOptions.forEach(optionText => {
                const button = document.createElement('button');
                button.classList.add('option-btn', 'fade-in');
                button.textContent = optionText;
                button.onclick = () => selectAnswer(optionText, correctText, currentQuestion.meaning);
                optionsEl.appendChild(button);
            });
            
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            progressEl.textContent = currentQuestionIndex + 1;
            progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        }

        function selectAnswer(selectedOption, correctOptionText, meaning) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctOptionText) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selectedOption) {
                    btn.classList.add('incorrect');
                }
            });

            const isCorrect = selectedOption === correctOptionText;
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
            }

            feedbackEl.style.display = 'block';
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            feedbackTextEl.innerHTML = isCorrect ? 
                `<strong>✅ Doğru!</strong><br><br>${meaning}` : 
                `<strong>❌ Hatalı Seçim!</strong><br>Doğru Cevap: ${correctOptionText}<br><br>${meaning}`;
            
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        };

        function endQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            finalScoreEl.textContent = `Puanınız: ${score} / ${questions.length}`;
            
            wordListEl.innerHTML = '<h3 style="margin-bottom:15px;">Genel Tekrar Kartları:</h3>';
            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<strong>${q.question}</strong><br><small style="color:var(--primary)">${q.meaning}</small>`;
                wordListEl.appendChild(card);
            });
        }

        initQuiz();
    </script>
</body>
</html>
