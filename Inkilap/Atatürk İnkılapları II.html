<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ MEB-AGS Atatürk İnkılapları - Siyasi Gelişmeler</title>
    <style>
        :root {
            --primary: #8B4513;
            --success: #2E8B57;
            --danger: #B22222;
            --light: #F5F5DC;
            --dark: #2F4F4F;
            --accent: #D2691E;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "📜";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(139, 69, 19, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(46, 139, 87, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            text-align: left;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .question { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ Atatürk İnkılapları II</h1>
            <div class="subtitle">Hukuk Alanı | Kadın Hakları | Toplumsal İnkılaplar</div>
            <div class="subtitle" style="font-size:0.85rem; margin-top:5px;">(Eğitim Alanı Hariç)</div>
        </header>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="quiz-container" id="quizContainer">
            <div class="stats">
                <div class="score">📊 Puan: <span id="score">0</span></div>
                <div>📌 Soru: <span id="progress">0</span>/<span id="total">0</span></div>
            </div>
            
            <div class="question-container">
                <div class="question" id="question"></div>
            </div>
            
            <div class="options" id="options">
                <div class="cat-cover" id="catCover">
                    <img src="https://cataas.com/cat" alt="Random Cat" class="cat-image">

                </div>
            </div>
            
            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
            </div>
            
            <button class="next-btn" id="nextBtn" style="display: none;">➡️ Sonraki Soru (Boşluk)</button>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <h2 class="results-title">🏆 Konu Tamamlandı!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="word-list" id="wordList"></div>
            <button class="next-btn" onclick="location.reload()">🔄 Tekrar Oyna</button>
        </div>
    </div>

    <script>
        // ==================== 33 SORU (EĞİTİM HARİÇ) ====================
        const quizData = [
            // HUKUK ALANI (1-17)
            { question: "1924 Anayasası ile ilgili aşağıda verilen bilgilerden hangisi doğrudur?", options: ["Türkiye Cumhuriyeti'nin en kısa süre yürürlükte kalan anayasasıdır.", "Savaş ortamında hazırlandığı için oldukça yetersizdir.", "Toplam 6 bölüm ve 105 maddeden oluşmaktadır.", "İlk kez güçler birliği ilkesini tamamen terk etmiştir."], correctAnswer: "C", meaning: "1924 Anayasası 6 bölüm ve 105 maddeden oluşmuştur. En uzun süre yürürlükte kalan anayasadır (1924-1961)." },

            { question: "Türk Medeni Kanunu ile kadınlara verilen haklar arasında aşağıdakilerden hangisi yer almaz?", options: ["Mirasta erkeklerle eşit pay alma hakkı", "Resmî nikâh ve tek eşlilik zorunluluğu", "İstediği mesleği özgürce seçebilme hakkı", "Milletvekili seçimlerinde aday olabilme hakkı"], correctAnswer: "D", meaning: "Milletvekili seçimlerinde aday olma hakkı 1934'te, Medeni Kanun'dan (1926) sonra verilmiştir." },
            { question: "Mustafa Kemal'in Mecelle hakkındaki görüşünde belirttiği ve adli politikamızın temelini oluşturduğunu söylediği fıkhî kural aşağıdakilerden hangisidir?", options: ["Eşitlik ilkesinin her alanda uygulanması", "Zamanın değişmesiyle hükümlerin değiştirilmesinden vazgeçilemeyeceği", "Din ve devlet işlerinin kesin çizgilerle ayrılması", "Kanun önünde herkesin mutlak savunma hakkı"], correctAnswer: "B", meaning: "Mecelle'nin genel kuralı: 'Zamanın değişmesi dolayısıyla hükümlerin değiştirilmesinden vazgeçilemez' adli politikamızın temelini oluşturmuştur." },
            { question: "Türk Medeni Kanunu hazırlanırken İsviçre'nin örnek alınmasının temel nedenleri arasında aşağıdakilerden hangisi gösterilemez?", options: ["Avrupa'daki en yeni ve modern kanun olması", "Demokratik ve halkçı bir yapıya sahip olması", "Kadınlara siyasi hakları tanıyan ilk Avrupa kanunu olması", "Sorunlara pratik ve akılcı çözümler sunması"], correctAnswer: "C", meaning: "İsviçre Medeni Kanunu kadınlara siyasi hak tanıyan ilk kanun değildir." },
            { question: "Türk Medeni Kanunu'nun kabulüyle Patrikhanelerin dünyevi yetkilerine son verilmesi hangi ilkeyi güçlendirmiştir?", options: ["Devletçilik", "Hukuk birliği ve egemenlik", "Federatif yönetim anlayışı", "Millî ekonomi modeli"], correctAnswer: "B", meaning: "Azınlıkların Türk kanunlarına tabi olması hukuk birliğini sağlamıştır." },
            { question: "1926 yılında kabul edilen Deniz Ticaret Kanunu hangi ülkeden örnek alınarak hazırlanmıştır?", options: ["İsviçre", "İtalya", "Almanya", "Fransa"], correctAnswer: "C", meaning: "Deniz Ticaret Kanunu Almanya'dan alınmıştır." },
            { question: "1926 yılında kabul edilen Borçlar Kanunu hangi ülkeden alınmıştır?", options: ["İsviçre", "İtalya", "Almanya", "Fransa"], correctAnswer: "A", meaning: "Borçlar Kanunu İsviçre'den alınmıştır." },
            { question: "1926 yılında kabul edilen Türk Ceza Kanunu hangi ülkeden örnek alınmıştır?", options: ["İsviçre", "İtalya", "Almanya", "Fransa"], correctAnswer: "B", meaning: "Türk Ceza Kanunu İtalya'dan alınmıştır." },
            { question: "1929 yılında kabul edilen Ceza Muhakemeleri Usulü Kanunu hangi ülkeden örnek alınarak hazırlanmıştır?", options: ["İsviçre", "İtalya", "Almanya", "Fransa"], correctAnswer: "C", meaning: "Ceza Muhakemeleri Usulü Kanunu Almanya'dan alınmıştır." },
            { question: "1929 yılında kabul edilen İdare Kanunu hangi ülkeden alınmıştır?", options: ["İsviçre", "İtalya", "Almanya", "Fransa"], correctAnswer: "D", meaning: "İdare Kanunu Fransa'dan alınmıştır." },
            { question: "1932 yılında kabul edilen İcra ve İflas Kanunu hangi ülke kanunundan örnek alınmıştır?", options: ["İsviçre", "İtalya", "Almanya", "Fransa"], correctAnswer: "A", meaning: "İcra ve İflas Kanunu İsviçre'den alınmıştır." },
            { question: "Ahmet Cevdet Paşa başkanlığındaki bir heyet tarafından 1876 yılında tamamlanan 'Mecelle-i Ahkâm-ı Adliye' ile ilgili aşağıdakilerden hangisi doğrudur?", options: ["Cumhuriyet Dönemi'nde hazırlanan ilk medeni kanundur.", "Sadece gayrimüslim tebaayı kapsamıştır.", "İslam dünyasının ilk medeni kanunudur.", "Fransa Medeni Kanunu örnek alınarak hazırlanmıştır."], correctAnswer: "C", meaning: "Mecelle, İslam dünyasının ilk medeni kanunu olup sadece Müslüman tebaayı kapsamıştır." },
            { question: "Mecelle, Türk Medeni Kanunu'nun kabulüne kadar yürürlükte kalmıştır. Buna göre Mecelle hangi tarihe kadar yürürlükte kalmıştır?", options: ["1924", "1925", "1926", "1928"], correctAnswer: "C", meaning: "Mecelle, 1926'da Türk Medeni Kanunu kabul edilene kadar yürürlükte kalmıştır." },
            { question: "Aile Hukuku Kararnamesi ile ilgili aşağıdakilerden hangisi doğrudur?", options: ["Cumhuriyet Dönemi'nde çıkarılan ilk medeni kanundur.", "1926 yılında Türk Medeni Kanunu ile birlikte yürürlüğe girmiştir.", "1917 yılında Osmanlı Devleti'nde kabul edilmiştir.", "İsviçre Medeni Kanunu örnek alınarak hazırlanmıştır."], correctAnswer: "C", meaning: "Aile Hukuku Kararnamesi 1917'de Osmanlı'da kabul edilmiştir, Cumhuriyet dönemiyle ilgisi yoktur." },
            { question: "Atatürk Dönemi'nde hukuk eğitimine katkı sağlamak amacıyla 1925 yılında açılan kurum aşağıdakilerden hangisidir?", options: ["İstanbul Hukuk Mektebi", "Ankara Hukuk Mektebi", "Darülfünun Hukuk Şubesi", "Bursa Hukuk Mektebi"], correctAnswer: "B", meaning: "Ankara Hukuk Mektebi 1925'te açılmıştır." },
            { question: "Cumhuriyet Dönemi'nde laik hukuk düzenine geçişte, din işleriyle devlet işlerinin ayrılması amacıyla kaldırılan bakanlık aşağıdakilerden hangisidir?", options: ["Adalet Bakanlığı", "İçişleri Bakanlığı", "Şer'iye ve Evkaf Vekâleti", "Maarif Vekâleti"], correctAnswer: "C", meaning: "Şer'iye ve Evkaf Vekâleti laikleşme sürecinde kaldırılmıştır." },
            
            // KADIN VE SİYASİ HAKLAR (18-20)
            { question: "1933 yılında Aydın'ın Çine ilçesinde seçilen, Türkiye'nin ilk kadın muhtarı aşağıdakilerden hangisidir?", options: ["Sadiye Hanım", "Gül Esin", "Satı Kadın", "Safiye Ali"], correctAnswer: "B", meaning: "Gül Esin, Türkiye'nin ilk kadın muhtarıdır (1933)." },
            { question: "Türk kadınına verilen siyasi hakların kronolojik sıralaması hangi seçenekte doğru verilmiştir?", options: ["Belediye - Muhtarlık - Milletvekilliği", "Milletvekilliği - Belediye - Muhtarlık", "Muhtarlık - Belediye - Milletvekilliği", "Belediye - Milletvekilliği - Muhtarlık"], correctAnswer: "A", meaning: "1930 Belediye, 1933 Muhtarlık, 1934 Milletvekilliği." },
            { question: "Türkiye'nin ilk kadın belediye başkanı Sadiye Hanım hangi ilde görev yapmıştır?", options: ["İzmir", "İstanbul", "Ankara", "Artvin"], correctAnswer: "D", meaning: "Sadiye Hanım, 1930'da Artvin'in Yusufeli ilçesinde belediye başkanı seçilmiştir." },
            
            // TOPLUMSAL ALAN (21-33)
            { question: "Mustafa Kemal Atatürk, Şapka İnkılabı'nın ilk tanıtımını ve 'Buna şapka derler' konuşmasını 1925 yılında nerede yapmıştır?", options: ["Ankara", "Kastamonu - İnebolu", "İzmir - Karşıyaka", "Samsun - Havza"], correctAnswer: "B", meaning: "25 Ağustos 1925'te Kastamonu-İnebolu gezisinde şapkayı tanıtmıştır." },
            { question: "30 Kasım 1925'te çıkarılan kanunla kapatılan kurumlar arasında aşağıdakilerden hangisi yer alır?", options: ["Medreseler ve Darülfünun", "Halkevleri ve Millet Mektepleri", "Tekke, Zaviye ve Türbeler", "Maarif Kongresi ve Enstitüler"], correctAnswer: "C", meaning: "30 Kasım 1925'te tekke, zaviye ve türbeler kapatılmıştır." },
            { question: "Tekke ve zaviyeler kapatılmasına rağmen dokunulmayan türbeler arasında aşağıdakilerden hangisi yer almaz?", options: ["Osman Gazi", "Fatih Sultan Mehmet", "Kanuni Sultan Süleyman", "Hacı Bektaş-ı Veli"], correctAnswer: "C", meaning: "Osman Gazi, Fatih, Mevlana, Hacı Bektaş gibi büyüklerin türbelerine dokunulmamıştır." },
            { question: "30 Kasım 1925'te kapatılan tekke ve zaviyelerin yanında yasaklanan ünvanlar arasında aşağıdakilerden hangisi yoktur?", options: ["Şeyhlik ve dervişlik", "Çelebilik ve babalık", "Büyücülük ve falcılık", "Paşalık ve mareşallik"], correctAnswer: "D", meaning: "Paşalık ve mareşallik askeri rütbelerdir, yasaklanmamıştır." },

            { question: "26 Aralık 1925'te yapılan düzenleme ile Türkiye'de hangi saat sistemi kabul edilmiştir?", options: ["Alaturka Saat Sistemi", "Güneş Saati Sistemi", "Alafranga (Batılı) Saat Sistemi", "Ezani Saat Sistemi"], correctAnswer: "C", meaning: "Batılı Alafranga Saat Sistemi'ne geçilmiştir." },
            { question: "20 Mayıs 1928 tarihinde kabul edilen ve 'Beynelmilel Erkam' olarak adlandırılan düzenleme aşağıdakilerden hangisidir?", options: ["Uluslararası saat sistemine geçiş", "Miladi takvimin kabulü", "Uluslararası rakamların kabulü", "Metrik ölçü sistemine geçiş"], correctAnswer: "C", meaning: "Arap rakamları bırakılarak uluslararası rakamlara geçilmiştir." },

            { question: "27 Mayıs 1935 tarihinde kabul edilen kanunla aşağıdaki düzenlemelerden hangisi yapılmıştır?", options: ["Hafta tatili cumadan pazara alınmıştır.", "Resmî bayramlar ve genel tatiller düzenlenmiştir.", "Uluslararası rakamlar kabul edilmiştir.", "Metrik ölçü sistemine geçilmiştir."], correctAnswer: "B", meaning: "27 Mayıs 1935'te Millî Bayramlar ve Genel Tatiller Kanunu kabul edilmiştir." },
            { question: "Türkiye'de hafta tatilinin cuma gününden pazar gününe alınması hangi tarihte gerçekleşmiştir?", options: ["1 Ocak 1926", "20 Mayıs 1928", "1 Nisan 1931", "1 Haziran 1935"], correctAnswer: "D", meaning: "1 Haziran 1935'te hafta tatili pazara alınmıştır." },
            { question: "Soyadı Kanunu ile ilgili aşağıdaki bilgilerden hangisi doğrudur?", options: ["Alınacak soyadlarının yabancı dillerden seçilmesi teşvik edilmiştir.", "Mustafa Kemal'e 'Atatürk' soyadı 1923 yılında verilmiştir.", "Soyadlarının Türkçe olması ve ahlaka aykırı olmaması şartı getirilmiştir.", "Sadece erkeklerin soyadı alması zorunlu tutulmuştur."], correctAnswer: "C", meaning: "Soyadı Kanunu (21 Haziran 1934) ile Türkçe soyad zorunluluğu getirilmiştir." },
            { question: "26 Kasım 1934 tarihli Ünvan ve Lakapların Yasaklanması Kanunu'na göre, aşağıdakilerden hangisinin kullanımı yasak kapsamı dışında tutulmuştur?", options: ["Osmanlı Devleti'nin verdiği Harp Madalyaları", "'Zade' ekiyle biten aile isimleri", "'Hazret' ve 'Efendi' gibi dini/sosyal ünvanlar", "Sivil nişan ve madalyalar"], correctAnswer: "A", meaning: "Harp madalyaları hariç nişan, rütbe ve ünvanlar yasaklanmıştır." },
            { question: "3 Aralık 1934 tarihli Kılık Kıyafet Kanunu'na göre, ibadethaneler dışında dinî giysilerle dolaşma yasağından muaf tutulan görevliler hangi seçenekte tam verilmiştir?", options: ["Sadece Diyanet İşleri Başkanı", "Diyanet İşleri Başkanı, Hahambaşı ve Patrik", "Tüm imamlar, papazlar ve hahamlar", "Sadece İstanbul Müftüsü ve Patrik"], correctAnswer: "B", meaning: "Diyanet İşleri Başkanı, Hahambaşı ve Patrik muaf tutulmuştur." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const progressBarEl = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const wordListEl = document.getElementById('wordList');
        const catCoverEl = document.getElementById('catCover');

        function initQuiz() {
            questions = shuffleArray(quizData);
            totalEl.textContent = questions.length;
            showQuestion();
            catCoverEl.addEventListener('click', () => catCoverEl.style.display = 'none');
            
            window.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '4') {
                    if (catCoverEl.style.display !== 'none') {
                        catCoverEl.style.display = 'none';
                        return;
                    }
                    const idx = parseInt(e.key) - 1;
                    const btns = document.querySelectorAll('.option-btn');
                    if (btns[idx] && !btns[idx].disabled) {
                        btns[idx].click();
                    }
                }
                if (e.code === 'Space' || e.key === ' ') {
                    if (nextBtn.style.display !== 'none') {
                        nextBtn.click();
                        e.preventDefault();
                    }
                }
            });
        }

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;
            
            const correctText = currentQuestion.options[currentQuestion.correctAnswer.charCodeAt(0) - 65];
            const shuffledOptions = shuffleArray(currentQuestion.options);
            
            optionsEl.innerHTML = '';
            optionsEl.appendChild(catCoverEl);
            catCoverEl.style.display = 'flex';

            shuffledOptions.forEach(optionText => {
                const button = document.createElement('button');
                button.classList.add('option-btn', 'fade-in');
                button.textContent = optionText;
                button.onclick = () => selectAnswer(optionText, correctText, currentQuestion.meaning);
                optionsEl.appendChild(button);
            });
            
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            progressEl.textContent = currentQuestionIndex + 1;
            progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        }

        function selectAnswer(selectedOption, correctOptionText, meaning) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctOptionText) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selectedOption) {
                    btn.classList.add('incorrect');
                }
            });

            const isCorrect = selectedOption === correctOptionText;
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
            }

            feedbackEl.style.display = 'block';
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            feedbackTextEl.innerHTML = isCorrect ? 
                `<strong>✅ Doğru!</strong><br><br>📖 ${meaning}` : 
                `<strong>❌ Hatalı!</strong><br>🔍 Doğru cevap: ${correctOptionText}<br><br>📖 ${meaning}`;
            
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        };

        function endQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            finalScoreEl.textContent = `📊 Puanınız: ${score} / ${questions.length}`;
            
            wordListEl.innerHTML = '<h3 style="margin-bottom:15px;">📚 Özet Bilgi Kartları:</h3>';
            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<strong>❓ ${q.question}</strong><br><small style="color:var(--primary);">📌 ${q.meaning}</small>`;
                wordListEl.appendChild(card);
            });
        }

        initQuiz();
    </script>
</body>
</html>
