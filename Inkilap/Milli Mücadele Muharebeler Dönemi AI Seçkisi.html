<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milli Mücadele Muharebeler Dönemi - Çıkmış Sorular</title>
    <style>
        :root {
            --primary: #2E8B57;
            --success: #228B22;
            --danger: #B22222;
            --light: #F5FFFA;
            --dark: #2F4F4F;
            --accent: #32CD32;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2E8B57 0%, #32CD32 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "📜";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .sub-subtitle {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 139, 87, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
            font-weight: bold;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }
        
        .option-btn.incorrect {
            background-color: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(34, 139, 34, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(46, 139, 87, 0.3);
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
            text-align: left;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 15px;
            background: var(--light);
        }
        
        .category {
            display: inline-block;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        
        .category-isyan { background: #B22222; }
        .category-antlasma { background: #2E8B57; }
        .category-savunma { background: #228B22; }
        .category-cephe { background: #32CD32; }
        .category-inonu { background: #228B22; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .question { font-size: 1.1rem; }
        }
    </style>
</head>

                word: "Sakarya Meydan Muharebesi",
                category: "savunma",
                question: "Mustafa Kemal Paşa'nın, subay kaybı ve savaşın şiddeti nedeniyle 'Melhame-i Kübra' (Büyük Kan Dökme) olarak adlandırdığı savaş hangisidir?",
                options: ["Büyük Taarruz", "Çanakkale Savaşı", "Sakarya Meydan Muharebesi", "II. İnönü Muharebesi"],
                explanation: "Çok fazla subay şehit olduğu için Sakarya Savaşı'na 'Subaylar Savaşı' veya 'Melhame-i Kübra' denmiştir."
            },
            {
                word: "Bekir Sami Bey",
                category: "antlasma",
                question: "I. İnönü Zaferi'nden sonra toplanan Londra Konferansı'nda TBMM heyetine başkanlık eden Dışişleri Bakanı kimdir?",
                options: ["Bekir Sami Bey", "Yusuf Kemal Tengirşenk", "İsmet Paşa", "Tevfik Rüştü Aras"],
                explanation: "TBMM'yi Londra Konferansı'nda dönemin Dışişleri Bakanı Bekir Sami Bey temsil etmiştir."
            },
            {
                word: "General Trikopis",
                category: "cephe",
                question: "Büyük Taarruz'un başarıyla sonuçlanmasının ardından Türk ordusu tarafından esir alınan Yunan Başkomutanı aşağıdakilerden hangisidir?",
                options: ["Venizelos", "Papulas", "Hacıanestis", "General Trikopis"],
                explanation: "Yunan Başkomutanı General Trikopis, Uşak civarında esir alınmıştır."
            },
            {
                word: "Yusuf Kemal Tengirşenk",
                category: "antlasma",
                question: "Sakarya Muharebesi'nin ardından Fransa ile 1921 Ankara Antlaşması'nı TBMM adına imzalayan Dışişleri Bakanı kimdir?",
                options: ["Bekir Sami Bey", "Yusuf Kemal Tengirşenk", "İsmet Paşa", "Hasan Saka"],
                explanation: "Bekir Sami Bey'in istifasından sonra Dışişleri Bakanı olan Yusuf Kemal Tengirşenk imzalamıştır."
            },
            {
                word: "Kâzım Karabekir",
                category: "antlasma",
                question: "Ermenilerin yenilmesiyle sonuçlanan Doğu Cephesi savaşlarının ardından, TBMM adına Gümrü Antlaşması'nı imzalayan komutan hangisidir?",
                options: ["Rauf Orbay", "Ali Fuat Cebesoy", "Kâzım Karabekir", "Refet Bele"],
                explanation: "15. Kolordu Komutanı Kâzım Karabekir, bölgedeki askeri ve siyasi süreci bizzat yönetmiş ve antlaşmayı imzalamıştır."
            },
            {
                word: "Sakarya Meydan Muharebesi'nin kazanılması",
                category: "antlasma",
                question: "İtalya ve Fransa'nın, Kütahya-Eskişehir yenilgimiz üzerine durdurdukları çekilme işlemini 'kesin olarak' tamamlayıp Anadolu'yu terk etmeleri hangi gelişmeyle olmuştur?",
                options: ["Büyük Taarruz'un kazanılması", "Mudanya Ateşkesi'nin imzalanması", "Sakarya Meydan Muharebesi'nin kazanılması", "Lozan Barış Antlaşması'nın imzalanması"],
                explanation: "Sakarya Zaferi ile Türk ordusunun yenilemeyeceği kesinleşmiş, Fransa Ankara Antlaşması'nı imzalamış, İtalya da tamamen çekilmiştir."
            }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function init() {
            questions = shuffle([...quizData]);
            document.getElementById('total').textContent = questions.length;
            showQuestion();
            document.getElementById('catCover').addEventListener('click', () => {
                document.getElementById('catCover').style.display = 'none';
            });
        }

        function showQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question').textContent = q.question;
            document.getElementById('catCover').style.display = 'flex';
            
            const optionsDiv = document.getElementById('options');
            const btns = optionsDiv.querySelectorAll('.option-btn');
            btns.forEach(b => b.remove());

            const currentOptions = shuffle([...q.options]);
            currentOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, q.word, btn);
                optionsDiv.appendChild(btn);
            });

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('progress').textContent = currentQuestionIndex + 1;
            document.getElementById('progressBar').style.width = ((currentQuestionIndex + 1) / questions.length * 100) + '%';
        }

        function checkAnswer(selected, correct, btn) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const isCorrect = selected === correct;
            if (isCorrect) {
                score++;
                document.getElementById('score').textContent = score;
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
                allBtns.forEach(b => { if(b.textContent === correct) b.classList.add('correct'); });
            }

            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            feedback.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            document.getElementById('feedbackText').innerHTML = `<strong>${isCorrect ? '✅ Doğru!' : '❌ Dikkat!'}</strong><br><br>${questions[currentQuestionIndex].explanation}`;
            document.getElementById('nextBtn').style.display = 'block';
        }

        document.getElementById('nextBtn').onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) showQuestion();
            else showResults();
        };

        function showResults() {
            document.getElementById('quizContainer').style.display = 'none';
            const res = document.getElementById('resultsContainer');
            res.style.display = 'block';
            document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
            
            const list = document.getElementById('wordList');
            quizData.forEach(q => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<strong>${q.word}</strong><br><small>${q.question}</small><br><span class="category category-${q.category}">${q.category.toUpperCase()}</span>`;
                list.appendChild(card);
            });
        }

        init();
    </script>
