<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk İnkılap Tarihi Testi</title>
    <style>
        :root {
            --primary: #2E8B57;
            --success: #228B22;
            --danger: #B22222;
            --light: #F5FFFA;
            --dark: #2F4F4F;
            --accent: #32CD32;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2E8B57 0%, #32CD32 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "📜";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 139, 87, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-cover:hover {
            background-color: rgba(46, 139, 87, 0.85);
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(34, 139, 34, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(46, 139, 87, 0.3);
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            transition: all 0.3s ease;
        }
        
        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .word {
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        
        .meaning {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--dark);
        }
        
        .category {
            display: inline-block;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .category-yararli { background: #2E8B57; }
        .category-zararli-azinlik { background: #B22222; }
        .category-zararli-turk { background: #8B0000; }
        .category-genel { background: #2E8B57; }
        .category-kurulus { background: #228B22; }
        .category-ozellik { background: #32CD32; }
        .category-millimucadele { background: #2E8B57; }
        .category-kuvayimilliye { background: #228B22; }
        .category-isgaller { background: #32CD32; }
        .category-kahramanlar { background: #2E8B57; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @media (max-width: 600px) {
            .container {
                border-radius: 10px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .question {
                font-size: 1.1rem;
            }
            
            .option-btn {
                padding: 14px 16px;
                font-size: 1rem;
            }
            
            .cat-image {
                max-width: 150px;
                max-height: 120px;
            }
            
            .cat-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📜 Türk İnkılap Tarihi</h1>
            <div class="subtitle">Milli Mücadele Dönemi Karma Testi</div>
        </header>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="quiz-container" id="quizContainer">
            <div class="stats">
                <div class="score">Puan: <span id="score">0</span></div>
                <div>İlerleme: <span id="progress">0</span>/<span id="total">0</span></div>
            </div>
            
            <div class="question-container">
                <div class="question" id="question"></div>
            </div>
            
            <div class="options" id="options">
                <div class="cat-cover" id="catCover">
                    <img src="https://cataas.com/cat" alt="Random Cat" class="cat-image">
                    <div class="cat-text">Cevapları görmek için tıklayın!</div>
                </div>
            </div>
            
            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
            </div>
            
            <button class="next-btn" id="nextBtn" style="display: none;">Sonraki Soru</button>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <h2 class="results-title">🏆 Test Tamamlandı!</h2>
            <div class="final-score" id="finalScore"></div>
            <p id="resultMessage"></p>
            
            <div class="word-list" id="wordList"></div>
            
            <button class="next-btn" onclick="location.reload()" style="margin-top: 30px;">Tekrar Oyna</button>
        </div>
    </div>

                    "Osmanlı temsilcileri"
                ],
                explanation: "Milne Hattı, İngiliz General Milne başkanlığındaki İtilaf Devletleri temsilcileri tarafından çizilmiştir. Yunan işgalinin sınırlarını belirlemek için oluşturulmuştur."
            },
            {
                word: "Milne Hattı'nın amacı neydi?",
                meaning: "İşgali kalıcı hale getirmek",
                category: "Önemli Olaylar",
                question: "Milne Hattı'nın amacı neydi?",
                options: [
                    "Bölgede barışı sağlamak",
                    "Yunan işgalini geçici hale getirmek",
                    "Türk-Yunan savaşını durdurmak",
                    "İşgali kalıcı hale getirmek"
                ],
                explanation: "Milne Hattı, Yunan işgalinin geçici değil kalıcı hale getirilmesini amaçlamıştır. İşgalin meşru bir sınır çizgisiyle tescil edilmesi hedeflenmiştir."
            },
            {
                word: "İngilizler ve Fransızlar, Yunan kuvvetlerini zaman zaman Milne Hattı'nın dışına çıkarmalarının nedeni neydi?",
                meaning: "Osmanlı'yı antlaşma yapmaya zorlamak",
                category: "Önemli Olaylar",
                question: "İngilizler ve Fransızlar, Yunan kuvvetlerini zaman zaman Milne Hattı'nın dışına çıkarmalarının nedeni neydi?",
                options: [
                    "Türk kuvvetlerine yardım etmek",
                    "Osmanlı'yı antlaşma yapmaya zorlamak",
                    "Yunanistan'ı cezalandırmak",
                    "Bölgede tarafsız bölge oluşturmak"
                ],
                explanation: "İtilaf Devletleri, Yunan kuvvetlerini hattın dışına çıkararak Osmanlı Hükümeti'ni baskı altına almayı ve kendi istedikleri antlaşmayı imzalatmayı amaçlamışlardır."
            },
            {
                word: "Hatay'ın Türkiye'ye katılması için uzun yıllar mücadele veren ve 1938'de kurulan 'Hatay Devleti'nin ilk ve tek cumhurbaşkanı olan siyasetçi kimdir?",
                meaning: "Tayfur Sökmen",
                category: "Millî Kahramanlar",
                question: "Hatay'ın Türkiye'ye katılması için uzun yıllar mücadele veren ve 1938'de kurulan 'Hatay Devleti'nin ilk ve tek cumhurbaşkanı olan siyasetçi kimdir?",
                options: [
                    "Tayfur Sökmen",
                    "Ali Saip Paşa",
                    "Tayyareci Rahmi Bey",
                    "Tufan Bey"
                ],
                explanation: "Tayfur Sökmen, Hatay'ın anavatan Türkiye'ye katılması için mücadele etmiş ve 1938-1939 arasında Hatay Devleti'nin cumhurbaşkanlığını yapmıştır."
            },
            {
                word: "Osmaniye bölgesinde, halkı örgütleyen ve Kuvayi Milliye'ye katılan, aynı zamanda 'tayyareci' (pilot) unvanına sahip olan milli kahramanımız kimdir?",
                meaning: "Tayyareci Rahmi Bey",
                category: "Millî Kahramanlar",
                question: "Osmaniye bölgesinde, halkı örgütleyen ve Kuvayi Milliye'ye katılan, aynı zamanda 'tayyareci' (pilot) unvanına sahip olan milli kahramanımız kimdir?",
                options: [
                    "Kara Mehmet Çavuş",
                    "Tayyareci Rahmi Bey",
                    "Kamil Onuk",
                    "Karayılan"
                ],
                explanation: "Tayyareci Rahmi Bey, Osmaniye yöresinde Fransız işgaline karşı direnişi örgütlemiş, pilot olması nedeniyle bu unvanla anılmıştır."
            }
        ];

        // DOM elements
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const progressBarEl = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const resultMessageEl = document.getElementById('resultMessage');
        const wordListEl = document.getElementById('wordList');
        const catCoverEl = document.getElementById('catCover');

        // Quiz state
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        let masteredWords = [];

        // Shuffle array function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize quiz
        function initQuiz() {
            questions = shuffleArray([...quizData]);
            totalEl.textContent = questions.length;
            showQuestion();
            
            // Add click event to cat cover
            catCoverEl.addEventListener('click', removeCatCover);
        }

        // Remove cat cover to reveal answers
        function removeCatCover() {
            catCoverEl.style.display = 'none';
        }

        // Show current question
        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;
            
            // Reset cat cover
            catCoverEl.style.display = 'flex';
            
            // Shuffle options
            const options = shuffleArray([...currentQuestion.options]);
            
            // Clear previous options
            optionsEl.innerHTML = '';
            
            // Add cat cover back
            optionsEl.appendChild(catCoverEl);
            
            // Create new option buttons
            options.forEach(option => {
                const button = document.createElement('button');
                button.classList.add('option-btn', 'fade-in');
                button.textContent = option;
                button.addEventListener('click', () => selectAnswer(option, currentQuestion));
                optionsEl.appendChild(button);
            });
            
            // Reset UI for new question
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            progressEl.textContent = currentQuestionIndex;
            progressBarEl.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;
        }

        // Handle answer selection
        function selectAnswer(selectedOption, currentQuestion) {
            const optionButtons = document.querySelectorAll('.option-btn');
            
            // Disable all buttons
            optionButtons.forEach(button => {
                button.disabled = true;
                
                // Mark correct answer
                if (button.textContent === currentQuestion.meaning) {
                    button.classList.add('correct');
                }
                
                // Mark incorrect selected answer
                if (button.textContent === selectedOption && button.textContent !== currentQuestion.meaning) {
                    button.classList.add('incorrect');
                }
            });
            
            // Check if answer is correct
            const isCorrect = selectedOption === currentQuestion.meaning;
            
            // Update score if correct
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
                
                // Add to mastered words if not already there
                if (!masteredWords.some(w => w.word === currentQuestion.word)) {
                    masteredWords.push(currentQuestion);
                }
            }
            
            // Show feedback
            feedbackEl.style.display = 'block';
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            
            if (isCorrect) {
                feedbackTextEl.innerHTML = `✅ Doğru! <strong>${currentQuestion.explanation}</strong>`;
            } else {
                feedbackTextEl.innerHTML = `❌ Yanlış! Doğru cevap: <strong>${currentQuestion.meaning}</strong><br><br>${currentQuestion.explanation}`;
            }
            
            // Show next button
            nextBtn.style.display = 'block';
        }

        // Move to next question
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        // End quiz and show results
        function endQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            
            const percentage = Math.round((score / questions.length) * 100);
            finalScoreEl.textContent = `${score}/${questions.length} (${percentage}%)`;
            
            // Result message based on performance
            if (percentage >= 90) {
                resultMessageEl.textContent = "Mükemmel! Milli Mücadele dönemini çok iyi biliyorsunuz! 🏆";
            } else if (percentage >= 70) {
                resultMessageEl.textContent = "Çok iyi! Tarih bilginiz güçlü. 👍";
            } else if (percentage >= 50) {
                resultMessageEl.textContent = "Güzel! Bilginizi geliştirmeye devam edin. 💪";
            } else {
                resultMessageEl.textContent = "Öğrenmeye devam! Milli Mücadele'yi tekrar edin. 📚";
            }
            
            // Display all words learned
            wordListEl.innerHTML = '<h3 style="color: var(--primary); margin-bottom: 20px;">Öğrenilen Tüm Kavramlar</h3>';
            quizData.forEach(word => {
                const wordCard = document.createElement('div');
                wordCard.classList.add('word-card', 'fade-in');
                wordCard.innerHTML = `
                    <div class="word">${word.question}</div>
                    <div class="meaning">${word.meaning}</div>
                    <div class="category category-${getCategoryClass(word.category)}">${word.category}</div>
                `;
                wordListEl.appendChild(wordCard);
            });
        }

        // Helper function to get CSS class for category
        function getCategoryClass(category) {
            const classes = {
                'Yararlı Cemiyetler': 'yararli',
                'Zararlı Cemiyetler (Azınlık)': 'zararli-azinlik',
                'Zararlı Cemiyetler (Türk)': 'zararli-turk',
                'Milli Mücadele İlkeleri': 'genel',
                'Kuva-yı Milliye': 'kurulus',
                'İşgaller': 'ozellik',
                'Millî Kahramanlar': 'yararli',
                'Önemli Olaylar': 'genel'
            };
            return classes[category] || 'genel';
        }

        // Event listeners
        nextBtn.addEventListener('click', nextQuestion);
        
        // Start the quiz
        initQuiz();
    </script>
</body>
