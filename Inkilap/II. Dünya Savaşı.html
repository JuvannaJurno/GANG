<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 Çağdaş Türkiye Tarihi - II. Dünya Savaşı</title>
    <style>
        :root {
            --primary: #0b3b5f;
            --success: #2E8B57;
            --danger: #B22222;
            --light: #e6f0fa;
            --dark: #1e3a5f;
            --accent: #1e6f9f;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0b3b5f 0%, #1e6f9f 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "📚";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }

        /* YENİ: Hikaye Konteyneri Stilleri */
        #storyContainer {
            display: none;
            background: var(--light);
            border-left: 6px solid var(--accent);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease;
        }

        .story-title {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid rgba(30, 111, 159, 0.2);
            padding-bottom: 10px;
        }

        #storyText {
            font-size: 1.15rem;
            line-height: 1.7;
            color: var(--dark);
            margin-bottom: 20px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 59, 95, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(46, 139, 87, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            text-align: left;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .question { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌊 Çağdaş Türkiye Tarihi</h1>
            <div class="subtitle">II. Dünya Savaşı (1939-1945)</div>
            <div class="subtitle" style="font-size:0.85rem; margin-top:5px;">Hikayeli ve Kronolojik Soru Akışı</div>
        </header>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="quiz-container" id="quizContainer">
            
            <div id="storyContainer">
                <h3 class="story-title">📖 Tarihsel Bağlam</h3>
                <p id="storyText"></p>
                <button class="next-btn" id="continueBtn">Soruya Geç ➡️</button>
            </div>

            <div class="stats" id="statsContainer">
                <div class="score">📊 Puan: <span id="score">0</span></div>
                <div>📌 Soru: <span id="progress">0</span>/<span id="total">0</span></div>
            </div>
            
            <div class="question-container" id="questionWrap">
                <div class="question" id="question"></div>
            </div>
            
            <div class="options" id="options">
                <div class="cat-cover" id="catCover">
                    <img src="https://cataas.com/cat" alt="Random Cat" class="cat-image">
                    <div class="cat-text">🐾 Şıkları görmek için bir sayıya (1-4) basın veya tıklayın!</div>
                </div>
            </div>
            
            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
            </div>
            
            <button class="next-btn" id="nextBtn" style="display: none;">➡️ Sonraki Soru (Boşluk)</button>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <h2 class="results-title">🏆 Konu Tamamlandı!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="word-list" id="wordList"></div>
            <button class="next-btn" onclick="location.reload()">🔄 Tekrar Oyna</button>
        </div>
    </div>

    <script>
        // ========== II. DÜNYA SAVAŞI (KRONOLOJİK HİKAYELİ - 50 SORU) ==========
        const quizData = [
            // --- BÖLÜM 1: Savaşın Ayak Sesleri ve Bloklaşmalar ---
            { 
                story: "I. Dünya Savaşı'nı bitiren Paris Barış Konferansı ve Versay Antlaşması, kalıcı bir barış getirmekten ziyade yeni bir savaşın tohumlarını ekmişti. Almanya, Weimar Cumhuriyeti döneminde hiperenflasyon ve ekonomik çöküşle boğuşurken, Hitler bu öfkeyi örgütleyerek iktidara geldi. Amacı sadece Versay'ın prangalarını kırmak değil, Alman ırkı için Doğu Avrupa'da devasa bir 'Hayat Sahası' (Lebensraum) yaratmaktı. Öte yandan İtalya, I. Dünya Savaşı'ndan galip ayrılmasına rağmen istediği toprakları alamamış, bu 'Sakat Zafer' psikolojisi Mussolini'nin Faşizmini ve Akdeniz'i bir İtalyan gölü (Bizim Deniz / Mare Nostrum) yapma hayalini doğurmuştu. Uzak Doğu'da ise Meiji Restorasyonu ile sanayileşen Japonya, dar adasına sığmıyor, hammadde ihtiyacını karşılamak için 'Ortak Refah Alanı' parolasıyla Asya'yı sömürgeleştirmek istiyordu. Mevcut düzeni korumak isteyen Statükocu devletler (İngiltere ve Fransa) ile haritaları kanla yeniden çizmek isteyen Revizyonist devletler (Almanya, İtalya, Japonya) arasındaki uçurum, Berlin-Roma-Tokyo Mihveri'nin kurulmasıyla geri dönülmez bir noktaya ulaştı.",
                question: "Hayat Sahası (Lebensraum) nedir?", options: ["Sömürgeler elde ederek deniz ticaretini kontrol etme amacıdır.", "Nüfusa yeterli yaşama alanı sağlamak için sınırları genişletme politikasıdır.", "Sınırları korumak için kurulan savunma odaklı askeri ittifaktır.", "Ekonomik kalkınma için uygulanan gümrük birliği sistemidir."], correctAnswer: "B", meaning: "Lebensraum (Hayat Sahası), özellikle Nazi Almanyası'nın kendi nüfusuna yer açmak amacıyla Doğu Avrupa'yı işgal etmesini gerekçelendiren yayılmacı politikadır." 
            },
            { question: "Almanya'nın II. Dünya Savaşı'na girmesindeki en temel ve belirleyici motivasyon aşağıdakilerden hangisidir?", options: ["Komünizm ideolojisini Avrupa geneline yaymak", "Versay Antlaşması'nın zincirlerini kırmak ve 'Hayat Sahası'na ulaşmak", "Milletler Cemiyeti'nin aldığı kararları tüm dünyaya uygulamak", "ABD'nin Avrupa üzerindeki ekonomik baskısını sona erdirmek"], correctAnswer: "B", meaning: "Almanya, I. Dünya Savaşı sonrası imzalanan ağır şartlı Versay Antlaşması'nı geçersiz kılmayı ve Alman ırkı için yeni yerleşim alanları (Lebensraum) açmayı ana hedef olarak belirlemiştir." },
            { question: "Nazi Almanyası'nda 'Kahverengi Gömlekliler' olarak bilinen paramiliter grup hangisidir?", options: ["SS", "Gestapo", "SA", "Wehrmacht"], correctAnswer: "C", meaning: "SA (Sturmabteilung), Nazi Partisi'nin ilk paramiliter kanadı olup üyelerinin giydiği üniformadan dolayı 'Kahverengi Gömlekliler' olarak anılmıştır." },
            { question: "Mussolini tarafından 1934 yılında irat edilen 'Skalla Nutku'nun temel içeriği nedir?", options: ["İtalya'nın Afrika ve Asya'daki yayılmacı hedeflerinin açıklanması", "İtalya'nın Milletler Cemiyeti'nden çekilme kararının duyurulması", "Roma-Berlin Mihverinin kurulduğunun dünyaya ilan edilmesi", "Habeşistan işgalinin sona erdiğinin bildirilmesi"], correctAnswer: "A", meaning: "Skalla Nutku, Mussolini'nin İtalya'nın tarihi emellerinin Afrika ve Asya üzerine olduğunu vurguladığı, yayılmacı dış politikasını resmileştiren konuşmadır." },
            { question: "Japonya'nın 'Asya Asyalılarındır' sloganıyla başlattığı, Batılıları bölgeden uzaklaştırıp kendi hegemonyasını kurmayı amaçladığı politikanın adı nedir?", options: ["Meiji Restorasyonu", "Shinto Doktrini", "Ortak Refah Alanı", "Barış İçinde Bir Arada Yaşama"], correctAnswer: "C", meaning: "Ortak Refah Alanı, Japonya'nın II. Dünya Savaşı sırasında Asya'yı Batı sömürgeciliğinden kurtarma bahanesiyle kendi kontrolü altına alma projesidir." },
            { question: "I. Dünya Savaşı sonrası kurulan dünya düzenini değiştirmek isteyen (Revizyonist) devletler grubu hangisidir?", options: ["İngiltere - Fransa - ABD", "Almanya - İtalya - Japonya", "SSCB - Çin - İngiltere", "Fransa - ABD - Çin"], correctAnswer: "B", meaning: "Almanya, İtalya ve Japonya mevcut sınırları ve düzeni kabul etmedikleri için 'Revizyonist' (düzen değiştirici) devletler olarak anılır." },
            { question: "Mevcut sınırları ve uluslararası düzeni korumaya çalışan (Statükocu/Anti-revizyonist) devletler arasında hangisi yer almaz?", options: ["İngiltere", "Fransa", "İtalya", "ABD"], correctAnswer: "C", meaning: "İngiltere, Fransa ve ABD statükocu taraftayken; İtalya, I. Dünya Savaşı'ndan istediğini alamadığı için revizyonist tarafa geçmiştir." },
            { question: "II. Dünya Savaşı'ndaki bloklaşma ve devletlerin karakteriyle ilgili aşağıdaki eşleşmelerden hangisi doğrudur?", options: ["SSCB - Revizyonist", "Çin - Statükocu (Müttefik)", "Japonya - Statükocu", "Almanya - Anti-revizyonist"], correctAnswer: "B", meaning: "Çin ve SSCB, Japonya ve Almanya'nın yayılmacılığına karşı statükocu (Müttefik) bloğun yanında savaşa dahil olmuşlardır." },
            { question: "Anti-Komintern Paktı'nın temel amacı ve ilk imzalayan devletler hangisidir?", options: ["Akdeniz'de İngiliz etkisini kırmak - Almanya ve İtalya", "Komünizm yayılmasını engellemek - Almanya ve Japonya", "Versay Antlaşması'nı iptal etmek - Almanya ve Avusturya", "Pasifik'te ABD hakimiyetine son vermek - Japonya ve İtalya"], correctAnswer: "B", meaning: "Anti-Komintern Paktı, 1936'da Almanya ve Japonya arasında (1937'de İtalya katıldı) Sovyet yayılmacılığına ve komünizme karşı kurulmuştur." },
            { question: "1939 yılında Almanya ile İtalya arasında imzalanan ve mevcut dostluğu askerî bir ittifaka dönüştüren pakt hangisidir?", options: ["Anti-Komintern Paktı", "Sadabat Paktı", "Çelik Pakt", "Briand-Kellogg Paktı"], correctAnswer: "C", meaning: "Çelik Pakt, II. Dünya Savaşı öncesinde Hitler ve Mussolini'nin askerî güçlerini resmen birleştirdiği ittifak belgesidir." },
            { question: "Berlin-Roma-Tokyo Mihveri'ni (Üçlü Pakt) tamamlayan ve Japonya'nın bu ittifaka resmen katılmasını sağlayan gelişme hangisidir?", options: ["1940 Üçlü Paktı'nın imzalanması", "Pearl Harbor Baskını", "Münih Konferansı", "Barbarossa Harekâtı"], correctAnswer: "A", meaning: "Üçlü Pakt (Tripartite Pact), 1940'ta Berlin, Roma ve Tokyo arasındaki 'Mihver' (Axis) bloğunu resmen kuran anlaşmadır." },

            // --- BÖLÜM 2: Yatıştırma Politikasının İflası ve Savaşın Patlak Vermesi ---
            {
                story: "1930'ların sonuna gelindiğinde Avrupa diken üstündeydi. İngiltere Başbakanı Neville Chamberlain, I. Dünya Savaşı'nın yarattığı kayıp nesil travmasını tekrar yaşamamak adına Hitler'e tavizler verme yoluna gitti. 'Yatıştırma Politikası' (Appeasement) adı verilen bu stratejiyle, 1938 Münih Konferansı'nda sırf savaş çıkmasın diye Çekoslovakya'nın Südetler bölgesi altın tepside Almanya'ya sunuldu. Ancak faşizmin iştahı doyurulamazdı; Hitler kısa süre sonra tüm Çekoslovakya'yı yuttu. Bardağı taşıran son damla ise Polonya oldu. Hitler, iki cephede savaşmamak için ezeli düşmanı SSCB ile tarihin en şaşırtıcı anlaşmalarından birini, Alman-Sovyet Saldırmazlık Paktı'nı (Molotov-Ribbentrop) imzaladı. Bu gizli anlaşmayla Polonya'yı paylaştılar. 1 Eylül 1939 sabahı Alman tankları sınırı geçtiğinde, İngiltere ve Fransa'nın savaşa girmekten başka çaresi kalmamıştı. Savaşın ilk aylarında Almanların 'Yıldırım Harbi' (Blitzkrieg) taktiği o kadar hızlı ve acımasızdı ki, 'asla geçilemez' denilen Fransız Maginot Hattı haftalar içinde çöktü ve Fransa işgal edildi.",
                question: "II. Dünya Savaşı öncesinde Almanya'ya tavizler vererek savaşı önlemeyi amaçlayan 'Yatıştırma Politikası' ile özdeşleşen İngiltere Başbakanı kimdir?", options: ["Winston Churchill", "Neville Chamberlain", "Clement Attlee", "Anthony Eden"], correctAnswer: "B", meaning: "Neville Chamberlain, 'barış içinde yaşamak' adına Hitler'in yayılmacı taleplerine karşı boyun eğen politikanın en önemli temsilcisidir." 
            },
            { question: "Yatıştırma Politikası'nın zirve noktası kabul edilen ve Çekoslovakya'nın Südet bölgesinin Almanya'ya bırakıldığı gelişme hangisidir?", options: ["Münih Konferansı", "Locarno Antlaşması", "Briand-Kellogg Paktı", "Maginot Hattı"], correctAnswer: "A", meaning: "1938 Münih Konferansı, İngiltere ve Fransa'nın savaşı önlemek için Çekoslovakya'yı feda edip Südet bölgesini Almanya'ya verdiği olaydır." },
            { question: "İngiltere'nin uyguladığı 'Yatıştırma Politikası' hangi gelişme üzerine tamamen iflas etmiş ve terk edilmiştir?", options: ["Avusturya'nın ilhakı (Anschluss)", "İspanya İç Savaşı'nın başlaması", "Almanya'nın Polonya'yı işgali", "İtalya'nın Arnavutluk'u işgali"], correctAnswer: "C", meaning: "Almanya'nın 1 Eylül 1939'da Polonya'yı işgali, Chamberlain'in politikasının işe yaramadığını kanıtlamış ve İngiltere'nin Almanya'ya savaş ilan etmesine neden olmuştur." },
            { question: "1 Eylül 1939 tarihinde Almanya'nın Polonya'yı işgal etmesi dünya tarihinde hangi gelişmenin başlangıcı kabul edilir?", options: ["Soğuk Savaş Dönemi", "II. Dünya Savaşı", "I. Dünya Savaşı", "Milletler Cemiyeti"], correctAnswer: "B", meaning: "1 Eylül 1939'da Almanya'nın Polonya'ya saldırması, II. Dünya Savaşı'nın resmen başlamasına neden olan olaydır." },
            { question: "Fransızların II. Dünya Savaşı öncesinde olası bir Alman saldırısını durdurmak amacıyla doğu sınırlarına inşa ettikleri, ancak Almanların etrafından dolanmasıyla işlevsiz kalan devasa savunma hattı hangisidir?", options: ["Mannerheim Hattı", "Maginot Hattı", "Siegfrid Hattı", "Atlantik Duvarı"], correctAnswer: "B", meaning: "Maginot Hattı, Fransa'nın 'aşılmaz' gözüyle baktığı ancak Almanların Belçika üzerinden (Ardenler Ormanları) dolanarak etkisiz hale getirdiği, dönemin en ileri teknolojiyle donatılmış savunma hattıdır." },
            { question: "II. Dünya Savaşı sırasında Fransa'nın Alman işgaline uğraması üzerine Londra'ya giderek 'Özgür Fransa' hareketini başlatan ve Fransız direnişinin sembolü haline gelen devlet adamı kimdir?", options: ["Philippe Pétain", "Charles de Gaulle", "Edouard Daladier", "Paul Reynaud"], correctAnswer: "B", meaning: "Charles de Gaulle, işgal sonrası teslimiyeti reddederek Londra'dan yayınladığı bildiriyle Fransız direnişini örgütlemiş ve savaş sonrası Fransa'nın en önemli siyasi figürü olmuştur." },

            // --- BÖLÜM 3: Cephelerin Genişlemesi ve Savaşın Küreselleşmesi ---
            {
                story: "Fransa'nın düşüşüyle kıta Avrupası'nda tek başına kalan İngiltere, havadan devasa bir Alman bombardımanına (Kartal Hücumu) maruz kaldı. Ancak İngiliz Kraliyet Hava Kuvvetleri'nin (RAF) radar teknolojisini ustaca kullanması ve halkın direnişi, Hitler'in İngiltere'yi işgal planlarını suya düşürdü. Batı'da tıkanan Hitler, hayatının en ölümcül hatasını yaparak gözünü komünizmin merkezine, Sovyetler Birliği'ne çevirdi. 1941 yazında başlayan 'Barbarossa Harekâtı' tarihin gördüğü en büyük kara istilasıydı. Alman orduları Moskova kapılarına kadar dayansa da, karşılarında sadece Kızıl Ordu'yu değil, aynı zamanda dondurucu Rus kışını ('General Kış') buldular. Tam bu sırada, Pasifik'te sular kaynıyordu. ABD'nin Japonya'ya uyguladığı petrol ve çelik ambargosuna misilleme olarak Japon İmparatorluk Donanması, 7 Aralık 1941 sabahı Hawaii'deki ABD Pasifik Filosu'na, Pearl Harbor'a sürpriz bir baskın düzenledi. Bu hamle, izolasyonist takılan 'uyuyan dev' ABD'yi uyandırdı ve savaşı resmen Avrupa'dan çıkarıp tüm küreye yaydı.",
                question: "II. Dünya Savaşı sırasında Almanya'nın, İngiltere'yi hava üstünlüğü kurarak teslim olmaya zorlamak amacıyla başlattığı geniş kapsamlı hava saldırısı hangisidir?", options: ["Barbarossa Harekâtı", "Deniz Aslanı Harekâtı", "Kartal Hücumu", "Overlord Operasyonu"], correctAnswer: "C", meaning: "Kartal Hücumu, Alman Hava Kuvvetleri'nin (Luftwaffe) İngiltere üzerindeki hava hakimiyetini ele geçirmek için başlattığı saldırı dizisidir; başarısızlıkla sonuçlanması Almanya'nın İngiltere'yi işgal planlarını ertelemesine neden olmuştur." 
            },
            { question: "Almanya'nın Bulgaristan ve Yunanistan'ı işgal ederek Türkiye'nin sınırına kadar dayandığı, Türkiye'nin ise bu süreçte 'Aktif Tarafsızlık' politikası izlediği savaş aşağıdakilerden hangisidir?", options: ["I. Dünya Savaşı", "II. Dünya Savaşı", "Balkan Savaşları", "Soğuk Savaş"], correctAnswer: "B", meaning: "II. Dünya Savaşı sırasında Alman orduları (Wehrmacht), Balkan operasyonları sonucunda Bulgaristan ve Yunanistan üzerinden Türkiye sınırına kadar gelmiş; bu durum Türkiye'de seferberlik ilan edilmesine ve Çakmak Hattı'nın oluşturulmasına yol açmıştır." },
            { question: "II. Dünya Savaşı sırasında Almanya'nın, aralarındaki saldırmazlık paktını bozarak Sovyetler Birliği'ne (SSCB) karşı başlattığı devasa askerî harekâtın adı nedir?", options: ["Kartal Hücumu", "Barbarossa Harekâtı", "Normandiya Çıkarması", "Overlord Operasyonu"], correctAnswer: "B", meaning: "Barbarossa Harekâtı, tarihin en büyük kara istilası olup Hitler'in 'Hayat Sahası' (Lebensraum) idealini gerçekleştirmek ve komünizmi yok etmek amacıyla SSCB'ye açtığı savaştır." },
            { question: "II. Dünya Savaşı'nın seyrini değiştiren, Nazi Almanyası'nın 'Hayat Sahası' (Lebensraum) hedefiyle Sovyetler Birliği'ni (SSCB) haritadan silmek için başlattığı askerî operasyon hangisidir?", options: ["Kartal Hücumu", "Barbarossa Harekâtı", "Deniz Aslanı Harekâtı", "Overlord Operasyonu"], correctAnswer: "B", meaning: "Barbarossa Harekâtı, 22 Haziran 1941'de başlamış olup tarihin en büyük kara istilasıdır. Bu harekât ile Almanya, SSCB ile imzaladığı Saldırmazlık Paktı'nı bozmuş ve Doğu Cephesi'ni açmıştır." },
            { question: "ABD'nin II. Dünya Savaşı'na girmesine neden olan ve Pasifik'teki Amerikan donanmasına yönelik gerçekleştirilen Pearl Harbor Baskını hangi devlet tarafından düzenlenmiştir?", options: ["Almanya", "SSCB", "İtalya", "Japonya"], correctAnswer: "D", meaning: "7 Aralık 1941'de gerçekleşen Pearl Harbor Baskını, Japonya'nın ABD'nin Pasifik filosunu etkisiz hale getirmek amacıyla düzenlediği baskındır; bu olay ABD'nin tarafsızlığına son vererek Müttefik Devletler safında savaşa girmesine yol açmıştır." },
            { question: "II. Dünya Savaşı'na sonradan dahil olan ve savaşın gidişatını değiştirerek sona ermesinde belirleyici rol oynayan devlet hangisidir?", options: ["SSCB", "ABD", "Çin", "İngiltere"], correctAnswer: "B", meaning: "ABD, 1941'de Pearl Harbor baskını sonrası savaşa dahil olmuş; hem Avrupa cephesinde Almanya'nın hem de Pasifik'te atom bombalarıyla Japonya'nın teslim olmasında en büyük rolü oynayarak savaşı bitiren güç olmuştur." },
            { question: "1941 yılında ABD (Roosevelt) ve İngiltere (Churchill) tarafından yayınlanan, Milletler Cemiyeti'nin yerini alacak olan Birleşmiş Milletler'in (BM) temel belgesi sayılan bildiri hangisidir?", options: ["Balfour Deklarasyonu", "Atlantik Bildirisi", "Wilson İlkeleri", "Helsinki Nihai Senedi"], correctAnswer: "B", meaning: "Atlantik Bildirisi, savaş sonrasında toprak kazanılmayacağı, ulusların kendi kaderini tayin hakkı (self-determinasyon) ve açık denizlerde serbesti gibi ilkeleri içeren, BM'nin temelini atan belgedir." },

            // --- BÖLÜM 4: Müttefiklerin Karşı Taarruzu ve Diplomasisi ---
            {
                story: "1942 sonlarına doğru psikolojik ve askeri üstünlük el değiştirmeye başladı. Pasifik'te Midway Deniz Savaşı ile Japon ilerleyişi durduruldu. Kuzey Afrika'da El Alamein'de Alman-İtalyan orduları yenilgiye uğratıldı. Ancak en büyük kırılma, Doğu Cephesi'nde, taş taş üstünde kalmayan Stalingrad'da yaşandı; Alman 6. Ordusu'nun tamamen yok edilmesiyle Nazi savaş makinesi ölümcül bir yara aldı. Bu zafer rüzgarını arkasına alan Müttefikler, önce Kuzey Afrika'dan İtalya'ya çıkarak Mussolini'yi devirdiler, ardından 1944'te tarihin en büyük amfibi harekâtı olan 'Normandiya Çıkarması' (Operation Overlord) ile Fransa'yı Nazilerden kurtararak Almanya'yı iki cephe arasında ezmeye başladılar. Zaferin ufukta görünmesiyle birlikte Roosevelt, Churchill ve Stalin gibi liderler (Üç Büyükler); Tahran, Yalta ve Potsdam gibi konferanslarda sık sık bir araya gelerek Almanya'nın nasıl bölüşüleceğini, Polonya sınırlarını ve savaş sonrası dünyanın nasıl yönetileceğini planladılar. Bu masalarda atılan temeller, aynı zamanda Birleşmiş Milletler'in (BM) de doğum belgesi olacaktı.",
                question: "1943 yılında ABD (Roosevelt) ve İngiltere (Churchill) arasında düzenlenen, Fransa kıyılarında bir 'İkinci Cephe' açılması (Normandiya Çıkarması) kararının kesinleştiği konferans hangisidir?", options: ["Yalta Konferansı", "Quebec Konferansı", "Potsdam Konferansı", "Casablanca Konferansı"], correctAnswer: "B", meaning: "Quebec Konferansı, Müttefiklerin Avrupa'da Alman işgaline son vermek için düzenleyecekleri 'Overlord Operasyonu'nun (Normandiya Çıkarması) planlandığı stratejik toplantıdır." 
            },
            { question: "II. Dünya Savaşı'nın dönüm noktalarından biri olan, Müttefik Devletler'in Alman işgali altındaki Fransa'yı kurtarmak amacıyla düzenlediği tarihin en büyük denizden karaya askerî harekâtı hangisidir?", options: ["Barbarossa Harekâtı", "Normandiya Çıkarması (Overlord)", "Kartal Hücumu", "Leyte Körfezi Savaşı"], correctAnswer: "B", meaning: "Normandiya Çıkarması, 6 Haziran 1944 (D-Day) tarihinde başlamış; Müttefiklerin Avrupa'da ikinci bir cephe açarak Almanya'nın yenilgi sürecini hızlandırmasını ve Paris'in kurtarılmasını sağlamıştır." },
            { question: "II. Dünya Savaşı sırasında 'Üç Büyükler' (Stalin, Roosevelt, Churchill) olarak adlandırılan liderlerin ilk kez bir araya geldiği ve Normandiya Çıkartması'nın (Overlord Operasyonu) kararlaştırıldığı konferans aşağıdakilerden hangisidir?", options: ["Tahran Konferansı", "Casablanca Konferansı", "Potsdam Konferansı", "Yalta Konferansı"], correctAnswer: "A", meaning: "Tahran Konferansı (1943), Üç Büyükler'in ilk kez bizzat buluştuğu yerdir. Türkiye'nin savaşa girmesi yönündeki baskılar burada başlamış, ancak asıl konu Avrupa'da 'İkinci Cephe'nin açılması olmuştur." },
            { question: "1945'te toplanan Yalta Konferansı'nda, bir devletin Birleşmiş Milletler'e (BM) 'kurucu üye' olarak katılabilmesi için belirlenen temel şart aşağıdakilerden hangisidir?", options: ["San Francisco Konferansı'na ev sahipliği yapmak", "1 Mart 1945'e kadar Almanya ve müttefiklerine resmen savaş açmak", "Mihver Devletleri ile olan tüm ticari ilişkilerini 1944'ten önce kesmek", "Atlantik Bildirisi'ndeki maddelerin tamamını anayasasına eklemek"], correctAnswer: "B", meaning: "Yalta Konferansı'nda alınan bu karar gereği, Türkiye gibi savaşın sonuna kadar tarafsız kalan devletler, BM kurucu üyesi olabilmek için 1945 yılı başında Almanya ve Japonya'ya sembolik olarak savaş ilan etmiştir." },
            { question: "1945 yılında düzenlenen ve Birleşmiş Milletler Antlaşması'nın imzalanarak örgütün resmen kurulmasını sağlayan konferans aşağıdakilerden hangisidir?", options: ["San Francisco Konferansı", "Yalta Konferansı", "Potsdam Konferansı", "Casablanca Konferansı"], correctAnswer: "A", meaning: "Birleşmiş Milletler (BM), II. Dünya Savaşı sonrasında küresel barışı korumak adına San Francisco'da düzenlenen konferans sonucunda resmen kurulmuştur." },
            { question: "Birleşmiş Milletler Güvenlik Konseyi'nde (BMGK) alınan kararları tek başına veto etme yetkisine sahip olan '5 Daimi Üye' arasında aşağıdakilerden hangisi yer almaz?", options: ["ABD", "Rusya", "Almanya", "İngiltere"], correctAnswer: "C", meaning: "Birleşmiş Milletler'in daimi üyeleri; Fransa, İngiltere, Rusya, Çin ve ABD'dir. Bu ülkeler, 'FİRÇA' kodlamasıyla kolayca hatırlanabilir." },
            { question: "II. Dünya Savaşı'nın sonlarına doğru, Almanya'nın teslim olmasının ardından savaş sonrası düzeni ve barış şartlarını belirlemek amacıyla düzenlenen; Stalin, Truman ve Clement Attlee'nin katıldığı konferans hangisidir?", options: ["Yalta Konferansı", "Potsdam Konferansı", "Tahran Konferansı", "Moskova Konferansı"], correctAnswer: "B", meaning: "Potsdam Konferansı, Müttefik liderlerin savaş sonrası Avrupa'nın durumunu ve Almanya'nın geleceğini görüştüğü son büyük zirvedir. Konferansa SSCB'den Stalin, ABD'den Truman ve İngiltere'den (seçimi kazandığı için Churchill'in yerine geçen) Clement Attlee katılmıştır." },

            // --- BÖLÜM 5: Türkiye'nin Savaş Yıllarındaki Stratejisi ---
            {
                story: "Balkanlar, Ege Adaları ve Kafkaslar alev alev yanarken, Türkiye Cumhuriyeti sınırlarını bir barış adası olarak tutmayı başardı. Cumhurbaşkanı İsmet İnönü liderliğindeki Türkiye, 'Aktif Tarafsızlık' ve 'Denge' politikası güderek hem Müttefiklerin hem de Mihver'in baskılarına göğüs gerdi. Müttefikler, Adana ve Kahire Konferanslarında Türkiye'yi Balkanlar'da yeni bir cephe açması için sürekli savaşa zorluyor, Türkiye ise ordusunun lojistik ve silah eksikliğini öne sürerek bu talepleri nazikçe oyaladı. Ancak savaşa girmemiş olmak, savaşın yıkıcı etkilerinden kaçmak anlamına gelmiyordu. Genç nüfusun silah altına alınması, üretimi durma noktasına getirdi. Refik Saydam ve Şükrü Saracoğlu hükümetleri döneminde çıkarılan Milli Korunma Kanunu ile ekonomi devlet kontrolüne alındı; ekmek karneye bağlandı, gece karartmaları yapıldı. Savaş zenginlerini vergilendirmek amacıyla çıkarılan ancak uygulamadaki hatalar nedeniyle azınlıkları mağdur eden Varlık Vergisi ve bedenen çalışmayı zorunlu kılan Yol Vergisi dönemin en tartışmalı iç politika hamleleri oldu. Türkiye, savaşın sonlarına doğru, Şubat 1945'te, sırf Birleşmiş Milletler'in kurucu üyesi olabilmek ve savaş sonrası düzende masada yer alabilmek için Almanya ve Japonya'ya sembolik olarak savaş ilan edecektir.",
                question: "II. Dünya Savaşı'nın devam ettiği 1939-1945 yılları arasında Türkiye Cumhuriyeti'nin Cumhurbaşkanlığı görevini yürüten devlet adamı kimdir?", options: ["Mustafa Kemal Atatürk", "İsmet İnönü", "Celal Bayar", "Fevzi Çakmak"], correctAnswer: "B", meaning: "İsmet İnönü, II. Dünya Savaşı boyunca Türkiye'nin Cumhurbaşkanı olarak görev yapmış ve ülkeyi savaşın yıkımından uzak tutmak için denge politikası izlemiştir." 
            },
            { question: "Türkiye'de II. Dünya Savaşı'nın yaşandığı 1939-1945 yılları arasında hükümetin başında bulunarak Başbakanlık görevini yürüten devlet adamları aşağıdakilerden hangisinde birlikte verilmiştir?", options: ["Refik Saydam - Şükrü Saraçoğlu", "Celal Bayar - Adnan Menderes", "Fevzi Çakmak - Kazım Karabekir", "Hasan Saka - Şemseddin Günaltay"], correctAnswer: "A", meaning: "II. Dünya Savaşı sırasında Türkiye'de iki başbakan görev yapmıştır: Savaşın başında Refik Saydam (1939-1942), onun vefatından sonra ise Şükrü Saraçoğlu (1942-1946) bu makamda bulunmuştur." },
            { question: "II. Dünya Savaşı sırasında, Alman ordularının Balkanlar üzerinden Türkiye'ye saldırma ihtimaline karşı Trakya sınırında (Edirne-Kırklareli hattında) oluşturulan savunma hattına ne ad verilir?", options: ["Maginot Hattı", "Çakmak Hattı", "Siegfried Hattı", "Mannerheim Hattı"], correctAnswer: "B", meaning: "Çakmak Hattı, II. Dünya Savaşı'nda olası bir Alman işgalini durdurmak amacıyla dönemin Genelkurmay Başkanı Mareşal Fevzi Çakmak'ın planlamasıyla Trakya'da kurulan savunma hattıdır." },
            { question: "II. Dünya Savaşı'nın ekonomik etkilerini kontrol altına almak amacıyla 1940 yılında çıkarılan; devlete ekonomiye doğrudan müdahale etme, ürünlere fiyat koyma (narh) ve çalışma yükümlülüğü getirme gibi geniş yetkiler tanıyan kanun aşağıdakilerden hangisidir?", options: ["Teşvik-i Sanayi Kanunu", "Milli Korunma Kanunu", "Toprak Mahsulleri Vergisi", "Men-i Müskirat Kanunu"], correctAnswer: "B", meaning: "Milli Korunma Kanunu (1940), savaş ekonomisinin yarattığı karaborsa ve enflasyonla mücadele etmek için çıkarılmıştır. Bu kanun kapsamında İaşe Müsteşarlığı kurulmuş, temel tüketim maddelerine narh (sabit fiyat) konulmuş ve halkın temel ihtiyaçlarını karşılamak için Ekmek Karnesi uygulamasına geçilmiştir." },
            { question: "II. Dünya Savaşı sürecinde yaşanan gıda darlığı nedeniyle, başta ekmek olmak üzere temel tüketim maddelerinin karaborsaya düşmesini engellemek ve halka adil şekilde dağıtılmasını sağlamak amacıyla Türkiye'de başlatılan uygulama aşağıdakilerden hangisidir?", options: ["Narh Sistemi", "Karne Uygulaması", "İaşe Vergisi", "Teşvik-i Sanayi"], correctAnswer: "B", meaning: "Karne Uygulaması (özellikle Ekmek Karnesi), II. Dünya Savaşı'nın getirdiği kıtlık ve ekonomik zorluklar karşısında gıda maddelerinin hükûmet kontrolünde, kişi başına belirlenen paylarla dağıtılması yöntemidir. 1942 yılında başlayan bu uygulama ile un, şeker ve ekmek gibi temel ihtiyaçlar ancak karne ibraz edilerek satın alınabilmiştir." },
            { question: "1942 yılında, II. Dünya Savaşı'nın yarattığı ekonomik zorlukları aşmak, karaborsacılığı önlemek ve haksız kazançları vergilendirmek amacıyla Şükrü Saraçoğlu hükümeti tarafından çıkarılan kanun aşağıdakilerden hangisidir?", options: ["Toprak Mahsulleri Vergisi", "Varlık Vergisi", "Milli Korunma Kanunu", "Yol Vergisi"], correctAnswer: "B", meaning: "Varlık Vergisi, II. Dünya Savaşı döneminde ticaretle uğraşan kesimden alınan tek seferlik ve yüksek oranlı bir vergidir. Uygulama sürecinde özellikle gayrimüslim vatandaşları hedef alması ve vergi borcunu ödeyemeyenlerin Erzurum Aşkale'ye zorunlu çalışma kampına (taş kırma işine) gönderilmesi nedeniyle tarihte büyük tartışmalara yol açmıştır." },
            { question: "II. Dünya Savaşı'nın ekonomik yükünü hafifletmek ve ordunun intikalini kolaylaştıracak ulaşım ağını geliştirmek amacıyla, 18-60 yaş arası erkek vatandaşlardan nakit veya bedenen çalışma şeklinde alınan vergi aşağıdakilerden hangisidir?", options: ["Varlık Vergisi", "Toprak Mahsulleri Vergisi", "Yol Vergisi", "Ağnam Vergisi"], correctAnswer: "C", meaning: "Yol Vergisi, aslında erken Cumhuriyet döneminde yürürlüğe girmiş olsa da, II. Dünya Savaşı yıllarında bütçe açıklarını kapatmak ve stratejik askeri yolların inşasını sağlamak için çok daha sıkı uygulanmıştır. Maddi imkânı olmayan vatandaşlar, bu vergiyi yol inşaatlarında bizzat çalışarak (bedeni mükellefiyet) ödemişlerdir." },
            { question: "Aşağıdakilerden hangisi II. Dünya Savaşı (1939-1945) yıllarında Türkiye'de yaşanan ekonomik veya sosyal gelişmelerden biri değildir?", options: ["Milli Korunma Kanunu'nun çıkarılması", "Varlık Vergisi'nin uygulanması", "Takrir-i Sükun Kanunu'nun çıkarılması", "Ekmek Karnesi uygulamasının başlatılması"], correctAnswer: "C", meaning: "Takrir-i Sükun Kanunu, 1925 yılında Şeyh Sait İsyanı sonrası huzur ve güvenliği sağlamak amacıyla çıkarılmış ve 1929'a kadar yürürlükte kalmıştır. II. Dünya Savaşı (1939-1945) döneminden çok daha önce, Atatürk dönemi gelişmeleri arasında yer alır." },
            { question: "II. Dünya Savaşı'nın sonlarına doğru Almanya'nın işgal ettiği bölgelerden çekilmesiyle oluşan otorite boşluğunun Sovyet Rusya (komünizm) tarafından doldurulmasını istemeyen Müttefik Devletler'in, Türkiye'yi bu bölgede 'dengeleyici bir güç' olarak görmelerinin temel sebebi nedir?", options: ["Türkiye'nin sanayileşmiş bir ekonomi olması", "Sovyetler Birliği'nin Akdeniz'e inmesini ve Balkanlar'da yayılmasını engellemek", "Türkiye'nin Almanya ile gizli bir ittifak içinde olması", "Milletler Cemiyeti'nin Türkiye tarafından yönetilmesi"], correctAnswer: "B", meaning: "Müttefikler (özellikle İngiltere ve ABD), savaş sonrası Avrupa haritası şekillenirken Sovyet Rusya'nın nüfuz alanını genişletmesinden endişe etmişlerdir. Türkiye'nin jeopolitik konumu, Boğazlar'a hakimiyeti ve Balkanlar ile Orta Doğu arasındaki köprü görevi, onu komünizmin yayılmasını durduracak bir 'set' veya 'tampon bölge' haline getirmiştir." },
            { question: "II. Dünya Savaşı sonunda Müttefiklerin Türkiye'yi kendi yanlarında görmek istemelerinin temel sebebi nedir?", options: ["Türkiye'nin zengin enerji kaynaklarına sahip olması", "Almanya'nın çekilmesiyle oluşan boşluğu SSCB yerine Türkiye'nin doldurmasının istenmesi", "Türkiye'nin Avrupa'nın en büyük sanayi gücü haline gelmesi", "İtalya'nın Akdeniz'deki yayılmacılığını Türkiye ile durdurmak"], correctAnswer: "B", meaning: "Müttefikler, Almanya sonrası Orta Avrupa ve Balkanlar'da oluşacak otorite boşluğunu komünist Rusya'nın doldurmasını engellemek için Türkiye'yi bir 'set' olarak kullanmak istemiştir." },
            { question: "1943 yılında İsmet İnönü ile Winston Churchill arasında gerçekleşen, İngiltere'nin Türkiye'yi savaşa sokma baskısına karşı Türkiye'nin aşırı askeri yardım taleplerinde direnmesi nedeniyle 'Sağırlar Diyaloğu' olarak adlandırılan görüşme aşağıdakilerden hangisidir?", options: ["Kahire Konferansı", "Adana Görüşmeleri", "Moskova Konferansı", "Tahran Konferansı"], correctAnswer: "B", meaning: "Adana Görüşmeleri, Churchill'in Türkiye'yi Müttefik safına çekme çabasına karşı, İnönü'nün ordunun eksiklerini bahane ederek zaman kazandığı ve sonuçsuz kaldığı için 'Sağırlar Diyaloğu' olarak tarihe geçen buluşmadır." },
            { question: "1943 yılında Roosevelt ve Churchill'in, Türkiye Cumhurbaşkanı İsmet İnönü ile bir araya gelerek Türkiye'nin savaşa katılması konusundaki baskılarını en üst seviyeye çıkardığı görüşme aşağıdakilerden hangisidir?", options: ["Tahran Konferansı", "Kahire Konferansı", "Moskova Konferansı", "Yalta Konferansı"], correctAnswer: "B", meaning: "Kahire Konferansı, Müttefiklerin Türkiye'yi savaşa sokmak için son büyük diplomatik hamlesidir. İsmet İnönü, ordunun teknik donanım eksikliğini öne sürerek prensipte savaşa katılmayı kabul etmiş ancak fiili girişi şartlar oluşmadığı gerekçesiyle ertelemiştir." },
            { question: "II. Dünya Savaşı sonrasında Türkiye'nin Birleşmiş Milletler'e kurucu üye olarak katılmasını sağlayan dönemin devlet adamı kimdir?", options: ["Mustafa Kemal Atatürk", "İsmet İnönü", "Fevzi Çakmak", "Celal Bayar"], correctAnswer: "B", meaning: "Türkiye, İsmet İnönü döneminde 1945'te San Francisco Konferansı'na katılarak Birleşmiş Milletler'in kurucu üyeleri arasında yer almıştır." },

            // --- BÖLÜM 6: Çöküş, Nükleer Çağ ve Soğuk Savaş'a Geçiş ---
            {
                story: "1945 baharında Sovyet askerleri Berlin'e girdiğinde, Avrupa için kâbus sona ermişti. Hitler sığınağında intihar ederken, Almanya kayıtsız şartsız teslim oldu. Ancak Pasifik'te Japonya, onur intiharları (Kamikaze) ile direnmeye devam ediyordu. ABD, hem savaşı hızlıca bitirmek hem de yeni yükselen güç SSCB'ye gözdağı vermek amacıyla insanlık tarihinin en karanlık silahını kullandı. 'Manhattan Projesi' kapsamında üretilen atom bombaları, Ağustos 1945'te Hiroşima ve Nagazaki'ye atılarak yüz binlerce sivili saniyeler içinde küle çevirdi. Japonya'nın da teslim olmasıyla 60 milyondan fazla insanın öldüğü II. Dünya Savaşı resmen bitti. Savaşın ardından, Nazilerin soykırım (Holokost) ve insanlığa karşı işledikleri suçlar Nürnberg Mahkemeleri'nde, Japon savaş suçluları ise Tokyo Mahkemeleri'nde yargılandı. 1947 Paris Antlaşması ile sınırlar yeniden çizildi. Faşizm tehlikesi ortadan kalkmıştı ama barış yine de gelmedi. Artık dünya, demokrasiyi savunan ABD bloğu ile komünizmi yaymaya çalışan SSCB bloğu arasında, nükleer silahların gölgesinde yaşanacak ve on yıllar sürecek gergin bir döneme, 'Soğuk Savaş'a giriyordu.",
                question: "Mihver Devletleri arasından II. Dünya Savaşı'ndan ilk çekilen devlet hangisidir?", options: ["Japonya", "İtalya", "Romanya", "Bulgaristan"], correctAnswer: "B", meaning: "İtalya, müttefiklerin Sicilya'ya çıkarma yapması ve Mussolini'nin devrilmesi üzerine Eylül 1943'te teslim anlaşması imzalayarak savaştan çekilen ilk büyük Mihver devleti olmuştur." 
            },
            { question: "II. Dünya Savaşı'nın Müttefik Devletler'in zaferiyle sonuçlanmasının ardından, dünya siyaset sahnesinden silinen ve tasfiye edilen temel ideolojiler aşağıdakilerden hangisidir?", options: ["Liberalizm - Kapitalizm", "Nazizm - Faşizm", "Sosyalizm - Komünizm", "Milliyetçilik - Muhafazakârlık"], correctAnswer: "B", meaning: "Savaşın sonunda Almanya'daki Nazizm ve İtalya'daki Faşizm rejimleri çökmüş, bu ideolojiler insanlık suçu kabul edilerek yasaklanmıştır." },
            { question: "Nürnberg Mahkemeleri'nin temel kuruluş amacı nedir?", options: ["Sınır anlaşmazlıklarını çözmek", "Nazi savaş suçlularını yargılamak", "Yeni bir küresel ekonomik sistem kurmak", "Savaş sonrası mülteci sorununu çözmek"], correctAnswer: "B", meaning: "Nürnberg Mahkemeleri, II. Dünya Savaşı'ndan sonra önde gelen Nazi liderlerinin barışa, savaş hukukuna ve insanlığa karşı işledikleri suçlardan dolayı yargılandığı uluslararası askeri mahkemedir." },
            { question: "II. Dünya Savaşı'nın ardından Almanya'nın 'Federal Almanya' (Batı) ve 'Demokratik Almanya' (Doğu) olarak iki ayrı devlete bölünmesinin temel sebebi aşağıdakilerden hangisidir?", options: ["Almanya'nın ekonomik olarak kendi kendini yönetememesi", "İşgalci güçler olan ABD (Batı Bloğu) ve SSCB (Doğu Bloğu) arasındaki ideolojik görüş ayrılıkları", "Birleşmiş Milletler'in Almanya'nın sanayileşmesini engellemek istemesi", "Almanya'nın başkentini Berlin'den başka bir yere taşımak istemesi"], correctAnswer: "B", meaning: "Savaş bittikten sonra galip devletler (özellikle ABD ve Rusya) Almanya'nın nasıl yönetileceği konusunda anlaşamadılar. Biri kapitalist, diğeri komünist sistem istediği için ülke ortadan ikiye bölündü." },
            { question: "II. Dünya Savaşı sonrasında imzalanan 1947 Paris Antlaşması ile İtalya; Rodos ve On İki Ada'nın egemenliğini aşağıdaki devletlerden hangisine bırakmıştır?", options: ["Türkiye", "İngiltere", "Yunanistan", "Bulgaristan"], correctAnswer: "C", meaning: "1947 Paris Antlaşması ile İtalya savaştan mağlup çıktığı için, Balkanlar'daki işgal ettiği yerlerden çekilmiş; Rodos ve On İki Ada'yı silahsızlandırılması şartıyla Yunanistan'a devretmiştir." },
            { question: "Aşağıdakilerden hangisi II. Dünya Savaşı'nın (1939-1945) sonuçları arasında gösterilemez?", options: ["Birleşmiş Milletler tarafından İnsan Hakları Evrensel Beyannamesi yayımlanmıştır.", "Sömürgecilik faaliyetleri zayıflamış; Hindistan, Pakistan ve Mısır gibi devletler bağımsızlıklarını kazanmıştır.", "Dünya; ABD liderliğindeki Batı ve SSCB liderliğindeki Doğu Bloğu olarak ikiye ayrılmıştır.", "Dünya barışını korumak amacıyla Milletler Cemiyeti (Cemiyet-i Akvam) kurulmuştur."], correctAnswer: "D", meaning: "Milletler Cemiyeti, II. Dünya Savaşı'ndan sonra değil, I. Dünya Savaşı'ndan sonra (1919) kurulmuştur. II. Dünya Savaşı sonrasında ise onun yerine Birleşmiş Milletler kurulmuştur. Savaşın diğer önemli sonuçları ise İnsan Hakları Evrensel Beyannamesi'nin (1948) kabul edilmesi ve ideolojik kutuplaşmanın (Soğuk Savaş) başlamasıdır." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];

        // Şıkları karıştırmak için fonksiyon
        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const progressBarEl = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const wordListEl = document.getElementById('wordList');
        const catCoverEl = document.getElementById('catCover');
        
        // Yeni DOM elementleri
        const storyContainer = document.getElementById('storyContainer');
        const storyText = document.getElementById('storyText');
        const continueBtn = document.getElementById('continueBtn');
        const statsContainer = document.getElementById('statsContainer');
        const questionWrap = document.getElementById('questionWrap');

        function initQuiz() {
            questions = [...quizData]; // Sorular artık KARIŞTIRILMAYACAK, kronolojik sırada gelecek.
            totalEl.textContent = questions.length;
            
            // İlk soruya başlamadan önce hikaye var mı kontrol et
            checkStoryAndShow();
            
            catCoverEl.addEventListener('click', () => catCoverEl.style.display = 'none');
            
            // Klavye kontrolleri
            window.addEventListener('keydown', (e) => {
                // 1-4 tuşları (Hikaye ekranı açıkken çalışmasın)
                if (e.key >= '1' && e.key <= '4') {
                    if (storyContainer.style.display === 'block') return;
                    
                    if (catCoverEl.style.display !== 'none') {
                        catCoverEl.style.display = 'none';
                        return;
                    }
                    const idx = parseInt(e.key) - 1;
                    const btns = document.querySelectorAll('.option-btn');
                    if (btns[idx] && !btns[idx].disabled) {
                        btns[idx].click();
                    }
                }
                
                // Boşluk tuşu (Hikayeyi geçmek veya Sonraki soruya geçmek için)
                if (e.code === 'Space' || e.key === ' ') {
                    if (storyContainer.style.display === 'block') {
                        continueBtn.click();
                        e.preventDefault();
                    } else if (nextBtn.style.display !== 'none') {
                        nextBtn.click();
                        e.preventDefault();
                    }
                }
            });
        }

        function checkStoryAndShow() {
            const currentQuestion = questions[currentQuestionIndex];
            
            if (currentQuestion.story) {
                // Soru kısımlarını gizle, Hikayeyi göster
                statsContainer.style.display = 'none';
                questionWrap.style.display = 'none';
                optionsEl.style.display = 'none';
                feedbackEl.style.display = 'none';
                nextBtn.style.display = 'none';
                
                storyContainer.style.display = 'block';
                storyText.innerHTML = currentQuestion.story;
            } else {
                showQuestion();
            }
        }

        // Hikayeden sonra soruya geçiş
        continueBtn.onclick = () => {
            storyContainer.style.display = 'none';
            statsContainer.style.display = 'flex';
            questionWrap.style.display = 'block';
            optionsEl.style.display = 'grid'; 
            showQuestion();
        };

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;
            const correctText = currentQuestion.options[currentQuestion.correctAnswer.charCodeAt(0) - 65];
            
            // Sadece şıklar kendi içinde karışır
            const shuffledOptions = shuffleArray(currentQuestion.options);
            optionsEl.innerHTML = '';
            optionsEl.appendChild(catCoverEl);
            catCoverEl.style.display = 'flex';
            
            shuffledOptions.forEach(optionText => {
                const button = document.createElement('button');
                button.classList.add('option-btn', 'fade-in');
                button.textContent = optionText;
                button.onclick = () => selectAnswer(optionText, correctText, currentQuestion.meaning);
                optionsEl.appendChild(button);
            });
            
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            progressEl.textContent = currentQuestionIndex + 1;
            progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        }

        function selectAnswer(selectedOption, correctOptionText, meaning) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctOptionText) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selectedOption) {
                    btn.classList.add('incorrect');
                }
            });
            const isCorrect = selectedOption === correctOptionText;
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
            }
            feedbackEl.style.display = 'block';
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            feedbackTextEl.innerHTML = isCorrect ?
                `<strong>✅ Doğru!</strong><br><br>📖 ${meaning}` :
                `<strong>❌ Hatalı!</strong><br>🔍 Doğru cevap: ${correctOptionText}<br><br>📖 ${meaning}`;
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                checkStoryAndShow(); // Sonraki soruya geçmeden önce hikaye var mı diye kontrol eder
            } else {
                endQuiz();
            }
        };

        function endQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            finalScoreEl.textContent = `📊 Puanınız: ${score} / ${questions.length}`;
            wordListEl.innerHTML = '<h3 style="margin-bottom:15px;">📚 Özet Bilgi Kartları:</h3>';
            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<strong>❓ ${q.question}</strong><br><small style="color:var(--primary);">📌 ${q.meaning}</small>`;
                wordListEl.appendChild(card);
            });
        }

        initQuiz();
    </script>
