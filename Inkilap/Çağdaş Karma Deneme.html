<head>

    <style>
        /* Orijinal CSS Kodları - Değiştirilmedi */
        :root {
            --primary: #8B4513;
            --success: #2E8B57;
            --danger: #B22222;
            --light: #F5F5DC;
            --dark: #2F4F4F;
            --accent: #D2691E;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "🏛️";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }

        .sultan-portrait {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            object-fit: cover;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sultan-portrait:hover {
            transform: scale(1.15) rotate(5deg);
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            padding-right: 80px; 
            padding-left: 60px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(139, 69, 19, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(46, 139, 87, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            text-align: left;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 600px) {
            h1 { 
                font-size: 1.4rem; 
                padding-right: 50px;
                padding-left: 40px;
            }
            .question { font-size: 1.1rem; }
            .sultan-portrait {
                width: 50px;
                height: 50px;
                top: 20px;
                right: 15px;
            }
        }
    </style>
</head>

        // ==========================================
        // 2. ADIM: SİSTEM KODLARI
        // ==========================================
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const scoreEl = document.getElementById('score');
        const progressBar = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const wordListEl = document.getElementById('wordList');
        let catCoverEl = document.getElementById('catCover');

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        const alphabet = ['A', 'B', 'C', 'D', 'E'];

        // Sınav anında taze bir ortam yaratmak için (Çıkmış Soru vb.) etiketleri gizleyen fonksiyon
        function temizle(metin) {
            return metin.replace(/\s*\([^)]*(Çıkmış Soru|çıkmış soru)[^)]*\)\s*/gi, '');
        }

        function generateQuizSet() {
            let allQuestions = [...questionBank];
            
            if (allQuestions.length === 0) return [];

            let cozulenSorular = JSON.parse(localStorage.getItem('cozulenSorularÇağdaş')) || [];
            let filteredQuestions = allQuestions.filter(q => !cozulenSorular.includes(q.question));
            
            // Eğer sistemde sorulmamış 100 sorudan az kaldıysa hafızayı sıfırla
            if (filteredQuestions.length < 100) {
                alert("Çağdaş soru bankasındaki yeni sorular tükenmek üzere! Hafıza sıfırlanıyor, çözdüğünüz sorular havuza geri ekleniyor.");
                localStorage.removeItem('cozulenSorularÇağdaş');
                cozulenSorular = [];
                filteredQuestions = allQuestions; 
            }

            // Kalan soruları karıştır
            filteredQuestions.sort(() => Math.random() - 0.5);
            
            // 100 soru çek (Test havuzun 100'den küçükse tamamını alır, 100'den büyükse 100 adet çeker)
            let selectedQuestions = filteredQuestions.slice(0, 100);
            
            // Çekilenleri çözüldü olarak hafızaya yaz
            selectedQuestions.forEach(q => {
                cozulenSorular.push(q.question);
            });
            localStorage.setItem('cozulenSorularÇağdaş', JSON.stringify(cozulenSorular));

            return selectedQuestions;
        }

        function initQuiz() {
            questions = generateQuizSet();
            if (questions.length === 0) {
                questionEl.textContent = "Soru bankasına henüz soru eklemediniz.";
                return;
            }
            totalEl.textContent = questions.length;
            showQuestion();
        }

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = temizle(currentQuestion.question);
            
            progressEl.textContent = currentQuestionIndex + 1;
            progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
            
            optionsEl.innerHTML = `
                <div class="cat-cover" id="catCover">
                    <img src="https://cataas.com/cat" alt="Random Cat" class="cat-image">
                    <div class="cat-text">Cevapları görmek için tıklayın!</div>
                </div>
            `;
            catCoverEl = document.getElementById('catCover');
            catCoverEl.addEventListener('click', () => {
                catCoverEl.style.display = 'none';
            });

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = `${alphabet[index]}) ${option}`;
                button.onclick = () => selectOption(button, index, currentQuestion);
                optionsEl.appendChild(button);
            });
            
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
        }

        function selectOption(button, selectedIndex, currentQuestion) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true); 
            
            if (selectedIndex === currentQuestion.correctAnswer) {
                button.classList.add('correct');
                score += 1;
                scoreEl.textContent = score;
                feedbackEl.className = 'feedback correct-feedback';
                feedbackText.innerHTML = `<strong>✅ Doğru!</strong><br>${currentQuestion.meaning}`;
            } else {
                button.classList.add('incorrect');
                const correctIndex = currentQuestion.correctAnswer;
                if (buttons[correctIndex]) {
                    buttons[correctIndex].classList.add('correct');
                }
                const correctLetter = alphabet[correctIndex];
                feedbackEl.className = 'feedback incorrect-feedback';
                feedbackText.innerHTML = `<strong>❌ Yanlış! Doğru Cevap: ${correctLetter}</strong><br>${currentQuestion.meaning}`;
            }
            
            feedbackEl.style.display = 'block';
            nextBtn.style.display = 'block';
            
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.textContent = 'Sonuçları Gör';
            } else {
                nextBtn.textContent = 'Sonraki Soru';
            }
        }

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            progressBar.style.width = '100%';
            
            finalScoreEl.textContent = `${score} / ${questions.length}`;
            
            wordListEl.innerHTML = '<h3 style="margin-bottom:15px;">Genel Tekrar:</h3>';
            questions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<strong>Soru ${i+1}: ${temizle(q.question)}</strong><br><small style="color:var(--primary)">${q.meaning}</small>`;
                wordListEl.appendChild(card);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (quizContainer.style.display === 'none') return;
            
            if ((e.key === 'Enter' || e.code === 'Space') && nextBtn.style.display === 'block') {
                if (e.code === 'Space') e.preventDefault();
                nextBtn.click();
                return;
            }
            
            if (catCoverEl && catCoverEl.style.display !== 'none') {
                if (['1', '2', '3', '4', '5'].includes(e.key)) {
                    catCoverEl.style.display = 'none';
                }
                return; 
            }
            
            const buttons = document.querySelectorAll('.option-btn');
            if (buttons.length === 0 || buttons[0].disabled) return;
            
            if (e.key === '1' && buttons[0]) buttons[0].click();
            if (e.key === '2' && buttons[1]) buttons[1].click();
            if (e.key === '3' && buttons[2]) buttons[2].click();
            if (e.key === '4' && buttons[3]) buttons[3].click();
            if (e.key === '5' && buttons[4]) buttons[4].click();
        });

        initQuiz();
    </script>
</body>
</html>
