<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Atatürk Dönemi Dış Politika</title>
    <style>
        :root {
            --primary: #8B4513;
            --success: #2E8B57;
            --danger: #B22222;
            --light: #F5F5DC;
            --dark: #2F4F4F;
            --accent: #D2691E;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "🏛️";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(139, 69, 19, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(46, 139, 87, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            text-align: left;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .question { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏛️ Atatürk Dönemi Dış Politika</h1>
            <div class="subtitle">İç Politika, Dış Politika ve Çağdaş Türk Tarihi</div>
        </header>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="quiz-container" id="quizContainer">
            <div class="stats">
                <div class="score">Puan: <span id="score">0</span></div>
                <div>Soru: <span id="progress">0</span>/<span id="total">0</span></div>
            </div>
            
            <div class="question-container">
                <div class="question" id="question"></div>
            </div>
            
            <div class="options" id="options">
                <div class="cat-cover" id="catCover">
                    <img src="https://cataas.com/cat" alt="Random Cat" class="cat-image">
                    <div class="cat-text">Cevaplar için 1-4 arası tuşlayın veya tıklayın!</div>
                </div>
            </div>
            
            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
            </div>
            
            <button class="next-btn" id="nextBtn" style="display: none;">Sonraki Soru (Enter)</button>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <h2 class="results-title">🏆 Test Tamamlandı!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="word-list" id="wordList"></div>
            <button class="next-btn" onclick="location.reload()" style="margin-top: 30px;">Tekrar Oyna</button>
        </div>
    </div>

    <script>

            { correctAnswer: "A", meaning: "Cumhuriyet Halk Partisi (CHP), köklerini Milli Mücadele'yi yürüten Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti'ne dayandırır. Bu cemiyetin kurulduğu Sivas Kongresi (4-11 Eylül 1919), CHP'nin 1. Olağan Kurultayı olarak kabul edilir.", question: "Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti'nin kurulduğu ve bu sebeple Cumhuriyet Halk Partisi'nin (CHP) ilk kurultayı olarak kabul edilen gelişme aşağıdakilerden hangisidir?", options: ["Sivas Kongresi", "Erzurum Kongresi", "Amasya Genelgesi", "Havza Genelgesi"] },

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const progressBarEl = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const wordListEl = document.getElementById('wordList');
        const catCoverEl = document.getElementById('catCover');

        function initQuiz() {
            questions = shuffleArray(quizData);
            totalEl.textContent = questions.length;
            showQuestion();
            catCoverEl.addEventListener('click', () => catCoverEl.style.display = 'none');
        }

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;
            
            const correctText = currentQuestion.options[currentQuestion.correctAnswer.charCodeAt(0) - 65];
            const shuffledOptions = shuffleArray(currentQuestion.options);
            
            optionsEl.innerHTML = '';
            optionsEl.appendChild(catCoverEl);
            catCoverEl.style.display = 'flex';

            shuffledOptions.forEach((optionText, idx) => {
                const button = document.createElement('button');
                button.classList.add('option-btn', 'fade-in');
                button.innerHTML = `<span style="color:var(--accent); font-weight:bold;">${idx + 1}.</span> ${optionText}`;
                button.onclick = () => selectAnswer(optionText, correctText, currentQuestion.meaning);
                optionsEl.appendChild(button);
            });
            
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            progressEl.textContent = currentQuestionIndex + 1;
            progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        }

        function selectAnswer(selectedOption, correctOptionText, meaning) {
            if (nextBtn.style.display === 'block') return; // Zaten cevaplanmışsa dur

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                const btnText = btn.textContent.split('. ')[1];
                if (btnText === correctOptionText) {
                    btn.classList.add('correct');
                } else if (btnText === selectedOption) {
                    btn.classList.add('incorrect');
                }
            });

            const isCorrect = selectedOption === correctOptionText;
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
            }

            feedbackEl.style.display = 'block';
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            feedbackTextEl.innerHTML = isCorrect ? 
                `<strong>✅ Doğru!</strong><br><br>${meaning}` : 
                `<strong>❌ Yanlış!</strong><br>Doğru Cevap: ${correctOptionText}<br><br>${meaning}`;
            
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        };

        function endQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            finalScoreEl.textContent = `Puanınız: ${score} / ${questions.length}`;
            
            wordListEl.innerHTML = '<h3 style="margin-bottom:15px;">Genel Tekrar:</h3>';
            quizData.forEach(q => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<strong>${q.question}</strong><br><small style="color:var(--primary)">${q.meaning}</small>`;
                wordListEl.appendChild(card);
            });
        }

        // --- KLAVYE KISAYOLLARI ---
        document.addEventListener('keydown', (e) => {
            if (quizContainer.style.display === 'none') return;

            // Enter veya Boşluk ile sonraki soruya geç
            if ((e.key === 'Enter' || e.code === 'Space') && nextBtn.style.display === 'block') {
                if (e.code === 'Space') e.preventDefault(); 
                nextBtn.click();
                return;
            }

            // Kapak varsa tuşla kaldır
            if (catCoverEl.style.display !== 'none') {
                if (['1', '2', '3', '4', 'Enter', ' '].includes(e.key)) {
                    catCoverEl.style.display = 'none';
                }
                return; 
            }

            // Rakamlarla şık seçimi
            const buttons = document.querySelectorAll('.option-btn');
            if (buttons.length === 0 || buttons[0].disabled) return;

            if (e.key === '1' && buttons[0]) buttons[0].click();
            if (e.key === '2' && buttons[1]) buttons[1].click();
            if (e.key === '3' && buttons[2]) buttons[2].click();
            if (e.key === '4' && buttons[3]) buttons[3].click();
        });

        initQuiz();
    </script>
</body>
