<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 İki Küresel Savaş Arasında Türkiye</title>
    <style>
        :root {
            --primary: #0b3b5f;
            --success: #2E8B57;
            --danger: #B22222;
            --light: #e6f0fa;
            --dark: #1e3a5f;
            --accent: #1e6f9f;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0b3b5f 0%, #1e6f9f 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "📚";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 59, 95, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(46, 139, 87, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            text-align: left;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .question { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌊 İki Küresel Savaş Arasında Türkiye</h1>
            <div class="subtitle">Genel Tekrar - Deneme Sınavı</div>
        </header>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="quiz-container" id="quizContainer">
            <div class="stats">
                <div class="score">📊 Puan: <span id="score">0</span></div>
                <div>📌 Soru: <span id="progress">0</span>/<span id="total">0</span></div>
            </div>
            
            <div class="question-container">
                <div class="question" id="question"></div>
            </div>
            
            <div class="options" id="options">
                <div class="cat-cover" id="catCover">
                    <img src="https://cataas.com/cat" alt="Random Cat" class="cat-image">
                    <div class="cat-text">🐾 Şıkları görmek için bir sayıya (1-4) basın veya tıklayın!</div>
                </div>
            </div>
            
            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
            </div>
            
            <button class="next-btn" id="nextBtn" style="display: none;">➡️ Sonraki Soru (Boşluk)</button>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <h2 class="results-title">🏆 Konu Tamamlandı!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="word-list" id="wordList"></div>
            <button class="next-btn" onclick="location.reload()">🔄 Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "ABD'nin 1823'te ilan ettiği \"Yalnızlık Politikası\" (Monroe Doktrini) ilk kez hangi olayla kesintiye uğramıştır?", options: ["Fransız İhtilali", "I. Dünya Savaşı", "1929 Ekonomik Buhranı", "Soğuk Savaş"], correctAnswer: "B", meaning: "ABD, I. Dünya Savaşı'na girerek 1823'ten beri sürdürdüğü Monroe Doktrini'ni (Yalnızlık Politikası) ilk kez fiilen terk etmiştir." },
            { question: "ABD'nin I. Dünya Savaşı'ndan sonra tekrar Yalnızlık Politikası'na döndüğünün en net göstergesi hangisidir?", options: ["Milletler Cemiyeti'ne üye olmaması", "Wilson İlkeleri'ni yayınlaması", "İtilaf Devletleri'ne katılması", "Avrupa'ya ambargo uygulaması"], correctAnswer: "A", meaning: "Başkan Wilson'un fikir babası olduğu Milletler Cemiyeti kurulmasına rağmen ABD Senatosu üyeliği reddetmiş ve ABD tekrar yalnızlık (izolasyonizm) politikasına dönmüştür." },
            { question: "Aşağıdakilerden hangisi ABD'nin uyguladığı \"Yalnızlık Politikası\"nın bir diğer ismi değildir?", options: ["İnfirat", "Tecrit", "İzolasyonizm", "Yayılmacılık"], correctAnswer: "D", meaning: "İnfirat, tecrit ve izolasyonizm yalnızlık politikasının eş anlamlılarıdır. Yayılmacılık ise emperyalizm veya yayılma hedefini ifade eder, yalnızlık politikasının tam zıttıdır." },
            { question: "Çanakkale Savaşı'nda İtilaf Devletleri'nin yenilmesiyle yardım alamayan Rusya'da, \"Barış, ekmek ve toprak\" vaadiyle Ekim Devrimi'ni gerçekleştirip başa geçen lider kimdir?", options: ["Çar II. Nikola", "Aleksandr Kerenski", "Vladimir Lenin", "Josef Stalin"], correctAnswer: "C", meaning: "1917'de Bolşevikler, Vladimir Lenin önderliğinde 'Barış, ekmek ve toprak' vaadiyle Çarlık rejimini (ve geçici hükümeti) devirerek iktidara gelmiştir." },
            { question: "Lenin'in Rusya'da iç savaş sonrası bozulan ekonomiyi düzeltmek amacıyla ilan ettiği yeni ekonomi politikasının (Novaya Ekonomicheskaya Politika) kısa adı nedir?", options: ["NEP", "Çeka", "Kolhoz", "Duma"], correctAnswer: "A", meaning: "Lenin, Savaş Komünizmi politikasının yarattığı ekonomik yıkımı gidermek için 1921'de Yeni Ekonomi Politikası'nı (NEP) uygulamaya koymuştur." },
            { question: "NEP dönemi uygulamalarında, küçük ticari işletmelerin işletilmesinin bırakıldığı sınıf/kişilere ne ad verilmiştir?", options: ["Menşevik", "Proletarya", "Nepman", "Bolşevik"], correctAnswer: "C", meaning: "NEP döneminde ticaretle uğraşan, küçük işletmeleri işleten özel girişimci sınıfına 'Nepman' adı verilmiştir." },
            { question: "Aşağıdakilerden hangisi Lenin döneminde uygulanan NEP'in (Yeni Ekonomi Politikası) özelliklerinden biri değildir?", options: ["Tarım ürünlerine zorla el konulması uygulamasından vazgeçilmesi", "Para sisteminde piyasa ekonomisi kurallarına geri dönülmesi", "Büyük işletmelerin tamamen özel sektöre (kapitalistlere) satılması", "Özel mülkiyet hakkına dokunulmaması"], correctAnswer: "C", meaning: "NEP döneminde küçük işletmelere ve ticarete izin verilmiş olsa da, ağır sanayi, bankacılık ve dış ticaret gibi büyük ve stratejik sektörler devletin elinde kalmaya devam etmiştir." },
            { question: "19. yüzyılda Kafkasya'da Rus işgaline karşı dini ve milli bir motivasyonla başlatılan direniş ve bağımsızlık mücadelesine verilen genel ad aşağıdakilerden hangisidir?", options: ["Basmacı Hareketi", "Müridizm (Gazavat)", "Pan-Slavizm", "Bolşevik Devrimi"], correctAnswer: "B", meaning: "Kafkasya'da Müslüman halkın Rus yayılmacılığına karşı İslami ve milli motiflerle başlattığı bağımsızlık savaşına Müridizm veya Gazavat denir." },
            { question: "Kafkasya'daki Müridizm hareketinin en önemli temsilcisi olan ve direnişi yıllarca başarıyla yönettiği için \"Kafkas Kartalı\" unvanıyla anılan lider aşağıdakilerden hangisidir?", options: ["Şeyh Şamil", "Hacı Murat", "Şeyh Mansur", "Enver Paşa"], correctAnswer: "A", meaning: "Şeyh Şamil, Dağıstan ve Çeçenistan'da Müridizm hareketinin liderliğini yaparak Ruslara karşı 25 yıl efsanevi bir direniş göstermiş ve 'Kafkas Kartalı' olarak anılmıştır." },
            { question: "1918 yılında Rusların Milli Hakan Hükümeti'ni dağıtması üzerine Hokand şehrinde başlayan ve Türkistan'a bağımsızlık kazandırmayı amaçlayan direniş hareketinin adı nedir?", options: ["Müridizm", "Basmacı Hareketi", "Kuva-yi Milliye", "Bolşevik İhtilali"], correctAnswer: "B", meaning: "Türkistan'ı Rus işgalinden kurtarmak için Hokand'da başlayan ve 'Baskıncı' anlamına gelen Basmacı Hareketi, Türkistan'ın bağımsızlığı için yıllarca mücadele etmiştir." },
            { question: "İlk liderliğini Korbaşı Ergaş'ın yaptığı Basmacı Hareketi'ne katılarak direnişe büyük güç kazandıran, ancak 1922'de girdiği bir çarpışmada şehit düşen ünlü komutan kimdir?", options: ["Enver Paşa", "Talat Paşa", "Şeyh Şamil", "Hacı Murat"], correctAnswer: "A", meaning: "I. Dünya Savaşı sonrası Türkistan'a geçen İttihat ve Terakki liderlerinden Enver Paşa, Basmacı Hareketi'ne katılarak direnişi canlandırmış, 1922'de Tacikistan'da Ruslarla girdiği çatışmada şehit olmuştur." },
            { question: "Aşağıdakilerden hangisi 1931 yılına kadar süren Basmacı Hareketi'nin önde gelen liderlerinden (korbaşılarından) biri değildir?", options: ["Korbaşı Ergaş", "Korbaşı Parpı", "Şir Muhammed Bey", "Aleksandr Kerenski"], correctAnswer: "D", meaning: "Diğer şıklar ve Sultan Galiyev ile Mehmet Emin Bey direnişin lider kadrosundandır. Aleksandr Kerenski ise Rusya'da Geçici Hükümet'in lideridir." },
            { question: "1918 yılında Enver Paşa'nın talimatıyla kurulan; Azerbaycan ve Dağıstan'ı Bolşevik ve Ermeni (Taşnak) çetelerinin işgalinden kurtarmakla görevlendirilen Kafkas İslam Ordusu'nun komutanı kimdir?", options: ["Kazım Karabekir Paşa", "Halil Kut Paşa", "Nuri Killigil Paşa", "Fahreddin Paşa"], correctAnswer: "C", meaning: "Enver Paşa'nın kardeşi olan Nuri (Killigil) Paşa, Kafkas İslam Ordusu komutanı olarak Bakü'yü Ermeni ve Bolşevik işgalinden kurtaran kahramandır." },
            { question: "Türk dünyasının aydınlanmasında büyük rol oynayan, çıkardığı \"Tercüman\" gazetesiyle tanınan ve tüm Türkler için \"Dilde, fikirde, işte birlik\" idealini savunan önemli fikir adamı kimdir?", options: ["Ziya Gökalp", "Yusuf Akçura", "İsmail Gaspıralı", "Zeki Velidi Togan"], correctAnswer: "C", meaning: "Kırımlı bir Türk aydını olan İsmail Gaspıralı, Tercüman gazetesi aracılığıyla Türk dünyasında ortak bir edebi dil ve eğitim birliği oluşturmayı hedeflemiştir." },
            { question: "1917 yılında Romanov Hanedanı'nı deviren ve Rusya'da Bolşevik İhtilali'ni başarıya ulaştıran lider aşağıdakilerden hangisidir?", options: ["Josef Stalin", "Vladimir Lenin", "Leon Troçki", "Aleksandr Kerenski"], correctAnswer: "B", meaning: "1917 Ekim Devrimi ile Rusya'da 300 yıllık Romanov Hanedanı (Çarlık rejimi) tamamen yıkılmış ve Lenin önderliğinde Sovyet yönetimi kurulmuştur." },
            { question: "Sovyetler Birliği'nde tarımda zorunlu \"kolektifleştirme\" politikasını uygulayan ve \"Beş Yıllık Kalkınma Planları\" ile ülke ekonomisini yöneten lider kimdir?", options: ["Josef Stalin", "Vladimir Lenin", "Nikita Kruşçev", "Çar II. Nikola"], correctAnswer: "A", meaning: "Lenin'in ölümünden sonra başa geçen Stalin, NEP'i iptal ederek tarımda zorunlu kolektifleştirme (kolhozlar) ve sanayide katı devlet planlaması (Beş Yıllık Planlar) uygulamıştır." },
            { question: "19. yüzyılda Kafkasya'da Rus işgaline karşı yürütülen direnişin en önemli sembollerinden biri olan ve gösterdiği üstün kahramanlıklardan dolayı tarihe \"Kafkas Kartalı\" unvanıyla geçen efsanevi lider aşağıdakilerden hangisidir?", options: ["Şeyh Mansur", "Hacı Murat", "Şeyh Şamil", "Korbaşı Ergaş"], correctAnswer: "C", meaning: "Şeyh Şamil, Müridizm hareketinin üçüncü imamı olarak Kafkasya'daki Rus ilerleyişini çeyrek asır durdurmayı başarmış efsanevi bir liderdir." },
            { question: "Türk milliyetçiliğinin temel metinlerinden biri kabul edilen; Osmanlıcılık, İslamcılık ve Türkçülük fikir akımlarını karşılaştırmalı olarak inceleyip değerlendiren \"Üç Tarz-ı Siyaset\" adlı önemli eser aşağıdakilerden hangisine aittir?", options: ["Ziya Gökalp", "İsmail Gaspıralı", "Yusuf Akçura", "Namık Kemal"], correctAnswer: "C", meaning: "Yusuf Akçura'nın Kahire'de 'Türk' gazetesinde yayımlanan bu makalesi, Türkçülük fikrini sistematik olarak savunan ilk siyasi manifesto kabul edilir." },
            { question: "II. Dünya Savaşı yılları boyunca Japonya'nın başında bulunan ve 1945 yılında ABD'nin attığı atom bombalarının ardından müttefik devletlere kayıtsız şartsız teslim olmayı kabul eden Japon İmparatoru aşağıdakilerden hangisidir?", options: ["İmparator Meiji", "İmparator Hirohito", "Hyakkimaru", "Murasaki Melih"], correctAnswer: "B", meaning: "Hirohito, II. Dünya Savaşı boyunca Japonya'yı yönetmiş, atom bombalarının ardından radyodan halka seslenerek teslim olma kararını bizzat açıklamıştır." },
            { question: "Nazi Almanyası'nın dış politikasının temelini oluşturan; Alman milletinin ihtiyaç duyduğu toprakların özellikle Doğu Avrupa ve Rusya'ya doğru genişleyerek elde edilmesini amaçlayan jeopolitik kavrama ne ad verilir?", options: ["Hayat Sahası (Lebensraum)", "Yatıştırma Politikası", "İzolasyonizm", "Demir Perde"], correctAnswer: "A", meaning: "Adolf Hitler tarafından savunulan bu doktrin, \"üstün ırk\" olarak gördüğü Alman milletinin ekonomik ve siyasi olarak güçlenebilmesi için daha geniş topraklara yayılması gerektiğini iddia etmiştir. Bu politika, II. Dünya Savaşı'nın en temel nedenlerinden biri olan Alman yayılmacılığının teorik zeminini oluşturmuştur." },
            { question: "İtalya'da iktidara gelen Benito Mussolini'nin, Roma İmparatorluğu'nu yeniden canlandırma hayaliyle Akdeniz'i bir \"İtalyan Gölü\" haline getirmeyi hedefleyen dış politika doktrinine ne ad verilir?", options: ["Hayat Sahası (Lebensraum)", "Bizim Deniz (Mare Nostrum)", "Asya Asyalılarındır", "İzolasyonizm"], correctAnswer: "B", meaning: "İtalya'nın Akdeniz havzasında eski Roma İmparatorluğu'nun gücüne ulaşmasını hedefleyen, yayılmacı ve saldırgan bir dış politika stratejisidir." },
            { question: "İtalya'da Faşist lider Benito Mussolini'nin, Roma İmparatorluğu'nu canlandırma hedefiyle Akdeniz'i bir \"İtalyan Gölü\" haline getirmeyi amaçlayan ve \"Bizim Deniz\" anlamına gelen dış politika ilkesi aşağıdakilerden hangisidir?", options: ["İzolasyonizm", "Mare Nostrum (Bizim Deniz)", "Hayat Sahası (Lebensraum)", "Yatıştırma Politikası"], correctAnswer: "B", meaning: "Mussolini'nin Akdeniz'i İtalyan gölü yapma hedefi doğrultusunda ortaya attığı bu politika, Türkiye'yi de tehdit etmiş ve bölgesel paktların (Balkan/Sadabat) kurulmasını hızlandırmıştır." },
            { question: "1929 Dünya Ekonomik Buhranı'nın ardından dış ticareti canlandırmak için uygulanan, iki ülke arasındaki mal değişiminin nakit para yerine karşılıklı mahsuplaşma esasına dayandığı ticaret sistemine ne ad verilir?", options: ["Merkantilizm", "Kliring", "Liberalizm", "Sosyalizm"], correctAnswer: "B", meaning: "Kliring sistemi, döviz sıkıntısı çeken ülkelerin \"malımı alanın malını alırım\" prensibiyle ticaret yapmasını sağlayan bir yöntemdir. Türkiye, 1929 krizinden sonra dış ticaretini korumak için bu sistemi yoğun olarak kullanmıştır." },
            { question: "1929 Dünya Ekonomik Buhranı'nın etkilerini azaltmak ve temel tüketim maddelerini yurt içinde üretmek amacıyla Türkiye'de 1933 yılında hazırlanan ekonomik hamle aşağıdakilerden hangisidir?", options: ["Teşvik-i Sanayi Kanunu", "I. Beş Yıllık Sanayi Planı", "İzmir İktisat Kongresi", "Devlet Planlama Teşkilatı'nın Kurulması"], correctAnswer: "B", meaning: "1929 Ekonomik Buhranı'nın etkisiyle Türkiye, liberal ekonomiden Devletçi modele geçmiş ve 1933'te hazırlanan (1934'te uygulanan) I. Beş Yıllık Sanayi Planı ile temel sanayi tesislerini kurmuştur." },
            { question: "1929 yılında halkı israftan kaçınmaya, tasarrufa alıştırmaya ve yerli malı kullanımını teşvik etmeye yönelik milli bir bilinç oluşturmak amacıyla kurulan cemiyet hangisidir?", options: ["Milli İktisat ve Tasarruf Cemiyeti", "Türk Dil Kurumu", "Himaye-i Etfal Cemiyeti", "Halkevleri"], correctAnswer: "A", meaning: "Milli İktisat ve Tasarruf Cemiyeti, özellikle yerli malı haftası gibi etkinliklerle toplumda ekonomik bir direnç oluşturmayı amaçlamıştır. Bu dönemde \"Devletçilik\" ilkesi, 1929 krizinin zorunlu kıldığı bir model olarak Türkiye'de güç kazanmıştır." },
            { question: "1929 Dünya Ekonomik Buhranı'nın ardından Türk parasının değerini korumak ve piyasadaki döviz hareketlerini kontrol altına almak amacıyla 1930 yılında çıkarılan kanun hangisidir?", options: ["Takrir-i Sükun Kanunu", "Türk Parasını Koruma Kanunu", "Teşvik-i Sanayi Kanunu", "Kabotaj Kanunu"], correctAnswer: "B", meaning: "1929 krizinden sonra döviz kurlarındaki dalgalanmaları önlemek ve Türk lirasının değerini yabancı paralar karşısında sabit tutmak amacıyla çıkarılmıştır." },
            { question: "Türkiye'nin kendi para politikasını belirlemesi, banknot ihracını gerçekleştirmesi ve Türk lirasının değerini istikrarlı tutması amacıyla 1930 yılında kurulan kurum hangisidir?", options: ["Ziraat Bankası", "Sümerbank", "Türkiye Cumhuriyet Merkez Bankası", "Etibank"], correctAnswer: "C", meaning: "Merkez Bankası, Türk parasının değerini istikrarlı tutmak ve daha önce Osmanlı Bankası'nda olan banknot basma (emisyon) imtiyazını milli bir kuruma devretmek için 1930'da kurulmuştur." },
            { question: "1929 krizinin etkileriyle borç ödemekte zorlanan ülkelere kolaylık sağlamak amacıyla yayımlanan ve Türkiye'nin de dış borç (Osmanlı'dan kalan borçlar) taksitlerini ertelemesine imkan tanıyan uluslararası belge hangisidir?", options: ["Hoover Moratoryumu", "Balfour Deklarasyonu", "Monroe Doktrini", "Briand-Kellogg Paktı"], correctAnswer: "A", meaning: "ABD Başkanı Herbert Hoover tarafından ilan edilen bu moratoryum (borç erteleme), dünya savaş borçlarının ve tazminatlarının ödenmesini bir yıl askıya alarak krizdeki ülkelere (ve Türkiye'ye) nefes aldırmıştır." },
            { question: "1934 yılında üye olduğu Milletler Cemiyeti'nden (Cemiyet-i Akvam) 1939 yılında çıkarılan (kovulan) tek devlet olan Sovyet Rusya'nın (SSCB), cemiyetten ihraç edilmesinin temel nedeni aşağıdakilerden hangisidir?", options: ["Polonya'nın doğusunu işgal etmesi", "Finlandiya'ya saldırması (Kış Savaşı)", "Almanya ile Saldırmazlık Paktı imzalaması", "Baltık ülkelerini (Estonya, Letonya, Litvanya) ilhak etmesi"], correctAnswer: "B", meaning: "Milletler Cemiyeti, kuruluş amacı olan \"uluslararası barışı koruma\" ilkesine aykırı hareket ettiği gerekçesiyle SSCB'yi üyelikten çıkaran tek büyük devlettir. Bu durum, 1939'da Rusya'nın Finlandiya'yı işgal girişimi (Kış Savaşı) üzerine gerçekleşmiştir. Ancak bu ihraç kararı, cemiyetin II. Dünya Savaşı'nı önlemedeki başarısızlığını değiştirememiştir." },
            { question: "1934 yılında üye olduğu Milletler Cemiyeti'nden (Cemiyet-i Akvam) 1939 yılında ihraç edilen (kovulan) devlet aşağıdakilerden hangisidir?", options: ["Almanya", "Japonya", "SSCB", "İtalya"], correctAnswer: "C", meaning: "Milletler Cemiyeti, SSCB'nin Finlandiya işgali üzerine bu devleti uluslararası barışı bozduğu gerekçesiyle ihraç etmiştir." },
            { question: "1920-1921 yıllarında Orta ve Doğu Avrupa'da Macaristan'ın yayılmacı politikalarına karşı kurulan ve \"Küçük Antant\" (Little Entente) olarak bilinen ittifak içerisinde aşağıdaki devletlerden hangisi yer almaz?", options: ["Çekoslovakya", "Yugoslavya", "Romanya", "Türkiye"], correctAnswer: "D", meaning: "Küçük Antant; Çekoslovakya, Romanya ve Yugoslavya arasında kurulmuştur. Fransa tarafından desteklenen bu oluşumun temel amacı, I. Dünya Savaşı sonrası oluşan statükoyu korumak ve Macar yayılmacılığını engellemektir. Türkiye bu ittifakın bir üyesi değildir." },
            { question: "Çekoslovakya, Yugoslavya ve Romanya arasında, Macaristan’ın yayılmacı politikalarına karşı kurulan ittifak aşağıdakilerden hangisidir?", options: ["Balkan Antantı", "Sadabat Paktı", "Küçük Antant", "Locarno Paktı"], correctAnswer: "C", meaning: "Çekoslovakya, Romanya ve Yugoslavya arasında, Macar yayılmacılığına ve I. Dünya Savaşı sonrası sınırların değişme ihtimaline (revizyonizme) karşı kurulmuştur." },
            { question: "Aşağıdaki devletlerden hangisi Küçük Antant ittifakı içerisinde yer almaz?", options: ["Çekoslovakya", "Yugoslavya", "Romanya", "Bulgaristan"], correctAnswer: "D", meaning: "Bulgaristan, I. Dünya Savaşı'ndan yenik ayrılan ve sınırlarını genişletmek isteyen revizyonist bir devlettir; bu nedenle antantta yer almaz." },
            { question: "I. Dünya Savaşı’ndan sonra gerginleşen ilişkileri yumuşatmak amacıyla 1925 yılında imzalanan; Almanya’nın uluslararası iş birliğine tekrar dönmesini sağlayan ve Avrupa'da kısa bir barış dönemi başlatan pakt aşağıdakilerden hangisidir?", options: ["Briand-Kellogg Paktı", "Küçük Antant", "Locarno Paktı", "Sadabat Paktı"], correctAnswer: "C", meaning: "Locarno Paktı ile Almanya, Batı sınırlarının kesinliğini kabul etmiş ve 1926 yılında Milletler Cemiyeti’ne üye olmuştur. Bu dönem tarih literatüründe \"Locarno Ruhu\" (barış dönemi) olarak adlandırılır." },
            { question: "1928 yılında ABD ve Fransa dışişleri bakanlarının öncülüğünde hazırlanan; \"savunmaya dayanmayan savaşın bir dış politika aracı olarak kullanılmasını\" yasaklayan ve devletler arasındaki sorunların barışçı yollarla çözülmesini öngören uluslararası pakt aşağıdakilerden hangisidir?", options: ["Locarno Paktı", "Küçük Antant", "Briand-Kellogg Paktı", "Sadabat Paktı"], correctAnswer: "C", meaning: "Türkiye, \"Yurtta Sulh, Cihanda Sulh\" ilkesi doğrultusunda dünya barışına katkı sağlamak amacıyla bu pakta 1929 yılında dahil olmuştur." },
            { question: "SSCB'nin öncülüğünde hazırlanan; Briand-Kellogg Paktı'nın esaslarını Doğu Avrupa'da ve Rusya'nın komşuları arasında geçerli kılmayı amaçlayan, Türkiye'nin de 1929 yılında dahil olduğu protokol aşağıdakilerden hangisidir?", options: ["Locarno Paktı", "Litvinov Protokolü", "Küçük Antant", "Mare Nostrum"], correctAnswer: "B", meaning: "Litvinov Protokolü, Briand-Kellogg Paktı'nın Doğu Avrupa versiyonu olarak görülebilir. Türkiye, bölgesel ve dünya barışına katkı sağlamak amacıyla hem Briand-Kellogg Paktı'na hem de Litvinov Protokolü'ne katılmıştır." },
            { question: "Türkiye, \"Yurtta Sulh, Cihanda Sulh\" ilkesi doğrultusunda dünya barışına katkı sağlamak amacıyla aşağıdaki uluslararası pakt/protokol çiftlerinden hangilerine üye olmuştur?", options: ["Briand-Kellogg Paktı - Litvinov (Latino) Protokolü", "Locarno Paktı - Küçük Antant", "Locarno Paktı - Litvinov (Latino) Protokolü", "Küçük Antant - Briand-Kellogg Paktı"], correctAnswer: "A", meaning: "Türkiye, Atatürk döneminde 'Yurtta Sulh Cihanda Sulh' politikası gereği Briand-Kellogg Paktı'na ve bunun Doğu Avrupa'daki uzantısı olan Litvinov Protokolü'ne katılmıştır." },
            { question: "I. Dünya Savaşı'nın ardından ortaya çıkan yeni statükoyu ve sınırları korumak amacıyla savaş sonrasında kurulan ilk bölgesel ittifak (organizasyon) aşağıdakilerden hangisidir?", options: ["Balkan Antantı", "Sadabat Paktı", "Küçük Antant", "Locarno Paktı"], correctAnswer: "C", meaning: "I. Dünya Savaşı'ndan sonra barışı korumak adına kurulan ilk küresel organizasyon Milletler Cemiyeti iken; kurulan ilk bölgesel ittifak (organizasyon) 1920-1921 yıllarında şekillenen Küçük Antant'tır." },
            { question: "II. Dünya Savaşı sonrasında kurulan uluslararası ve bölgesel örgütler dikkate alındığında, Türkiye aşağıdakilerden hangisine üye değildir?", options: ["Birleşmiş Milletler", "Avrupa Konseyi", "NATO", "Varşova Paktı"], correctAnswer: "D", meaning: "* Birleşmiş Milletler (1945): Türkiye kurucu üyelerindendir. \nAvrupa Konseyi (1949): Türkiye kurucu üyelerindendir. \nNATO (1952): Türkiye, Kore Savaşı'na asker gönderdikten sonra üye kabul edilmiştir. \nVarşova Paktı (1955): Sovyetler Birliği önderliğinde kurulan Doğu Bloku'nun askeri ittifakıdır. Batı Bloku'nda ve NATO üyesi olan Türkiye, bu pakta üye olmamıştır." },
            { question: "Türkiye Cumhuriyeti, aşağıdaki uluslararası kuruluşlardan hangisine Atatürk Dönemi'nde (1923-1938) üye olmuştur?", options: ["Birleşmiş Milletler", "Avrupa Konseyi", "NATO", "Milletler Cemiyeti"], correctAnswer: "D", meaning: "Milletler Cemiyeti: 1932 yılında (Atatürk Dönemi) üye olundu.\nBirleşmiş Milletler: 1945 yılında (İsmet İnönü Dönemi) üye olundu.\nAvrupa Konseyi: 1949 yılında (İsmet İnönü Dönemi) üye olundu.\nNATO: 1952 yılında (Adnan Menderes - DP Dönemi) üye olundu." },
            { question: "Türkiye'nin dış politikadaki faaliyetleri dikkate alındığında, aşağıdakilerden hangisi Atatürk Dönemi'nde (1923-1938) gerçekleşen gelişmelerden biri değildir?", options: ["Milletler Cemiyeti’ne üye olunması", "Briand-Kellogg Paktı’na katılım", "Litvinov Protokolü’nün imzalanması", "Avrupa Konseyi’ne üye olunması"], correctAnswer: "D", meaning: "Flaş Kart Notu: \nAtatürk Dönemi: Milletler Cemiyeti (1932), Briand-Kellogg (1929), Litvinov (1929). \nAtatürk Dönemi Sonrası: Avrupa Konseyi (1949 - İsmet İnönü Dönemi)." },
            { question: "Aşağıdaki uluslararası kuruluşlardan hangisi Atatürk Dönemi dış politika gelişmeleri arasında yer almaz?", options: ["Milletler Cemiyeti", "Balkan Antantı", "NATO", "Sadabat Paktı"], correctAnswer: "C", meaning: "Türkiye, NATO'ya 1952 yılında (Demokrat Parti dönemi), Kore Savaşı'ndaki başarısının ardından Sovyet tehdidine karşı Batı bloğunda yer almak için üye olmuştur." },
            { question: "I. Birleşmiş Milletler \nII. Avrupa Konseyi \nIII. Varşova Paktı \n\nYukarıdaki oluşumlardan hangileri Atatürk Dönemi (1923-1938) sonrasında ortaya çıkmış veya Türkiye bu dönemden sonra dahil olmuştur?", options: ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], correctAnswer: "D", meaning: "BM 1945, Avrupa Konseyi 1949, Varşova Paktı 1955 yılında kurulmuştur; üçü de Atatürk dönemi (1923-1938) sonrasındaki gelişmelerdir." },
            { question: "1917'de Filistin'de bir Yahudi devleti kurulmasını destekleyen İngiliz belgesi hangisidir?", options: ["Locarno Paktı", "Balfour Deklarasyonu", "Monroe Doktrini", "Marshall Planı"], correctAnswer: "B", meaning: "İngiltere Dışişleri Bakanı Arthur Balfour tarafından yayımlanan deklarasyon, Filistin topraklarında bir Yahudi yurdu kurulmasına İngiliz desteğini açıklamış ve İsrail'in kuruluşuna zemin hazırlamıştır." },
            { question: "1928 yılında penisilini keşfederek tıp dünyasında çığır açan bilim insanı aşağıdakilerden hangisidir?", options: ["Louis Pasteur", "Alexander Fleming", "Marie Curie", "Aziz Sancar"], correctAnswer: "B", meaning: "İskoç bakteriyolog Alexander Fleming'in 1928'de penisilini keşfetmesi, antibiyotik çağını başlatarak özellikle II. Dünya Savaşı'nda milyonlarca askerin enfeksiyondan ölmesini engellemiştir." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const progressBarEl = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const wordListEl = document.getElementById('wordList');
        const catCoverEl = document.getElementById('catCover');

        function initQuiz() {
            questions = shuffleArray(quizData);
            totalEl.textContent = questions.length;
            showQuestion();
            catCoverEl.addEventListener('click', () => catCoverEl.style.display = 'none');
            window.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '4') {
                    if (catCoverEl.style.display !== 'none') {
                        catCoverEl.style.display = 'none';
                        return;
                    }
                    const idx = parseInt(e.key) - 1;
                    const btns = document.querySelectorAll('.option-btn');
                    if (btns[idx] && !btns[idx].disabled) {
                        btns[idx].click();
                    }
                }
                if (e.code === 'Space' || e.key === ' ') {
                    if (nextBtn.style.display !== 'none') {
                        nextBtn.click();
                        e.preventDefault();
                    }
                }
            });
        }

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;
            const correctText = currentQuestion.options[currentQuestion.correctAnswer.charCodeAt(0) - 65];
            const shuffledOptions = shuffleArray(currentQuestion.options);
            optionsEl.innerHTML = '';
            optionsEl.appendChild(catCoverEl);
            catCoverEl.style.display = 'flex';
            shuffledOptions.forEach(optionText => {
                const button = document.createElement('button');
                button.classList.add('option-btn', 'fade-in');
                button.textContent = optionText;
                button.onclick = () => selectAnswer(optionText, correctText, currentQuestion.meaning);
                optionsEl.appendChild(button);
            });
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            progressEl.textContent = currentQuestionIndex + 1;
            progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        }

        function selectAnswer(selectedOption, correctOptionText, meaning) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctOptionText) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selectedOption) {
                    btn.classList.add('incorrect');
                }
            });
            const isCorrect = selectedOption === correctOptionText;
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
            }
            feedbackEl.style.display = 'block';
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            feedbackTextEl.innerHTML = isCorrect ?
                `<strong>✅ Doğru!</strong><br><br>📖 ${meaning}` :
                `<strong>❌ Hatalı!</strong><br>🔍 Doğru cevap: ${correctOptionText}<br><br>📖 ${meaning}`;
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        };

        function endQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            finalScoreEl.textContent = `📊 Puanınız: ${score} / ${questions.length}`;
            wordListEl.innerHTML = '<h3 style="margin-bottom:15px;">📚 Özet Bilgi Kartları:</h3>';
            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<strong>❓ ${q.question}</strong><br><small style="color:var(--primary);">📌 ${q.meaning}</small>`;
                wordListEl.appendChild(card);
            });
        }

        initQuiz();
    </script>
</body>
</html>
