<head>

        :root {
            --primary: #2C3E50;
            --success: #27AE60;
            --danger: #C0392B;
            --light: #ECF0F1;
            --dark: #34495E;
            --accent: #D35400;
            --gold: #F1C40F;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #2C3E50 0%, #D35400 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
        }
        
        h1 { font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-bottom: 5px; }
        .subtitle { font-size: 1.1rem; opacity: 0.9; }

        .progress-container { width: 100%; background-color: #e9ecef; height: 10px; }
        .progress-bar { height: 100%; background: var(--gold); width: 0%; transition: width 0.3s ease; }
        
        .quiz-container { padding: 25px; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; background: var(--light); padding: 10px; border-radius: 8px; }
        
        .question-container { background: #fdfefe; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .question { font-size: 1.25rem; font-weight: 600; margin-bottom: 15px; }
        
        .options { display: grid; grid-template-columns: 1fr; gap: 10px; position: relative; }
        
        .cat-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(44, 62, 80, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 10px; z-index: 10; cursor: pointer;
        }
        .cat-image { max-width: 150px; border-radius: 8px; margin-bottom: 10px; border: 3px solid var(--gold); }
        .cat-text { color: white; font-weight: bold; }

        .option-btn {
            padding: 15px; border: 2px solid #ddd; border-radius: 8px;
            background: white; cursor: pointer; transition: 0.2s; text-align: left; font-size: 1.05rem;
        }
        .option-btn:hover { border-color: var(--accent); background: #fffaf0; }
        .option-btn.correct { background-color: var(--success) !important; color: white; border-color: var(--success); }
        .option-btn.incorrect { background-color: var(--danger) !important; color: white; border-color: var(--danger); }
        
        .feedback { padding: 20px; border-radius: 10px; margin-top: 20px; display: none; border-left: 5px solid; }
        .correct-feedback { background: #e8f5e9; border-color: var(--success); }
        .incorrect-feedback { background: #ffebee; border-color: var(--danger); }
        
        .next-btn {
            background: var(--primary); color: white; border: none; padding: 15px 30px;
            border-radius: 8px; font-size: 1.1rem; cursor: pointer; display: block;
            margin: 20px auto 0; width: 100%; max-width: 300px; font-weight: bold;
        }

        .results-container { padding: 30px; text-align: center; display: none; }
        .word-list { text-align: left; margin-top: 20px; }
        .word-card { background: var(--light); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
    </style>
</head>

                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const progressBarEl = document.getElementById('progressBar');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const wordListEl = document.getElementById('wordList');
        const catCoverEl = document.getElementById('catCover');

        function initQuiz() {
            questions = shuffleArray(originalQuizData);
            document.getElementById('totalCount').textContent = questions.length;
            showQuestion();
            catCoverEl.onclick = revealOptions;
        }

        function showQuestion() {
            const currentQ = questions[currentQuestionIndex];
            questionEl.innerText = currentQ.q;
            
            const shuffledOptions = shuffleArray(currentQ.options);
            
            optionsEl.innerHTML = '';
            optionsEl.appendChild(catCoverEl);
            catCoverEl.style.display = 'flex';
            catCoverEl.querySelector('img').src = `https://cataas.com/cat/says/Soru%20${currentQuestionIndex + 1}`;

            shuffledOptions.forEach(optText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(optText, currentQ);
                optionsEl.appendChild(btn);
            });
            
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            progressEl.innerText = currentQuestionIndex + 1;
            progressBarEl.style.width = ((currentQuestionIndex + 1) / questions.length * 100) + "%";
        }

        function revealOptions() {
            catCoverEl.style.display = 'none';
        }

        function checkAnswer(selected, qObj) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === qObj.a) btn.classList.add('correct');
                else if (btn.innerText === selected) btn.classList.add('incorrect');
            });

            feedbackEl.style.display = 'block';
            if (selected === qObj.a) {
                score += 10;
                scoreEl.innerText = score;
                feedbackEl.className = 'feedback correct-feedback';
                feedbackEl.innerHTML = `<strong>✅ Doğru!</strong><br>${qObj.m}`;
            } else {
                feedbackEl.className = 'feedback incorrect-feedback';
                feedbackEl.innerHTML = `<strong>❌ Yanlış!</strong> Doğru cevap: <b>${qObj.a}</b><br>${qObj.m}`;
            }
            
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) showQuestion();
            else finishQuiz();
        };

        function finishQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            finalScoreEl.innerText = `${score} / ${questions.length * 10}`;
            
            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `<b>${q.q}</b><br><small>${q.m}</small>`;
                wordListEl.appendChild(card);
            });
        }

        initQuiz();
    </script>
</body>
</html>
