<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEB-AGS Osmanlı Devleti Kültür ve Medeniyeti AI Seçkisi Testi</title>
    <style>
        :root {
            --primary: #8B4513;
            --success: #2E8B57;
            --danger: #B22222;
            --light: #F5F5DC;
            --dark: #2F4F4F;
            --accent: #D2691E;
            --gold: #FFD700;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        header::before {
            content: "🏛️";
            font-size: 3rem;
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0.3;
        }
        
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 15px 0;
            height: 12px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .quiz-container {
            padding: 25px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background-color: var(--light);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .question-container {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.5;
            font-weight: 600;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .cat-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(139, 69, 19, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cat-cover:hover {
            background-color: rgba(139, 69, 19, 0.85);
        }
        
        .cat-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .cat-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 15px;
        }
        
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            color: var(--dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        
        .correct-feedback {
            background-color: rgba(46, 139, 87, 0.1);
            border-left: 5px solid var(--success);
        }
        
        .incorrect-feedback {
            background-color: rgba(178, 34, 34, 0.1);
            border-left: 5px solid var(--danger);
        }
        
        .next-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 250px;
        }
        
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(139, 69, 19, 0.3);
        }
        
        .results-container {
            padding: 30px;
            text-align: center;
            display: none;
        }
        
        .results-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .final-score {
            font-size: 3rem;
            color: var(--accent);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .word-card {
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            background: var(--light);
            transition: all 0.3s ease;
        }
        
        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .word {
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        
        .meaning {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--dark);
        }
        
        .category {
            display: inline-block;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
            background: var(--primary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 600px) {
            .container { border-radius: 10px; }
            h1 { font-size: 1.6rem; }
            .question { font-size: 1.1rem; }
            .option-btn { padding: 14px 16px; font-size: 1rem; }
        }
    </style>
</head>

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const catCover = document.getElementById('catCover');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTextEl = document.getElementById('feedbackText');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const totalEl = document.getElementById('total');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const finalScoreEl = document.getElementById('finalScore');
        const resultMessageEl = document.getElementById('resultMessage');
        const wordListEl = document.getElementById('wordList');

        function initQuiz() {
            totalEl.textContent = questions.length;
            showQuestion();
            
            catCover.addEventListener('click', () => {
                catCover.style.display = 'none';
            });
        }

        const questions = [...quizData].sort(() => Math.random() - 0.5);

        function showQuestion() {
            answered = false;
            const currentQuestion = questions[currentQuestionIndex];
            
            questionEl.textContent = currentQuestion.question;
            
            progressEl.textContent = currentQuestionIndex + 1;
            progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
            
            optionsEl.innerHTML = '';
            optionsEl.appendChild(catCover);
            catCover.style.display = 'flex';
            
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${option}`;
                button.addEventListener('click', () => selectOption(index, button));
                optionsEl.appendChild(button);
            });
            
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
        }

        function selectOption(selectedIndex, selectedButton) {
            if (answered) return;
            answered = true;
            
            const currentQuestion = questions[currentQuestionIndex];
            const correctIndex = currentQuestion.correctAnswer.charCodeAt(0) - 65;
            const correctText = currentQuestion.options[correctIndex];
            const isCorrect = selectedIndex === correctIndex;
            
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correctIndex) btn.classList.add('correct');
                else if (idx === selectedIndex && !isCorrect) btn.classList.add('incorrect');
            });

            if (isCorrect) { score += 10; scoreEl.textContent = score; }
            
            feedbackEl.style.display = 'block';
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
            feedbackTextEl.innerHTML = isCorrect ? `✅ Doğru!<br><br>${currentQuestion.meaning}` : 
                `❌ Yanlış!<br>Doğru cevap: <strong>${correctText}</strong><br><br>${currentQuestion.meaning}`;
            
            nextBtn.style.display = 'block';
        }

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) showQuestion();
            else endQuiz();
        });

        function endQuiz() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            progressBar.style.width = '100%';
            
            const percentage = Math.round((score / (questions.length * 10)) * 100);
            finalScoreEl.textContent = `${score} Puan`;
            
            if (percentage >= 90) resultMessageEl.textContent = "Mükemmel! Osmanlı Kültür ve Medeniyeti'ne tam hakimsin! 🏆";
            else if (percentage >= 70) resultMessageEl.textContent = "Harika! Toprak sistemi ve Divan konularında çok iyisin. 👍";
            else if (percentage >= 50) resultMessageEl.textContent = "İyi gidiyorsun! Eksik olduğun ekonomi ve hukuk kavramlarına tekrar göz at. 💪";
            else resultMessageEl.textContent = "Biraz daha tekrar! Bu konu KPSS'nin kalbidir, çalışmaya devam. 📚";
            
            wordListEl.innerHTML = '<h3 style="color: var(--primary); margin-bottom: 20px;">Öğrenilen Bilgiler</h3>';
            quizData.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('word-card', 'fade-in');
                card.innerHTML = `
                    <div class="word">${item.question}</div>
                    <div class="meaning"><strong>Cevap:</strong> ${item.meaning}</div>
                    <div class="category">${item.category.toUpperCase()}</div>
                `;
                wordListEl.appendChild(card);
            });
        }

        initQuiz();
    </script>
